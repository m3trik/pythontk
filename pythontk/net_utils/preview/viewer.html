   * behind a wall) when asked. It rides the headset's layer, so a still or a
   * playblast never carries it, and starts hidden.
   *
   * Returns `{mesh, draw(paint), place(head, look, where, delta)}`: `mesh` to
   * show, hide or fade; `draw` repaints the card and hands `paint(context,
   * width, height)` the canvas to write on; `place` stands it `where.ahead` m
   * in front of `head` (a scene point) looking along `look`, `where.aside`
   * radians to its left and `where.below` m under the eyes, facing them --
   * easing a shown card there over `where.ease` s when given, since text
   * locked to the head is hard to read.
   */
  addHeadsetCard,
  /**
   * *bytes* as the page quotes a size (`B`, `KB`, `MB`; tenths below 10), so
   * a script's figures read the way the status line's do.
   */
  formatBytes,
  /**
   * A node's materials as a list: `node.material` is one material, an ARRAY
   * of them (a multi-material mesh) or absent, and a walk that forgets a case
   * skips half a mesh's materials -- one normalization, the page's own.
   */
  materialsOf,
  /**
   * Ask for options before an action, in a modal wearing the page's chrome.
   *
   * `fields` are `{key, label, type, value, title}` — `'check'` (the default)
   * is a checkbox, `'choice'` a picker over `choices: [{value, label, title}]`
   * (an unknown `value` opens on the first), and `'note'` a read-only line,
   * which is how a prompt states what it is about to do without offering it
   * as a choice. Resolves to `{key: answer}` on confirm — `checked` for a
   * check, the chosen `value` for a choice — and to **null** on cancel (the
   * Cancel button, Escape, or the backdrop), so a caller branches on the
   * answer rather than on a flag inside it.
   *
   * While it is up the page behind it is inert — no shortcut fires, and focus
   * cannot leave the prompt.
   *
   * Scripts get this rather than `window.confirm` for the reason they get
   * `addButton` rather than `createElement`: one look, one place.
   */
  showDialog,
  /**
   * `{width, height, pixelRatio}` for a capture of the view whose long edge is
   * `maxEdge`: the size to hand over, and the pixel ratio to RENDER at for it
   * -- null when the drawing buffer is already at least that large, and the
   * capture is downsampled instead. A capture is therefore a real render at
   * its size, never an upscale of a smaller one.
   *
   * Clamped to what the GPU will allocate. A canvas asked for a buffer past
   * MAX_RENDERBUFFER_SIZE does not fail; it silently allocates a smaller one,
   * and a capture would read that stretched across the frame.
   *
   * The one sizing rule for everything the page writes to a file -- a
   * playblast's frames and an exported still -- so the two cannot disagree
   * about what a size means.
   */
  captureSize(maxEdge) {
    const canvas = renderer.domElement;
    const gl = renderer.getContext();
    const [viewportWidth, viewportHeight] = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
    const limit = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), viewportWidth, viewportHeight);
    const scale = Math.min(maxEdge, limit) / Math.max(canvas.width, canvas.height);
    return {
      width: Math.max(1, Math.round(canvas.width * scale)),
      height: Math.max(1, Math.round(canvas.height * scale)),
      pixelRatio: scale > 1 ? renderer.getPixelRatio() * scale : null,
    };
  },
  /**
   * Why the server refused `response`, as a sentence to put in the status
   * line. The server states it (a frame ceiling, no ffmpeg, a body that is not
   * an image); showing "500" instead sends the user to a console they cannot
   * open in a headset.
   *
   * `send_error` puts the message in the status line AND in its HTML body, so
   * statusText is the cheap read and the body the fallback for a proxy or a
   * browser that drops the reason phrase. The body match stops at the tag, not
   * at the first full stop -- these messages are sentences.
   */
  async refusal(response) {
    if (response.statusText) return response.statusText;
    const text = await response.text().catch(() => '');
    const match = text.match(/<p>Message:\s*([^<]+)/i);
    return (match ? match[1] : `HTTP ${response.status}`).trim().replace(/\.$/, '');
  },
  /**
   * Save a file this server serves as a download, rather than navigating the
   * page to it -- which in a headset would replace the preview with an image
   * viewer or a video player.
   *
   * A browser honours `download` on the page's OWN origin only, and this page
   * is as validly open at localhost as at 127.0.0.1: pass a path relative to
   * the page, or a route that answers with `Content-Disposition: attachment`
   * (a recording's does), or a tab opened by the other spelling navigates.
   */
  download(url) {
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = '';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
  },
};

function emit(event, detail) {
  for (const fn of scriptHooks[event] || []) {
    try {
      fn(detail, viewer);
    } catch (error) {
      console.warn(`viewer script threw on '${event}':`, error);
    }
  }
}

async function loadScripts(urls) {
  for (const url of urls || []) {
    if (loadedScripts.has(url)) continue;
    // Claimed BEFORE the await: poll() fires once a second and the import is
    // async, so a second poll landing mid-import would otherwise load and
    // initialise the same module twice — two turntables fighting over one
    // rotation, and two buttons for it.
    loadedScripts.add(url);
    try {
      const module = await import(`./${url}`);
      await module.default?.(viewer);
    } catch (error) {
      console.warn(`viewer script failed to load: ${url}`, error);
    }
  }
}

/* ----------------------------------------------------------------- poll --- */

// This tab's id, on every manifest poll and on the close beacon. A share counts
// its guests by it -- one per open tab, however many sit behind one address --
// and the owner's own listener ignores it.
const VIEWER_ID = Math.random().toString(36).slice(2, 12);
// Set from the manifest: a view-only share (the server's guest listener) says
// so, and the page then offers nothing that writes. That listener refuses every
// write, so each such control would be one that fails.
let isGuest = false;
// Set from the manifest: the name of the node views start at (null: none).
let userPosName = null;

let seenVersion = -1;
let failedVersion = -1;
let failCount = 0;
// Fingerprint of THIS page as the server published it. The poll swaps the
// model but never the script running it, so when the server starts naming a
// different page the one in this tab is stale and reloads itself -- a viewer
// fix otherwise reaches a session left open only via F5.
let viewerStamp = null;

async function poll() {
  try {
    const manifest = await (await fetch(`manifest.json?id=${VIEWER_ID}`, { cache: 'no-store' })).json();
    if (manifest.viewer) {
      if (viewerStamp !== null && manifest.viewer !== viewerStamp) {
        setStatus('viewer updated - reloading…');
        location.reload();
        return;
      }
      viewerStamp = manifest.viewer;
    }
    if (manifest.title) el.title.textContent = manifest.title;
    // Ahead of the load, which looks the node up by it. Live: a new name finds
    // its node for the NEXT session without a publish, while the desktop view
    // and a session under way stay where they are.
    if ((manifest.userPos ?? null) !== userPosName) {
      userPosName = manifest.userPos ?? null;
      if (current) startNode = findStartNode(current, userPosName);
    }
    // Live too, and at once: switched off, a headset mid-session stops going
    // anywhere on this poll -- a guest's included.
    locomotion.enabled = manifest.locomotion !== false;
    // Ahead of the scripts below, which may ask `viewer.guest` as they load.
    isGuest = manifest.guest === true;
    el.normalSave.hidden = isGuest;
    // Ahead of the version check, so it lands on the FIRST poll rather than
    // waiting for a publish: this is what turns "connect a headset" into
    // "start Link" for someone who already did connect one.
    if (manifest.xrRuntime !== undefined
        && manifest.xrRuntime !== xrRuntimeInstalled) {
      xrRuntimeInstalled = manifest.xrRuntime;
      if (navigator.xr) refreshXrSupport();
    }
    // Ahead of the version check: the active set is decided per push, and the
    // FIRST poll happens before anything is published at all — gated behind
    // the early return, a script named on a server that has yet to publish
    // would never load. Already-loaded URLs are skipped inside.
    //
    // AWAITED, so a script activated by the same push that named the asset is
    // initialised before the model loads and cannot miss its 'load' event: a
    // small GLB parses in less time than an ES module takes to arrive
    // (measured on KB-scale fixtures), which left the shadow shim with no
    // scene. A push whose scripts fail still loads the model — loadScripts
    // catches per module.
    await loadScripts(manifest.scripts);
    if (manifest.version === seenVersion) return;
    // A version that has failed its budget is abandoned until a new publish
    // supersedes it — otherwise a genuinely corrupt GLB re-parses every second.
    if (manifest.version === failedVersion && failCount >= LOAD_RETRIES) return;

    if (!manifest.asset) {
      seenVersion = manifest.version;
      setStatus('waiting for the first publish…');
      return;
    }

    seenVersion = manifest.version;
    // The query string is what actually defeats a warm HTTP cache when the
    // asset keeps a stable name across pushes.
    const ok = await load(`${manifest.asset}?v=${manifest.version}`, manifest.version);
    if (ok === null) return; // superseded mid-load — the newer call owns the bookkeeping
    if (ok) {
      failedVersion = -1;
      failCount = 0;
      return;
    }
    // Leaving the version marked as seen is what would strand the page: a
    // transient failure must not stop the next poll from trying it again.
    failCount = manifest.version === failedVersion ? failCount + 1 : 1;
    failedVersion = manifest.version;
    seenVersion = -1;
  } catch (error) {
    setStatus('server unreachable', 'error');
  }
}

poll();
setInterval(poll, POLL_MS);

// Tell the server the moment this page goes away, so the next push reopens a
// tab instead of publishing to nothing. Without it the server can only infer a
// closed viewer from polls stopping, and that inference has to wait out a
// window long enough to tolerate hidden-tab timer throttling (~1/min) — so a
// close-then-push would otherwise show nothing at all for a minute and a half.
// `pagehide` rather than `unload`: it is the event that still fires on mobile
// and bfcache paths, and sendBeacon is the only send that survives teardown.
// A page restored from bfcache simply polls again and re-arms the server.
addEventListener('pagehide', () => { navigator.sendBeacon(`viewer-closed?id=${VIEWER_ID}`, ''); });

/* -------------------------------------------------------------- dialog --- */

// Resolver of the prompt currently on screen, and the flag for "a dialog is
// open" — the page's keyboard shortcuts read it, because Space toggling a
// checkbox must not also pause the transport behind the modal.
let dialogResolve = null;

// The page behind a prompt is INERT while it is up, not merely unbound:
// swallowing its shortcuts left Tab free to walk focus out of the modal to the
// controls it covers, the clip picker among them -- where an arrow key changes
// the clip the prompt names. Every top-level node but the dialog, so the
// transport, the bar, the canvas and the VR button go together.
function setPageInert(inert) {
  for (const node of document.body.children) {
    if (node !== el.dialog) node.inert = inert;
  }
}

function closeDialog(confirmed) {
  if (!dialogResolve) return;
  const resolve = dialogResolve;
  dialogResolve = null;
  el.dialog.hidden = true;
  setPageInert(false);
  resolve(confirmed);
}

// See `viewer.showDialog` for the contract this implements.
function showDialog({ title = '', fields = [], confirm = 'OK' } = {}) {
  // A second prompt REPLACES the first rather than stacking: there is one
  // modal, and leaving an orphaned promise unresolved would hang whichever
  // script is waiting on it.
  closeDialog(false);
  el.dialogTitle.textContent = title;
  //: key -> a reader for that field's answer, so the resolve below needs no
  //: idea which kind of control each one is.
  const answers = new Map();
  el.dialogFields.replaceChildren(...fields.map((field) => {
    if (field.type === 'note') {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = field.label;
      return note;
    }
    const label = document.createElement('label');
    if (field.title) label.title = field.title;
    if (field.type === 'choice') {
      label.className = 'choice';
      const select = document.createElement('select');
      select.className = 'ui';
      for (const choice of field.choices || []) {
        const option = document.createElement('option');
        option.value = choice.value;
        option.textContent = choice.label;
        if (choice.title) option.title = choice.title;
        select.append(option);
      }
      select.value = field.value ?? '';
      // Assigning a value no option carries leaves NOTHING selected, and a
      // prompt that confirms an empty answer hands the caller a value it never
      // offered -- a remembered choice the page has since dropped, say.
      if (select.selectedIndex < 0 && select.options.length) select.selectedIndex = 0;
      label.append(document.createTextNode(field.label), select);
      answers.set(field.key, () => select.value);
      return label;
    }
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!field.value;
    // A text NODE rather than innerHTML: a field label can carry a shot name
    // or a description straight out of the deliverable.
    label.append(input, document.createTextNode(field.label));
    answers.set(field.key, () => input.checked);
    return label;
  }));
  el.dialogConfirm.textContent = confirm;
  el.dialog.hidden = false;
  setPageInert(true);
  // The confirm button, not the first field: Enter then does the obvious
  // thing, and the common answer to an options prompt is "yes, as they are".
  el.dialogConfirm.focus();
  return new Promise((resolve) => {
    dialogResolve = (confirmed) => resolve(
      confirmed
        ? Object.fromEntries([...answers].map(([key, read]) => [key, read()]))
        : null
    );
  });
}

el.dialogForm.addEventListener('submit', (event) => {
  event.preventDefault();
  closeDialog(true);
});
el.dialogCancel.addEventListener('click', () => closeDialog(false));
// The backdrop only — a click that started inside the panel and drifted out
// (selecting a label's text) lands on the form, not on this.
el.dialog.addEventListener('mousedown', (event) => {
  if (event.target === el.dialog) closeDialog(false);
});

/* ------------------------------------------------------------------ ui  --- */

el.frameBtn.addEventListener('click', () => frameCamera());
el.normalScale.addEventListener('input', () => applyNormalScale(Number(el.normalScale.value)));
el.normalSave.addEventListener('click', saveNormalScale);
el.clipSelect.addEventListener('change', () => selectClip(Number(el.clipSelect.value)));
el.playToggle.addEventListener('click', togglePlay);
// `input` fires throughout the drag (and on every arrow key), `change` at the
// end of one — which is what hands the playhead back to the frame loop.
el.scrub.addEventListener('input', () => { scrubbing = true; seek(Number(el.scrub.value) / 1000); });
el.scrub.addEventListener('change', () => { scrubbing = false; });
addEventListener('keydown', (event) => {
  // A modal takes the keyboard whole, scripts included: Space is a checkbox in
  // there and would otherwise also pause the transport, and a script's own
  // shortcut would act behind the prompt. Escape dismisses it.
  if (dialogResolve) {
    if (event.key === 'Escape') closeDialog(false);
    return;
  }
  // A letter typed into the clip picker is that control's own type-ahead, so
  // the page's single-letter shortcuts must not fire on top of it -- reaching
  // for "(full range)" would otherwise re-frame the camera on the way. Only
  // the picker: the sliders use arrows, which this page has no shortcut for,
  // and excluding them would cost Space-to-pause after a scrub.
  if (event.target === el.clipSelect) return;
  if (event.key === 'f') frameCamera();
  // Guarded on there being a mixer: with no clips these keys mean nothing, and
  // Space would otherwise flip a play state the next animated push inherits.
  if (mixer) {
    if (event.code === 'Space') { event.preventDefault(); togglePlay(); }
    if (event.key === '[') stepClip(-1);
    if (event.key === ']') stepClip(1);
  }
  // Last, so the page's own shortcuts can never be shadowed by a script.
  emit('key', event);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// `delta` rather than a raw timestamp: a script animating anything has to be
// framerate-independent, and a headset runs this loop at 72-120 Hz against a
// desktop's 60.
const frameClock = new THREE.Clock();

// `frame` is the XRFrame while a headset is presenting, and absent otherwise.
renderer.setAnimationLoop((time, frame) => {
  const began = performance.now();
  controls.update();
  const delta = frameClock.getDelta();
  if (frame && headsetSpace) stepHeadset(frame, delta, time);
  // Before the hook, so a script's 'frame' callback sees the model posed for
  // THIS frame rather than the previous one.
  if (mixer) {
    if (activeSequence) {
      // The sequence advances its own clock and POSES through applySequence;
      // handing the same delta to the mixer as well would advance the segment
      // action a second time and run it ahead of the playhead.
      if (playing) {
        sequenceTime += delta;
        if (sequenceTime >= activeSequence.duration) sequenceTime = 0;  // loop
      }
      applySequence(sequenceTime);
    } else {
      mixer.update(delta);
    }
    updateTransport();
  }
  emit('frame', { delta, time });
  const rendering = performance.now();
  renderer.render(scene, camera);
  const rendered = performance.now();
  // The first frame after a load is where its programs compile and its
  // textures upload -- the hitch a big deliverable costs before it moves.
  if (firstFramePending && specs) {
    firstFramePending = false;
    specs.load.firstFrameMs = rendered - rendering;
  }
  // After the draw, for a script that measures one (the packaged `inspect`
  // brackets it with a GPU timer query between 'frame' and here). The times
  // are the page's CPU time for the frame and the part of it spent inside
  // `renderer.render` submitting the draw; the GPU works asynchronously, and
  // its own time is only what a query reads back.
  emit('rendered', { delta, time, cpuMs: rendered - began, renderMs: rendered - rendering });
});
</script>
</body>
</html>
