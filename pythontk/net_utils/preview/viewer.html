<!doctype html>
<!--
  Live WebXR preview page served by pythontk.PreviewServer.

  Polls /manifest.json and swaps the referenced asset in whenever the version
  changes, so a tab left open in a headset keeps up with the DCC without any
  interaction. Served from localhost, which is a secure context, so
  `navigator.xr` is available and the VR button starts a real immersive-vr
  session on any PC-tethered headset. With no headset attached the same page is
  an ordinary orbit-controls preview.

  A caller-supplied serve root is treated as a working copy: an index.html
  already there is never overwritten, so edits made in place survive a restart.
  The default (temp) root is re-synced from this file on every start and every
  publish, so an edit here reaches an already-running session on its next push.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Live Preview</title>
<!--
  Inline, so the browser never issues its automatic /favicon.ico request. The
  serve root holds the deliverable and nothing else, so that request 404s, and
  a red "Failed to load resource" in the console of every preview session is a
  false lead for anyone opening devtools because something IS wrong.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2315171a'/%3E%3Cpath d='M8 2.6l4.6 2.7v5.4L8 13.4 3.4 10.7V5.3z' fill='none' stroke='%237cc3ff' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #15171a; font: 13px/1.5 system-ui, sans-serif; color: #e8eaed; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px;
    background: rgba(20, 22, 26, .82); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 8px; backdrop-filter: blur(8px); pointer-events: none;
    max-width: min(46ch, calc(100vw - 24px));
  }
  #title { font-weight: 600; margin-bottom: 2px; }
  #stats, #hint { color: #9aa0a6; font-size: 12px; }
  #hint { margin-top: 6px; }
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7a7f85; margin-right: 7px; vertical-align: middle;
  }
  #status.live::before { background: #34d058; }
  #status.error::before { background: #f2504b; }
  /* Wraps: the row carries the lookdev panel, and a narrow viewport (a phone
     holding a headset preview) would otherwise push the last control off. */
  #controls {
    position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px;
    flex-wrap: wrap; max-width: calc(100vw - 24px);
  }
  /* Above the button row, and only while the model has clips. Its own row
     because a scrubber needs width the button bar has no room for. */
  #anim {
    position: fixed; bottom: 56px; left: 12px; display: flex; gap: 8px;
    align-items: center; max-width: calc(100vw - 24px);
  }
  #anim[hidden] { display: none; }
  button.ui, select.ui {
    font: inherit; color: #e8eaed; background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  button.ui:hover, select.ui:hover { border-color: rgba(255, 255, 255, .34); }
  select.ui { max-width: 30ch; }
  #scrub { width: 220px; accent-color: #6fb3ff; cursor: pointer; }
  #clipTime { color: #9aa0a6; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* Lookdev -- the area for dials that tune how the model READS and write the
     result back into the GLB (see LOOKDEV_ENABLED). A transparent row rather
     than one chrome box: each dial wears its own, so the second and third land
     beside the first without any of them being restyled. */
  #lookdev { display: flex; align-items: center; gap: 8px; }
  #lookdev[hidden] { display: none; }
  /* A dial rather than a toggle, so it wears the button chrome without the
     pointer affordance -- only the slider inside it is grabbable. The chrome is
     restated because `button.ui, select.ui` does not match a span, and without
     it the control renders as bare text over the model. */
  #normals {
    display: flex; align-items: center; gap: 8px; cursor: default;
    color: #9aa0a6; font: inherit;
    background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 4px 8px 4px 14px;
  }
  #normals[hidden] { display: none; }
  #normalScale { width: 110px; accent-color: #6fb3ff; cursor: pointer; }
  #normalValue { font-variant-numeric: tabular-nums; color: #e8eaed; min-width: 3ch; }
  #normalSave { padding: 4px 10px; }
  #normalSave:disabled { opacity: .45; cursor: default; border-color: rgba(255, 255, 255, .16); }
  /* VRButton positions itself bottom-center with inline styles; leave it be. */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div id="title">Preview</div>
  <div id="status">connecting…</div>
  <div id="stats"></div>
  <div id="hint"></div>
</div>

<div id="anim" hidden>
  <select class="ui" id="clipSelect" title="Which animation clip to play. Shots declared in the DCC are listed first; a clip marked (full range) is the whole timeline the exporter kept alongside them."></select>
  <button class="ui" id="playToggle" title="Play / pause (space)">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1"
         title="Scrub the current clip">
  <span id="clipTime"></span>
</div>

<div id="controls">
  <button class="ui" id="scaleToggle" title="Toggle between a fitted preview size and the model's true scale">Scale: fit</button>
  <button class="ui" id="frameBtn" title="Re-frame the camera on the model">Frame</button>
  <button class="ui" id="lightToggle" hidden
          title="Baked lighting plus a dim environment (which is what makes normal maps and specular visible), or the bake on its own">Light: bake + env</button>
  <div id="lookdev" hidden>
    <span class="ui" id="normals" hidden
          title="How strongly the normal maps read on the baked materials. A lightmap carries no direction, so on its own it cannot show a normal map; the preview relieves the bake along the key-light direction so the map reads the way it would under a runtime light. 0 is the pure bake. Save writes the value into the GLB itself as normalTexture.scale.">
      Normals
      <input id="normalScale" type="range" min="0" max="4" step="0.05" value="1"
             title="Normal map strength on baked materials">
      <span id="normalValue">1.00</span>
      <button class="ui" id="normalSave" disabled
              title="Write this strength into the GLB as normalTexture.scale, so it ships with the file">Save</button>
    </span>
  </div>
</div>

<script>
  // Boot watchdog — a CLASSIC script on purpose. Everything below rides three
  // module imports from unpkg.com, and when that fetch is blocked (offline
  // box, default-deny outbound firewall — a real deployment here) the module
  // simply never executes: no error event, no status change, just a dark page
  // stuck on "connecting…" with the actual failure invisible. The module's
  // first statement flips the flag; if it hasn't within 8s, say what is
  // actually wrong. A slow CDN that boots later overwrites this on next poll.
  setTimeout(() => {
    if (window.__viewerBooted) return;
    const status = document.getElementById('status');
    status.textContent = 'three.js failed to load — this page needs https://unpkg.com (check network / outbound firewall)';
    status.className = 'error';
  }, 8000);
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__viewerBooted = true; // imports resolved — stand the boot watchdog down

const POLL_MS = 1000;
const LOAD_RETRIES = 3;
// Fitted mode normalizes the model to a human-readable size in the headset.
// It exists because exported units are rarely meters: a Maya scene authored in
// centimeters arrives 100x too large, and "my model is invisible because I am
// standing inside it" is the single most common first-run failure.
const FIT_HEIGHT_M = 1.5;
const FIT_DISTANCE_M = 1.6;

const el = {
  title: document.getElementById('title'),
  status: document.getElementById('status'),
  stats: document.getElementById('stats'),
  hint: document.getElementById('hint'),
  scaleToggle: document.getElementById('scaleToggle'),
  frameBtn: document.getElementById('frameBtn'),
  lightToggle: document.getElementById('lightToggle'),
  anim: document.getElementById('anim'),
  clipSelect: document.getElementById('clipSelect'),
  playToggle: document.getElementById('playToggle'),
  scrub: document.getElementById('scrub'),
  clipTime: document.getElementById('clipTime'),
  lookdev: document.getElementById('lookdev'),
  normals: document.getElementById('normals'),
  normalScale: document.getElementById('normalScale'),
  normalValue: document.getElementById('normalValue'),
  normalSave: document.getElementById('normalSave'),
};

/* ---------------------------------------------------------------- scene --- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const pmrem = new THREE.PMREMGenerator(renderer);
// Assigned for the life of the session, and SHARED: a lightmapped model used to switch
// this off entirely; it is now only dimmed, and dimmed per material, because switching it
// off takes every normal map with it (see LIGHTMAP_ENV_INTENSITY). Baked materials point
// their own `envMap` at this same texture, so `disposeModel` must not free it.
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// The RoomEnvironment IBL above is the main light. Piling a bright hemisphere
// and key light on top of it (as this once did, at 1.6 and 2.2) drives every
// surface to clipping, and a blown-out surface cannot show emissive at all:
// the emissive term is *added* to the lit result, so once the diffuse is
// already past white it contributes nothing visible. Measured before the fix:
// a material with emissiveFactor [1,0,0] rendered (247,242,243) — a red bias
// of five 8-bit levels, indistinguishable from white. One modest key light for
// form definition is enough alongside the environment.
const DEFAULT_KEY_INTENSITY = 0.9;
// How much environment a LIGHTMAPPED scene keeps. Not zero, and that is the whole point:
// three.js adds lightmap irradiance through BRDF_Lambert, which has no normal term, so a
// bake supplies light that does not vary with the surface normal at all. Switch the
// viewer's own lighting fully off and nothing left in the render samples the normal --
// normal maps, roughness and every specular highlight go inert and the model reads dead
// flat. Measured on a production room: 51 of 57 materials lightmapped, all 54 normal maps
// correctly bound at texCoord 0, no surface detail visible anywhere. The environment is
// the right thing to keep because it is omnidirectional -- it cannot contradict the bake's
// shadow DIRECTION the way a key light would -- and its view/normal-dependent specular
// term (getIBLRadiance, which takes the normal) is exactly what makes a normal map
// legible. The key light still goes off when the model is FULLY baked; a directional
// diffuse gradient is precisely the second, contradictory rig to avoid. It cannot be
// withdrawn per material without render layers, so a partly-baked model keeps it for the
// sake of the props that have no bake to contradict (see applyLighting).
//
// Applied PER MATERIAL. The obstacle is that a material-level `envMapIntensity` is
// silently overwritten for exactly the materials this affects --
//
//     if (material.isMeshStandardMaterial && material.envMap === null
//         && scene.environment !== null) m_uniforms.envMapIntensity.value
//                                            = scene.environmentIntensity;
//
// and every GLTFLoader material is a MeshStandardMaterial with no envMap of its own, so
// setting the property alone does nothing at all (an earlier revision of this fix did
// exactly that). The opt-out is the `envMap === null` clause: give a baked material the
// SHARED environment as its own envMap and the renderer stops overwriting it. That costs
// no extra upload -- it is the texture the scene was already lighting with -- and the only
// thing it demands in return is that `disposeModel` spare it, since the model does not own
// it. The scene-wide alternative dims a partly-baked model's UN-baked props along with the
// baked geometry, for a reason invisible from the model, and scenes are routinely partly
// baked (measured on a production room: 51 of 57 materials).
const LIGHTMAP_ENV_INTENSITY = 0.25;
// The environment level everything NOT lightmapped is lit at, and the exposure
// the look was approved through. Declared as named constants for the same
// reason as the two above: they are the FALLBACKS the published policy is read
// against (see readRenderingPolicy), and a fallback that only exists inline is
// one a test cannot compare with what the deliverable actually ships.
const DEFAULT_ENV_INTENSITY = 1;
const DEFAULT_TONE_EXPOSURE = 1;

// The rig this page renders with. The values above are what it FALLS BACK to;
// the live ones come from the deliverable itself, which publishes the whole
// recipe as `handoff.rendering` inside its own scene sidecar. That direction
// matters: the asset carries no lights, so the policy is part of the hand-off,
// and while the viewer defined its own numbers the published recipe could only
// be kept honest by a test pinning the two spellings together. Now the file is
// the source and this page is one of its readers.
const POLICY_FALLBACK = Object.freeze({
  keyIntensity: DEFAULT_KEY_INTENSITY,
  lightmapEnvIntensity: LIGHTMAP_ENV_INTENSITY,
  environmentIntensity: DEFAULT_ENV_INTENSITY,
  toneMappingExposure: DEFAULT_TONE_EXPOSURE,
});
let policy = { ...POLICY_FALLBACK };

// One `extras` block, wherever it rides. Three holders are real: the first
// scene's extras (a native DCC export writes there), the glTF ROOT's (where
// every MeshConvert applier writes), and `scene.userData` (GLTFLoader's parsed
// copy of the scene's). A value can also be a JSON string rather than an
// object, depending on the producer. This page reads three such blocks
// (`scene_sidecar`, `lightmap_web`, `animation_web`) and hand-rolling the probe
// per block is how one of them ends up missing a holder and going silently
// inert on a deliverable the others handle.
function readExtras(gltf, key) {
  for (const holder of [
    gltf.parser?.json?.scenes?.[0]?.extras,
    gltf.parser?.json?.extras,
    gltf.scene?.userData,
  ]) {
    const raw = holder && holder[key];
    if (!raw) continue;
    if (typeof raw !== 'string') return raw;
    try { return JSON.parse(raw); } catch { /* keep looking */ }
  }
  return null;
}

// Reads `extras.scene_sidecar.handoff.rendering`, written by
// MeshConvert.apply_scene_sidecar. Every field is taken only if it is a finite
// NUMBER: the published policy is documentation as much as data, so some of its
// entries are deliberately prose (`lightMapIntensity` says "per material, from
// extras.lightmap_web"), and a viewer that assigned a string to an intensity
// would render black with nothing in the file looking wrong. An older GLB, or
// one from another producer, simply keeps the fallbacks.
function readRenderingPolicy(gltf) {
  const published = readExtras(gltf, 'scene_sidecar')?.handoff?.rendering;
  const num = (value, fallback) =>
    (typeof value === 'number' && isFinite(value) ? value : fallback);
  // Falling back through POLICY_FALLBACK rather than through the constants
  // again: one table names what this page does without a published policy, and
  // it is the same table the initial value is taken from.
  policy = {
    keyIntensity: num(published?.keyLight?.intensity, POLICY_FALLBACK.keyIntensity),
    lightmapEnvIntensity: num(
      published?.lightmappedMaterials?.envMapIntensity,
      POLICY_FALLBACK.lightmapEnvIntensity),
    environmentIntensity: num(
      published?.environment?.intensity, POLICY_FALLBACK.environmentIntensity),
    toneMappingExposure: num(
      published?.renderer?.toneMappingExposure, POLICY_FALLBACK.toneMappingExposure),
  };
  renderer.toneMappingExposure = policy.toneMappingExposure;
}

const keyLight = new THREE.DirectionalLight(0xffffff, DEFAULT_KEY_INTENSITY);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);

const grid = new THREE.GridHelper(20, 40, 0x3a3f45, 0x25292e);
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 500);
camera.position.set(2.2, 1.8, 2.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

// Everything loaded hangs off this pivot, so swapping models and re-scaling
// never touches the lights, grid or camera rig.
const pivot = new THREE.Group();
scene.add(pivot);

/* ------------------------------------------------------------------- xr --- */

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
    if (supported) {
      document.body.appendChild(VRButton.createButton(renderer));
      el.hint.textContent = 'Headset detected — press Enter VR.';
    } else {
      el.hint.textContent = 'No immersive-vr device. Connect a headset, then reload.';
    }
  });
} else {
  // Reachable when the page is opened over a plain-HTTP LAN address rather
  // than localhost: WebXR is gated on a secure context, and the failure is
  // otherwise silent (the button simply never appears).
  el.hint.textContent = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'WebXR unavailable in this browser. Try Chrome or Edge.'
    : 'WebXR needs localhost or HTTPS — this page was opened over plain HTTP.';
}

/* ---------------------------------------------------------------- model --- */

const loader = new GLTFLoader();
// KTX2/Basis support (KHR_texture_basisu) — what the deliverer's opt-in
// texture_format="KTX2" mode emits, and REQUIRED by those GLBs (they carry no
// fallback image). One transcoder serves both Basis codecs (ETC1S and UASTC);
// detectSupport picks the GPU target per device — ASTC on a standalone
// headset, BC7/DXT on desktop — which is the whole point: the texture stays
// block-compressed in GPU memory instead of decoding to RGBA. The wasm rides
// the same unpkg CDN as every import above, a dependency the boot watchdog
// already owns. Inert for WebP/PNG deliverables.
const ktx2Loader = new KTX2Loader()
  .setTranscoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/basis/')
  .detectSupport(renderer);
loader.setKTX2Loader(ktx2Loader);
let current = null;
let realScale = false;
let modelBounds = null;

// `node.material` is a single material, an ARRAY of them (a multi-material mesh), or
// absent (any non-mesh in the graph). Every walk below has to handle all three, so the
// normalization lives here once — three hand-rolled copies is exactly how one of them ends
// up quietly missing the array case and skipping half a mesh's materials.
function materialsOf(node) {
  if (Array.isArray(node.material)) return node.material;
  return node.material ? [node.material] : [];
}

function disposeModel(root) {
  // GLTFLoader allocates GPU resources that garbage collection cannot reclaim;
  // without this an edit-and-republish loop leaks a full copy of the model's
  // buffers and textures every single push.
  root.traverse((node) => {
    if (node.geometry) node.geometry.dispose();
    for (const material of materialsOf(node)) {
      for (const value of Object.values(material)) {
        // Everything here belongs to the MODEL and dies with it — except the
        // shared environment, which is session-owned and assigned onto each
        // lightmapped material to win back per-material `envMapIntensity`
        // (see applyLighting). Disposing that would take the environment out
        // from under every later push, and the model is not its owner.
        if (value && value.isTexture && value !== scene.environment) value.dispose();
      }
      material.dispose();
    }
  });
}

function layout() {
  if (!current || !modelBounds) return;
  const { size, center } = modelBounds;
  const height = Math.max(size.y, 1e-6);
  const scale = realScale ? 1 : FIT_HEIGHT_M / height;

  current.scale.setScalar(scale);
  // Center on the floor plane. The model is centred on the PIVOT's origin in X
  // and Z and stood on its floor plane in Y, and the "push it out in front of
  // the standing position" offset is carried by the pivot itself rather than
  // folded in here. The composed world transform is identical -- the pivot has
  // no rotation of its own -- but the split is what makes `pivot.rotation.y` a
  // spin instead of an orbit: with the offset baked into the model, rotating
  // the pivot swung the model around the viewer at FIT_DISTANCE_M radius,
  // which is wrong on a desk and sickening in a headset. `viewer.pivot` is
  // handed to every viewer script (the packaged `turntable` is exactly this
  // rotation), so the group they are given has to spin about the model.
  current.position.set(
    -center.x * scale,
    -(center.y - size.y / 2) * scale,
    -center.z * scale,
  );
  pivot.position.set(0, 0, realScale ? 0 : -FIT_DISTANCE_M);

  el.scaleToggle.textContent = `Scale: ${realScale ? 'real' : 'fit'}`;
  frameCamera();
}

function frameCamera() {
  if (!current) return;
  const box = new THREE.Box3().setFromObject(current);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.05);
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));

  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0.7, 0.5, 1).normalize().multiplyScalar(distance * 1.3));
  camera.near = Math.max(distance / 1000, 0.01);
  camera.far = distance * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

/* ------------------------------------------------------------- lightmaps --- */

// glTF 2.0 has no lightmap slot, so a baked lightmap reaches us disguised as a real
// texture slot on TEXCOORD_1 (see blendertk's LightmapWebExport). The scene extras carry
// a `lightmap_web` manifest naming which materials are wearing the disguise; this puts
// them back. Three details decide whether it looks right or subtly wrong:
//
//   * colorSpace — GLTFLoader treats occlusion as DATA and loads it linear, but the map
//     was written sRGB-encoded to survive 8-bit. Left linear it renders far too dark.
//   * channel — the map is packed against UV2, not UV0.
//   * intensity — the encoder divided by a percentile to fit a huge HDR range into a PNG;
//     multiplying it back is what restores the original exposure.
//
// Also clears the slot it arrived in, so the same texture is not applied twice under two
// different interpretations. Returns how many materials it bound, which is what decides
// the scene's lighting policy (see applyLighting).
//
// Which real slot each carrier arrives in — mirrors blendertk's LightmapWebExport.CARRIERS.
// A Map rather than an object literal because the lookup decides whether to REBIND a
// material: property access on an object literal walks the prototype chain, so a manifest
// naming 'constructor' as its carrier would hand back a truthy function and slip past the
// refusal below. Map.get answers only for keys actually in the table.
const CARRIER_SLOTS = new Map([['occlusion', 'aoMap'], ['emissive', 'emissiveMap']]);

// Let the normal map show on a BAKED surface.
//
// A lightmap is irradiance with no direction in it: three.js adds the texel
// to the diffuse term and never consults the normal, so on a baked material
// the normal map reaches the picture only through the environment -- which
// applyLighting dims to a quarter, because that surface's lighting is already
// in its bake. Measured on a production room: normalScale 1 -> 4 moved ~1% of
// pixels by ~0.4/255. A normal map that cannot be seen is the same as one that
// is missing, which is how it was reported ("no normal effect at all").
//
// The fix modulates the bake by the map. The baked light is taken to arrive
// along the page's own key-light direction, and the lightmap texel is scaled
// by how the PERTURBED normal faces that direction relative to how the flat
// one does -- half-Lambert wrapped so the ratio is well-behaved on a surface
// facing away, and exactly 1 wherever the map is flat, so normalScale 0 (and a
// material with no normal map) renders the pure bake. Not a second bake and
// not physically derived: it is the single-direction reduction of the
// directional-lightmap trick, chosen because it is one uniform and five lines
// of GLSL, and because it makes `normalTexture.scale` -- the value the file
// carries -- do in this preview what it does in a runtime that lights.
//
// Patched at `irradiance += lightMapIrradiance;`, the one line in three.js
// 0.169's `lights_fragment_maps` chunk that adds the bake; `normal` is the
// perturbed normal there and `nonPerturbedNormal` the geometry's own. The
// key light is a world direction and the shader works in view space, so it
// is turned per fragment with the `viewMatrix` three.js already provides.
//
// The hook receives the source with its `#include <...>` directives still
// UNEXPANDED (the renderer resolves them afterwards), so the line cannot be
// matched in what the hook is handed: the directive is replaced with the
// chunk itself, edited. A replace aimed at the line directly is a silent
// no-op -- measured, the "patched" render moved the same ~1% of pixels as
// the unpatched one.
const bakeLightDir = { value: new THREE.Vector3() };
const RELIEF_GLSL = [
  '{',
  '  vec3 bakeL = normalize( ( viewMatrix * vec4( bakeLightDir, 0.0 ) ).xyz );',
  // `flat` is a reserved word in GLSL (an interpolation qualifier).
  '  float bumpLit = dot( normal, bakeL ) * 0.5 + 0.5;',
  '  float baseLit = dot( nonPerturbedNormal, bakeL ) * 0.5 + 0.5;',
  '  irradiance += lightMapIrradiance * clamp( bumpLit / max( baseLit, 0.05 ), 0.0, 2.0 );',
  '}',
].join('\n');

function reliefFromNormalMap(material) {
  bakeLightDir.value.copy(keyLight.position).normalize();
  material.onBeforeCompile = (shader) => {
    shader.uniforms.bakeLightDir = bakeLightDir;
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 bakeLightDir;')
      .replace(
        '#include <lights_fragment_maps>',
        THREE.ShaderChunk.lights_fragment_maps.replace(
          'irradiance += lightMapIrradiance;', RELIEF_GLSL,
        ),
      );
  };
  // A distinct program from a plain lightmapped material's, or the renderer
  // would hand one of them the other's shader.
  material.customProgramCacheKey = () => 'lightmap-relief';
}

function applyLightmaps(gltf) {
  const manifest = readExtras(gltf, 'lightmap_web');
  if (!manifest || !manifest.materials) return 0;

  // An unknown carrier is REFUSED rather than defaulted. The previous form special-cased
  // 'fused' (a bake level both DCC tools have since removed, so nothing can emit it) and
  // sent everything else to aoMap, so the only branch it had was dead while any future or
  // misspelled carrier would be rebound under the interpretation it is least likely to
  // want. Not binding leaves the map in the slot it arrived in, where it still reads as
  // plausible occlusion.
  const carrier = manifest.carrier || 'occlusion';
  const slot = CARRIER_SLOTS.get(carrier);
  if (!slot) return 0;

  const uv = manifest.uv ?? 1;
  let bound = 0;

  gltf.scene.traverse((node) => {
    for (const material of materialsOf(node)) {
      const entry = manifest.materials[material.name];
      if (!entry || material.userData.lightmapBound) continue;
      const texture = material[slot];
      if (!texture) continue;

      texture.colorSpace = manifest.encoding === 'srgb' ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      texture.channel = uv;
      // Floors/walls fill the frame at grazing angles, where plain trilinear
      // collapses the atlas to its coarsest mips and rect gutters average into
      // the content as dark tile borders. Anisotropic taps keep fine-mip
      // detail along the view direction; 8 is plenty and headset-safe.
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      texture.needsUpdate = true;

      material.lightMap = texture;
      material.lightMapIntensity = entry.intensity ?? 1;
      material[slot] = null;
      if (carrier === 'emissive') material.emissive = new THREE.Color(0x000000);
      // Opt this material OUT of the scene-wide envMapIntensity override: the
      // renderer only forces it onto MeshStandardMaterials whose own envMap is
      // null, so pointing it at the shared environment (the same texture the
      // scene already lights with — no second upload, no visual change on its
      // own) is what makes the per-material dimming in applyLighting stick.
      // disposeModel is guarded against freeing it.
      material.envMap = scene.environment;
      if (material.normalMap) reliefFromNormalMap(material);
      material.userData.lightmapBound = true;
      material.needsUpdate = true;
      lightmappedMaterials.push(material);
      bound += 1;
    }
  });
  return bound;
}

// The whole lighting policy, in one place, so the load path and the toggle cannot drift
// into disagreeing about it. `bakeOnly` drops the environment to nothing, which is what
// tells a flat-looking model caused by a bad bake apart from one caused by the viewer's
// own lighting — the question that toggle exists to answer.
//
// Applied PER MATERIAL, not scene-wide. Only a material that actually carries a bake has
// its lighting already in it; a prop that does not is an ordinary PBR surface and wants
// the full environment. The earlier scene-wide form dimmed both, so every un-baked prop in
// a partly-baked scene rendered cooler than it should for no reason anyone could see from
// the model — and a scene is routinely partly baked (measured on a production room: 51 of
// 57 materials). `lightmappedMaterials` is rebuilt per load and holds only materials this
// model owns, so it dies with the model.
let lightmapped = 0;
let lightmappedMaterials = [];
let materialCount = 0;
let bakeOnly = false;

function applyLighting() {
  // Left at 1 for everything the manifest did not name; the baked materials
  // opt out of this via their own envMap (see applyLightmaps) and are dimmed
  // individually just below.
  scene.environmentIntensity = policy.environmentIntensity;
  for (const material of lightmappedMaterials) {
    material.envMapIntensity = bakeOnly ? 0 : policy.lightmapEnvIntensity;
  }
  // The key light cannot go per material without render layers, so it stays
  // scene-wide and goes off the moment ANYTHING is baked. Gating it on the
  // model being FULLY baked (as this briefly did) is what blows out a baked
  // room: a scene-wide term cannot be spared the geometry it contradicts, so
  // a 0.9 directional light lands on surfaces whose lighting is already in
  // their lightmap, and a room is routinely partly baked (measured: 51 of 57
  // materials) so the gate never opens. It reads as a baker regression --
  // re-baking with the Maya lights turned down changes nothing, because the
  // extra light is added here, downstream of the EXR.
  //
  // The un-baked props that gate was added for are not left dark: the
  // per-material split above holds them at the FULL environment (they were on
  // 0.25 when the key light mattered, which is what made them look unlit), and
  // the environment is normal- and view-dependent -- getIBLRadiance takes the
  // normal -- so their normal maps and specular stay legible without it. What
  // they give up is a directional diffuse gradient, which is precisely the
  // term that must not reach the baked geometry standing beside them.
  //
  // Render layers would let the key light skip only the baked meshes, but
  // layers 1 and 2 are already spoken for: three.js 0.169.0 -- the version
  // pinned in the importmap above -- does `cameraL.layers.enable(1)` and
  // `cameraR.layers.enable(2)` in WebXRManager, so geometry parked on layer 1
  // renders to the LEFT EYE ONLY (read from that source, not assumed). A higher
  // layer dodges the collision, but the mask still has to survive into the XR
  // sub-cameras and the failure shows up in a headset rather than at the desk.
  // Layers are also per OBJECT while a bake is per MATERIAL, so a mesh with
  // mixed materials would need a conservative rule regardless.
  keyLight.intensity = lightmapped ? 0 : policy.keyIntensity;
  el.lightToggle.hidden = !lightmapped;
  el.lightToggle.textContent = `Light: ${bakeOnly ? 'bake only' : 'bake + env'}`;
}

// Guarded, because the keyboard shortcut works whether or not the button is showing: on an
// un-lightmapped model the toggle has no effect to see, so flipping it there would silently
// leave the flag set and open the NEXT lightmapped push with no environment at all.
function toggleBakeOnly() {
  if (!lightmapped) return;
  bakeOnly = !bakeOnly;
  applyLighting();
}

// Distinct materials on the model, by identity — the denominator for the HUD's baked
// fraction. Counted by Set rather than by mesh: a room shares one material across dozens
// of meshes, and an atlas bake clones it per rect, so a per-mesh tally would report a
// denominator with no relation to the number of materials the manifest can name.
//
// Nothing branches on this. It once gated the key light ("off only when FULLY baked"),
// which put a scene-wide light on top of every partly-baked room; the count is worth
// REPORTING but is not a safe thing to make lighting policy out of (see applyLighting).
function countMaterials(root) {
  const seen = new Set();
  root.traverse((node) => {
    for (const material of materialsOf(node)) seen.add(material);
  });
  return seen.size;
}

function describe(root) {
  let triangles = 0;
  let meshes = 0;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    meshes += 1;
    const geometry = node.geometry;
    triangles += (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
  });
  const { size } = modelBounds;
  const dims = [size.x, size.y, size.z].map((n) => n.toFixed(2)).join(' × ');
  return `${meshes} mesh${meshes === 1 ? '' : 'es'} · ${Math.round(triangles).toLocaleString()} tris · ${dims} source units`;
}

/* --------------------------------------------------------------- lookdev --- */

// Lookdev is the area for dials that tune how the model READS in the preview
// and then write the result back into the GLB, rather than into this page --
// the normals dial below is its first and, for now, only occupant.
//
// Held back behind one flag instead of deleted. The dial works and its file
// side ships (`normalTexture.scale`, written by MeshConvert.set_glb_normal_scale
// through POST /settings), but a lone slider does not earn a permanent seat in
// a control bar that has to survive a phone-sized viewport, and lookdev worth
// exposing is a SET -- exposure, environment rotation, tone mapping -- tuned
// together. So the area stays wired and untested-by-eye rather than rotting:
// flip this to true and it returns exactly as it was.
//
// Adding the next dial: markup inside #lookdev, its own sync called from
// syncLookdev, and its element in that function's `controls` list so the panel
// keeps following its contents. Nothing else here counts the dials.
const LOOKDEV_ENABLED = false;

// Each dial hides itself when the model gives it nothing to do (the normals
// dial on a model with no baked normal map), and the panel follows them: an
// empty chrome row over the model is worse than no row.
function syncLookdev() {
  syncNormalScale();
  const controls = [el.normals];
  el.lookdev.hidden = !LOOKDEV_ENABLED || controls.every((control) => control.hidden);
}

// How strongly the normal maps read on the BAKED materials, and only those.
//
// A lightmap contributes irradiance with no direction in it -- three.js adds
// `lightMapTexel * intensity` to the diffuse term and never consults the
// normal -- so on a baked surface the normal map survives only through the
// environment, which applyLighting deliberately dims to a quarter because that
// surface's lighting is already in its bake. Correct, and flat-looking: the
// detail is there and barely lit. This is the dial that brings it back without
// touching the bake or re-lighting the room, which is why it is offered beside
// the bake-only toggle and hidden entirely when nothing is baked.
//
// Its home is the FILE, not this page: `normalTexture.scale` is core glTF, so
// GLTFLoader has already read the model's own value into `material.normalScale`
// and the save button writes the new one back the same way. Hence a sync FROM
// the model on every load rather than a value the page remembers -- open a GLB
// saved at 1.8 and the slider says 1.8, in this viewer and in any other.
// Keyed on a baked material that actually HAS a normal map, not merely on the
// model being baked: `normalScale` exists on every MeshStandardMaterial, so
// reading the first baked material would show 1.00 for a file saved at 1.8
// whenever that first material happens to carry no normal map -- and offering
// the dial at all on a bake with no normal maps anywhere is a control that
// cannot change the render.
function normalCarriers() {
  return lightmappedMaterials.filter((material) => material.normalMap);
}

function syncNormalScale() {
  const carriers = normalCarriers();
  const value = carriers.length ? carriers[0].normalScale.x : 1;
  el.normals.hidden = !carriers.length;
  el.normalScale.value = String(value);
  el.normalValue.textContent = value.toFixed(2);
  el.normalSave.disabled = true;
  el.normalSave.textContent = 'Save';
}

function applyNormalScale(value) {
  for (const material of normalCarriers()) material.normalScale.set(value, value);
  el.normalValue.textContent = value.toFixed(2);
  el.normalSave.disabled = false;
  el.normalSave.textContent = 'Save';
}

// Hands the value to the server, which writes it into the GLB with
// MeshConvert.set_glb_normal_scale. No reload follows: the page is already
// showing the value, and the write deliberately leaves the manifest version
// alone so saving does not bounce the model out from under the user.
async function saveNormalScale() {
  el.normalSave.disabled = true;
  el.normalSave.textContent = 'Saving…';
  try {
    const response = await fetch('settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ normal_scale: Number(el.normalScale.value) }),
    });
    if (!response.ok) throw new Error(response.statusText);
    const result = await response.json();
    el.normalSave.textContent = `Saved · ${result.materials?.normal_scale ?? 0}`;
  } catch (error) {
    // Left ENABLED on failure: the value is still only in the page, so the
    // one useful thing the user can do is try again.
    el.normalSave.textContent = 'Save failed';
    el.normalSave.disabled = false;
    console.warn('Normal scale not saved:', error);
  }
}

/* ------------------------------------------------------------- animation --- */

// A shot-split deliverable ships one clip per shot AND, on the Maya route, the
// whole-timeline take its FBX exporter keeps alongside them — so `animations[0]`
// is routinely the entire timeline rather than the first shot, and every clip's
// own keyframe times are rebased to zero, which loses where each shot sat.
// `extras.animation_web` (MeshConvert.apply_glb_animations) is the file's own
// answer: it marks the clips a shot declared, carries their authoring frame
// ranges, and names the one to open on. Without the block this still plays —
// the clips are listed in file order under their own names — it just cannot say
// which of them are shots.
let mixer = null;
let clips = [];        // [{clip, meta}] in PICKER order — declared shots first
let action = null;
let clipIndex = -1;
// Autoplay, deliberately: in an immersive session the DOM overlay is not
// rendered at all, so a headset user has no transport to press. A preview that
// arrives paused would look like a preview with no animation in it.
let playing = true;
let scrubbing = false;
let lastTick = -1;   // last playhead position written to the DOM (0-1000)

// The frame range is what makes two clips that both start at t=0 tellable
// apart. "(full range)" is only said when something else IS a shot — with no
// shots at all, every clip is the full range and the label would be noise.
//
// "empty" is said whenever the deliverable says so: a declared shot whose range
// holds still bakes no curve, so it arrives named and carrying nothing. Picking
// it plays 0.00s, which reads as broken animation unless the label admits the
// clip itself is empty.
function clipLabel(entry, anyDeclared) {
  const meta = entry.meta;
  const empty = meta?.empty ? ', empty' : '';
  if (meta?.declared && typeof meta.start_frame === 'number') {
    return `${entry.clip.name}  (${meta.start_frame}–${meta.end_frame}${empty})`;
  }
  if (anyDeclared && !meta?.declared) return `${entry.clip.name}  (full range)`;
  return meta?.empty ? `${entry.clip.name}  (empty)` : entry.clip.name;
}

// --- authored alpha ramps (KHR_animation_pointer) ---------------------------
// glTF animates translation, rotation, scale and morph weights -- and nothing
// else. A material fade rides in `animations` only through KHR_animation_pointer,
// which lets a channel target any property by JSON pointer; the deliverable
// writes each authored ramp that way (MeshConvert.apply_glb_fades), on a
// material cloned per faded subtree so nothing else sampling it fades too.
// three.js does not implement the extension (checked against 0.180, well past
// the 0.169 pinned above): GLTFLoader SKIPS a channel with no `target.node`, so
// the clips arrive playable but silently minus their fades.
//
// This is the shim, and it is deliberately small: it translates the file's own
// pointer channels into native keyframe tracks on the loaded clips, and from
// then on the mixer plays a fade exactly the way it plays a translation -- same
// playhead, same scrub, same pause, no per-frame code and no frame arithmetic.
// The GLB is the single statement of the fade; the day three.js ships support,
// this function deletes and nothing else changes.
// The material properties a pointer can reach, and how each lane reaches the
// three.js material. One row per channel the exporter's table writes
// (pythontk `glb_fades.CHANNELS`): alpha is the fourth lane of the base colour
// factor and lands on `material.opacity`; a highlight is the whole VEC3
// emissive factor and lands on `material.emissive` as a colour track. Adding a
// channel there is adding a row here; the wiring below is shared.
const POINTER_BINDINGS = [
  {
    pointer: /^\/materials\/(\d+)\/pbrMetallicRoughness\/baseColorFactor$/,
    blended: true,
    track(mesh, material, times, output, count) {
      // The whole VEC4 is animated (glTF has no pointer to one component); the
      // alpha is its fourth lane. RGB is the material's own and is left to it.
      const alphas = new Float32Array(count);
      for (let k = 0; k < count; k += 1) alphas[k] = output.getW(k);
      return new THREE.NumberKeyframeTrack(`${mesh.uuid}.material.opacity`, times, alphas);
    },
  },
  {
    pointer: /^\/materials\/(\d+)\/emissiveFactor$/,
    blended: false,
    track(mesh, material, times, output, count) {
      // glTF factors are linear, as is the material's working colour space.
      const rgb = new Float32Array(count * 3);
      for (let k = 0; k < count; k += 1) {
        rgb[k * 3] = output.getX(k);
        rgb[k * 3 + 1] = output.getY(k);
        rgb[k * 3 + 2] = output.getZ(k);
      }
      return new THREE.ColorKeyframeTrack(`${mesh.uuid}.material.emissive`, times, rgb);
    },
  },
];

// A blended surface writes depth only while it is OPAQUE.
//
// glTF says nothing about depth, so GLTFLoader derives it: `alphaMode: BLEND`
// becomes `transparent = true, depthWrite = false`. That is right for a window
// and wrong for a solid object that merely happens to fade, and alphaMode is a
// property of the MATERIAL, not of the clip -- so an object that fades in
// during one shot renders with depth writes off in all twelve. With no depth
// written, a closed mesh draws its far faces over its near ones in index
// order, which reads exactly like inverted normals (measured on the production
// assembly: 15 materials, every one of them depthWrite false at full alpha).
//
// Restoring it wholesale would be the opposite bug -- an object at alpha 0.2
// would punch a hole in whatever is drawn behind it -- so the state follows
// the alpha the mixer is currently driving. This is DERIVED state, not a
// second copy of the fade: it reads whatever opacity the mixer set, so
// scrubbing, pausing and clip switches are all covered without any of them
// being named here. `onBeforeRender` runs before the draw's GL state is set,
// so the change lands on the same frame; `this` is the mesh, and it is one
// shared function rather than a closure per mesh.
function depthFromOpacity() {
  this.material.depthWrite = this.material.opacity >= 0.999;
}

// The rule is per MATERIAL but has to be installed on every MESH wearing one.
// The track binding needs a single representative mesh per material instance
// (two would drive the same property twice a frame), and a faded subtree can
// hold several meshes sharing its cloned material -- so installing only on the
// representative leaves the rule stale the moment that one is frustum-culled
// and another is not.
function installDepthRule(scene, materials) {
  if (!materials.size) return;
  scene.traverse((node) => {
    if (node.isMesh && !Array.isArray(node.material) && materials.has(node.material)) {
      node.onBeforeRender = depthFromOpacity;
    }
  });
}

async function wirePointerTracks(gltf) {
  const parser = gltf.parser;
  const defs = parser.json.animations || [];
  if (!defs.length) return 0;

  // glTF material index -> the three.js materials the loader built from it.
  // Through the loader's own association map, which it carries onto the
  // variants it clones (vertex colours, flat shading), rather than by name:
  // the cloned fade material keeps its source's NAME on purpose, so the
  // lightmap pass -- which binds by name -- still recognises it.
  const byIndex = new Map();
  gltf.scene.traverse((node) => {
    // A multi-material mesh has no `.material.opacity` to bind; the loader
    // never builds one from a GLB (each primitive becomes its own Mesh), so
    // this is a foreign-file guard rather than a path the pipeline takes.
    if (!node.isMesh || Array.isArray(node.material)) return;
    for (const material of materialsOf(node)) {
      const index = parser.associations.get(material)?.materials;
      if (index === undefined) continue;
      if (!byIndex.has(index)) byIndex.set(index, new Map());
      // One binding per distinct material INSTANCE: two meshes sharing an
      // instance would otherwise drive the same property twice a frame.
      if (!byIndex.get(index).has(material)) byIndex.get(index).set(material, node);
    }
  });

  let wired = 0;
  const blended = new Set();
  for (let i = 0; i < defs.length; i += 1) {
    const clip = gltf.animations[i];
    if (!clip) continue;
    for (const channel of defs[i].channels || []) {
      const target = channel.target || {};
      if (target.path !== 'pointer') continue;
      const pointer = target.extensions?.KHR_animation_pointer?.pointer || '';
      let binding = null;
      let match = null;
      for (const candidate of POINTER_BINDINGS) {
        match = candidate.pointer.exec(pointer);
        if (match) { binding = candidate; break; }
      }
      if (!binding) continue;
      const owners = byIndex.get(Number(match[1]));
      if (!owners) continue;
      const sampler = defs[i].samplers[channel.sampler];
      const [input, output] = await Promise.all([
        parser.getDependency('accessor', sampler.input),
        parser.getDependency('accessor', sampler.output),
      ]);
      const times = Array.from(input.array);
      for (const [material, mesh] of owners) {
        // Bound by uuid rather than name: glTF names are not unique (the
        // production assembly ships two `vdat533`), and a name binding would
        // drive the first match and leave the rest at full alpha.
        clip.tracks.push(binding.track(mesh, material, times, output, input.count));
        if (binding.blended) {
          // alphaMode BLEND already set transparent + depthWrite off at load;
          // stated here too so a file whose clone lost it still fades.
          material.transparent = true;
          blended.add(material);
        }
        wired += 1;
      }
    }
    clip.resetDuration();
  }
  installDepthRule(gltf.scene, blended);
  return wired;
}

function setupAnimation(gltf) {
  // Reset FIRST: a model swap must not leave the previous model's mixer driving
  // the frame loop, nor its clip names in the picker.
  if (mixer) mixer.stopAllAction();
  mixer = null;
  action = null;
  clips = [];
  clipIndex = -1;

  const animations = gltf.animations || [];
  if (!animations.length) {
    el.anim.hidden = true;
    return 0;
  }

  const manifest = readExtras(gltf, 'animation_web');
  // Joined on the glTF animation INDEX, which is what the block carries it by —
  // names are what a user reads, not a key: nothing stops two AnimStacks from
  // sharing one, and a name join would then hand one clip the other's frame
  // range. The block is written from this same file, so the indices agree.
  const byIndex = new Map((manifest?.clips || []).map((entry) => [entry.animation, entry]));
  const entries = animations.map((clip, index) => ({ clip, meta: byIndex.get(index) || null }));
  const anyDeclared = entries.some((entry) => entry.meta?.declared);
  // Declared shots first in the PICKER only. The glTF's own `animations` order
  // is left exactly as written, so a consumer keying on animation index still
  // reads the file the way every other reader does.
  clips = anyDeclared
    ? [...entries.filter((e) => e.meta?.declared), ...entries.filter((e) => !e.meta?.declared)]
    : entries;

  mixer = new THREE.AnimationMixer(gltf.scene);
  el.clipSelect.replaceChildren(...clips.map((entry, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = clipLabel(entry, anyDeclared);
    return option;
  }));
  el.clipSelect.hidden = clips.length < 2;
  el.anim.hidden = false;

  // The file's own answer to "which one first", falling back to the picker's
  // first entry — which is already a declared shot whenever there is one.
  // Resolved through the manifest entry rather than by comparing the glTF
  // clip's name, so it lands on the same clip the index join above did.
  const named = (manifest?.clips || []).find((entry) => entry.name === manifest.default_clip);
  const wanted = named ? clips.findIndex((entry) => entry.meta === named) : -1;
  selectClip(wanted >= 0 ? wanted : 0);
  return clips.length;
}

function selectClip(index) {
  if (!mixer || !clips[index]) return;
  if (action) action.stop();
  clipIndex = index;
  el.clipSelect.value = String(index);
  action = mixer.clipAction(clips[index].clip);
  action.reset();
  action.play();
  // Play then pause, rather than not playing: a paused action still poses the
  // model at its current time, so a preview opened paused shows frame one of
  // the clip instead of the model's authored rest pose.
  action.paused = !playing;
  mixer.update(0);
  lastTick = -1; // the readout beside the playhead changed with the clip
  updateTransport();
}

function stepClip(delta) {
  if (clips.length < 2) return;
  selectClip((clipIndex + delta + clips.length) % clips.length);
}

function togglePlay() {
  playing = !playing;
  if (action) action.paused = !playing;
  el.playToggle.textContent = playing ? 'Pause' : 'Play';
}

function seek(fraction) {
  if (!action) return;
  const duration = action.getClip().duration;
  action.time = THREE.MathUtils.clamp(fraction * duration, 0, duration);
  mixer.update(0); // apply the new time without advancing it
  updateTransport();
}

function updateTransport() {
  if (!action) return;
  const duration = action.getClip().duration || 0;
  const tick = duration ? Math.round((action.time / duration) * 1000) : 0;
  // This runs once per rendered frame — 120 times a second in a headset — and
  // the playhead only moves a VISIBLE amount 1000 times per clip. Writing the
  // same two DOM values on every other frame is pure cost on the device least
  // able to afford it. `lastTick` is reset by selectClip, so a clip swap that
  // lands on the same tick still redraws (the duration beside it changed).
  if (tick === lastTick) return;
  lastTick = tick;
  // Not while the user owns the slider: writing the playhead back into the
  // control being dragged fights the drag.
  if (!scrubbing) el.scrub.value = String(tick);
  el.clipTime.textContent = `${action.time.toFixed(2)} / ${duration.toFixed(2)}s`;
}

// Loads can outlive the poll interval — a multi-megabyte GLB takes seconds to
// fetch and parse — and setInterval keeps polling meanwhile, so two loads can
// be in flight at once after a quick pair of pushes. Completion order is not
// publish order: without this token the OLDER load can finish last, replace
// the newer model, and label itself live. Each load claims the token at entry;
// a completion that no longer holds it discards its result and stays silent.
let loadGeneration = 0;

async function load(url, version) {
  const generation = ++loadGeneration;
  let gltf;
  try {
    gltf = await loader.loadAsync(url);
  } catch (error) {
    if (generation !== loadGeneration) return null; // superseded — newer load owns the status line
    setStatus(`load failed: ${error.message || error}`, 'error');
    return false;
  }
  if (generation !== loadGeneration) {
    disposeModel(gltf.scene); // parsed but never shown; free it rather than leak it
    return null;
  }
  if (current) {
    pivot.remove(current);
    disposeModel(current);
  }
  current = gltf.scene;
  pivot.add(current);

  // A lightmapped material already contains its DIFFUSE lighting, so the viewer's own
  // light is what has to give way: a second rig on top of a bake leaves the baked shadows
  // in place while everything around them lifts, which reads as a washed out model rather
  // than as double lighting and is easy to misdiagnose as a bad bake. Only the BAKED
  // materials give way though — see applyLighting.
  //
  // Reset before applying, not after: these describe the model now on screen, and a load
  // that failed or was superseded above must not leave the previous model's materials
  // being driven by the toggle.
  lightmappedMaterials = [];
  // Before setupAnimation: the mixer binds a clip's tracks when its action is
  // created, so tracks added afterwards would never be played.
  const fadeCount = await wirePointerTracks(gltf);
  materialCount = countMaterials(gltf.scene);
  // Read before applying: the deliverable's own policy is what applyLighting
  // then spends, so a load that read nothing must fall back BEFORE the lights
  // are set rather than after.
  readRenderingPolicy(gltf);
  lightmapped = applyLightmaps(gltf);
  applyLighting();
  syncLookdev();
  const clipCount = setupAnimation(gltf);

  const box = new THREE.Box3().setFromObject(current);
  modelBounds = {
    size: box.getSize(new THREE.Vector3()),
    center: box.getCenter(new THREE.Vector3()),
  };

  // Reported as a FRACTION: "how much of this model is baked" is the fact that
  // decides whether the viewer's own lighting is in play, and it is invisible
  // from the render -- a mostly-baked room and a fully-baked one look alike
  // until the difference is blamed on the baker.
  // The fade count is stated for the same reason the lightmapped fraction is:
  // it is invisible from the render. A pointer channel that is NOT being driven
  // looks exactly like an object that simply pops, which is how the fades went
  // unnoticed for as long as they did.
  el.stats.textContent = describe(current)
    + (lightmapped ? ` · ${lightmapped}/${materialCount} lightmapped materials` : '')
    + (clipCount ? ` · ${clipCount} clip${clipCount === 1 ? '' : 's'}` : '')
    + (fadeCount ? ` · ${fadeCount} material track${fadeCount === 1 ? '' : 's'}` : '');
  emit('load', { model: current, gltf, lightmapped, materialCount, clips: clipCount });
  setStatus(`v${version} · updated ${new Date().toLocaleTimeString()}`, 'live');
  layout();
  return true;
}

function setStatus(text, cls = '') {
  el.status.textContent = text;
  el.status.className = cls;
}

/* -------------------------------------------------------------- scripts --- */

// The extension seam. `PreviewServer` names a set of ES modules in the
// manifest; each is imported once and its default export called with the API
// object below. That is deliberately the ONLY way the page grows behaviour:
// this file stays the stable path, and a new capability (a turntable, a cost
// report, a debug overlay) is a module plus a registry entry rather than
// another branch in here.
//
// A script's failure is contained and, above all, quiet in the status line: an
// optional module that throws must not make a perfectly good preview LOOK
// broken, because the one place this is read is a headset where the console is
// not visible. It is logged, and the model keeps rendering.
const loadedScripts = new Set();
const scriptHooks = { load: [], frame: [], key: [] };

const viewer = {
  THREE,
  scene,
  renderer,
  camera,
  controls,
  pivot,
  setStatus,
  /** The model currently on screen, or null between loads. */
  get model() { return current; },
  /** `{size, center}` of the current model, in source units. */
  get bounds() { return modelBounds; },
  /** The live rendering policy, as read from the deliverable. */
  get policy() { return policy; },
  /** The AnimationMixer driving the current model's clips, or null. */
  get mixer() { return mixer; },
  /**
   * Play a clip by name (the names `extras.animation_web` lists, which are the
   * DCC's shot names on a shot-split deliverable). Returns whether it matched.
   */
  playClip(name) {
    const index = clips.findIndex((entry) => entry.clip.name === name);
    if (index >= 0) selectClip(index);
    return index >= 0;
  },
  /**
   * Subscribe to a page event.
   *  'load'  ({model, gltf, lightmapped, materialCount, clips}) after each model swap
   *  'frame' ({delta, time}) once per rendered frame
   *  'key'   (KeyboardEvent) for keydown, after the page's own shortcuts
   */
  on(event, fn) { (scriptHooks[event] || (scriptHooks[event] = [])).push(fn); },
  /**
   * Add a button to the control bar, styled like the page's own. Scripts get
   * this rather than reaching for document.createElement so a module cannot
   * drift from the page's look — and so the bar stays the one place buttons
   * live when the layout changes.
   */
  addButton(label, onClick) {
    const button = document.createElement('button');
    button.className = 'ui';
    button.textContent = label;
    button.addEventListener('click', onClick);
    document.getElementById('controls').appendChild(button);
    return button;
  },
};

function emit(event, detail) {
  for (const fn of scriptHooks[event] || []) {
    try {
      fn(detail, viewer);
    } catch (error) {
      console.warn(`viewer script threw on '${event}':`, error);
    }
  }
}

async function loadScripts(urls) {
  for (const url of urls || []) {
    if (loadedScripts.has(url)) continue;
    // Claimed BEFORE the await: poll() fires once a second and the import is
    // async, so a second poll landing mid-import would otherwise load and
    // initialise the same module twice — two turntables fighting over one
    // rotation, and two buttons for it.
    loadedScripts.add(url);
    try {
      const module = await import(`./${url}`);
      await module.default?.(viewer);
    } catch (error) {
      console.warn(`viewer script failed to load: ${url}`, error);
    }
  }
}

/* ----------------------------------------------------------------- poll --- */

let seenVersion = -1;
let failedVersion = -1;
let failCount = 0;

async function poll() {
  try {
    const manifest = await (await fetch('manifest.json', { cache: 'no-store' })).json();
    if (manifest.title) el.title.textContent = manifest.title;
    // Ahead of the version check: the active set is decided per push, and the
    // FIRST poll happens before anything is published at all — gated behind
    // the early return, a script named on a server that has yet to publish
    // would never load. Already-loaded URLs are skipped inside.
    //
    // AWAITED, so a script activated by the same push that named the asset is
    // initialised before the model loads and cannot miss its 'load' event: a
    // small GLB parses in less time than an ES module takes to arrive
    // (measured on KB-scale fixtures), which left the shadow shim with no
    // scene. A push whose scripts fail still loads the model — loadScripts
    // catches per module.
    await loadScripts(manifest.scripts);
    if (manifest.version === seenVersion) return;
    // A version that has failed its budget is abandoned until a new publish
    // supersedes it — otherwise a genuinely corrupt GLB re-parses every second.
    if (manifest.version === failedVersion && failCount >= LOAD_RETRIES) return;

    if (!manifest.asset) {
      seenVersion = manifest.version;
      setStatus('waiting for the first publish…');
      return;
    }

    seenVersion = manifest.version;
    // The query string is what actually defeats a warm HTTP cache when the
    // asset keeps a stable name across pushes.
    const ok = await load(`${manifest.asset}?v=${manifest.version}`, manifest.version);
    if (ok === null) return; // superseded mid-load — the newer call owns the bookkeeping
    if (ok) {
      failedVersion = -1;
      failCount = 0;
      return;
    }
    // Leaving the version marked as seen is what would strand the page: a
    // transient failure must not stop the next poll from trying it again.
    failCount = manifest.version === failedVersion ? failCount + 1 : 1;
    failedVersion = manifest.version;
    seenVersion = -1;
  } catch (error) {
    setStatus('server unreachable', 'error');
  }
}

poll();
setInterval(poll, POLL_MS);

// Tell the server the moment this page goes away, so the next push reopens a
// tab instead of publishing to nothing. Without it the server can only infer a
// closed viewer from polls stopping, and that inference has to wait out a
// window long enough to tolerate hidden-tab timer throttling (~1/min) — so a
// close-then-push would otherwise show nothing at all for a minute and a half.
// `pagehide` rather than `unload`: it is the event that still fires on mobile
// and bfcache paths, and sendBeacon is the only send that survives teardown.
// A page restored from bfcache simply polls again and re-arms the server.
addEventListener('pagehide', () => { navigator.sendBeacon('viewer-closed', ''); });

/* ------------------------------------------------------------------ ui  --- */

el.scaleToggle.addEventListener('click', () => { realScale = !realScale; layout(); });
el.frameBtn.addEventListener('click', frameCamera);
el.lightToggle.addEventListener('click', toggleBakeOnly);
el.normalScale.addEventListener('input', () => applyNormalScale(Number(el.normalScale.value)));
el.normalSave.addEventListener('click', saveNormalScale);
el.clipSelect.addEventListener('change', () => selectClip(Number(el.clipSelect.value)));
el.playToggle.addEventListener('click', togglePlay);
// `input` fires throughout the drag (and on every arrow key), `change` at the
// end of one — which is what hands the playhead back to the frame loop.
el.scrub.addEventListener('input', () => { scrubbing = true; seek(Number(el.scrub.value) / 1000); });
el.scrub.addEventListener('change', () => { scrubbing = false; });
addEventListener('keydown', (event) => {
  // A letter typed into the clip picker is that control's own type-ahead, so
  // the page's single-letter shortcuts must not fire on top of it -- reaching
  // for "(full range)" would otherwise re-frame the camera on the way. Only
  // the picker: the sliders use arrows, which this page has no shortcut for,
  // and excluding them would cost Space-to-pause after a scrub.
  if (event.target === el.clipSelect) return;
  if (event.key === 'r') { realScale = !realScale; layout(); }
  if (event.key === 'f') frameCamera();
  if (event.key === 'l') toggleBakeOnly();
  // Guarded on there being a mixer: with no clips these keys mean nothing, and
  // Space would otherwise flip a play state the next animated push inherits.
  if (mixer) {
    if (event.code === 'Space') { event.preventDefault(); togglePlay(); }
    if (event.key === '[') stepClip(-1);
    if (event.key === ']') stepClip(1);
  }
  // Last, so the page's own shortcuts can never be shadowed by a script.
  emit('key', event);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// `delta` rather than a raw timestamp: a script animating anything has to be
// framerate-independent, and a headset runs this loop at 72-120 Hz against a
// desktop's 60.
const frameClock = new THREE.Clock();

renderer.setAnimationLoop((time) => {
  controls.update();
  const delta = frameClock.getDelta();
  // Before the hook, so a script's 'frame' callback sees the model posed for
  // THIS frame rather than the previous one.
  if (mixer) {
    mixer.update(delta);
    updateTransport();
  }
  emit('frame', { delta, time });
  renderer.render(scene, camera);
});
</script>
</body>
</html>
