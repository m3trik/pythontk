// Placed at their AUTHORED frames rather than end to end. The shots on that
// assembly sit 15 frames apart, and concatenating them would run the sequence
// short and put every shot at the wrong time -- a different thing from what
// the whole-timeline clip played. A gap holds the previous shot's last pose,
// which is what the continuous clip did there too.
function buildSequence(entries, manifest) {
  const fps = Number(manifest?.fps) || 0;
  if (!fps) return null;   // frames cannot be placed in time without it
  // Only when the file ships no continuous clip of its own: with one present
  // the picker would offer two ways to watch the same thing, and the real one
  // is exact where this is a reconstruction.
  if (entries.some((entry) => !entry.meta?.declared)) return null;
  // The TIMELINE is every declared shot; the SEGMENTS are the ones that carry
  // a curve. A shot whose range holds still bakes nothing and arrives empty,
  // and dropping it from the span as well would end the sequence early -- the
  // whole-timeline clip played through those frames, holding the last pose,
  // which is what the gap rule below already does for them.
  // BOTH bounds, not just the start: the span is measured across every
  // declared shot, so one entry missing an end_frame makes `last` NaN and the
  // whole sequence NaN-long -- a transport that divides by it draws nothing and
  // never recovers. A shot the manifest describes only half of is not a shot
  // this can place.
  const declared = entries.filter((e) => (
    typeof e.meta?.start_frame === 'number' && typeof e.meta?.end_frame === 'number'
  ));
  if (declared.length < 2) return null;
  const shots = declared
    .filter((e) => e.clip.duration > 0)
    .sort((a, b) => a.meta.start_frame - b.meta.start_frame);
  if (!shots.length) return null;

  const first = Math.min(...declared.map((e) => e.meta.start_frame));
  const last = Math.max(...declared.map((e) => e.meta.end_frame));
  const segments = shots.map((entry) => ({
    entry,
    offset: (entry.meta.start_frame - first) / fps,
    duration: entry.clip.duration,
  }));
  return {
    segments,
    fps,
    startFrame: first,
    endFrame: last,
    duration: (last - first) / fps,
    name: 'FULL SEQUENCE',
  };
}

// The segment a global time lands in: the LAST one that has started. A time
// inside a gap therefore resolves to the shot before it, whose pose is then
// held -- rather than to nothing, which would leave the model at whatever the
// previous frame drew.
function segmentAt(seconds) {
  if (!sequence) return null;
  let found = sequence.segments[0];
  for (const segment of sequence.segments) {
    if (segment.offset <= seconds) found = segment; else break;
  }
  return found;
}

// Pose the model at `seconds` along the sequence. The segment's action is
// driven by ASSIGNING its time, never by letting the mixer advance it: two
// actions must never accumulate time at once, and the gap hold depends on the
// clamp below rather than on where the mixer happened to get to.
function applySequence(seconds) {
  if (!sequence || !mixer) return;
  const segment = segmentAt(seconds);
  if (!segment) return;
  if (segment !== sequenceSegment) {
    if (action) action.stop();
    sequenceSegment = segment;
    action = mixer.clipAction(segment.entry.clip);
    action.reset();
    action.play();
    // Paused throughout: `mixer.update(0)` still poses the model at the
    // action's current time (the same property `seek` relies on), so the
    // sequence owns the clock and the mixer only evaluates.
    action.paused = true;
  }
  action.time = THREE.MathUtils.clamp(seconds - segment.offset, 0, segment.duration);
  mixer.update(0);
}

function setupAnimation(gltf) {
  // Reset FIRST: a model swap must not leave the previous model's mixer driving
  // the frame loop, nor its clip names in the picker.
  if (mixer) mixer.stopAllAction();
  mixer = null;
  action = null;
  clips = [];
  clipIndex = -1;
  // The sequence is the previous model's too: `sequenceSegment` holds one of
  // its clips, and a swap to a file that builds no sequence would otherwise
  // leave `activeSequence` pointing at it -- the frame loop branches on that.
  sequence = null;
  activeSequence = null;
  sequenceSegment = null;
  sequenceTime = 0;

  animationManifest = null;

  const animations = gltf.animations || [];
  if (!animations.length) {
    el.anim.hidden = true;
    return 0;
  }

  const manifest = readExtras(gltf, 'animation_web');
  animationManifest = manifest;
  // Joined on the glTF animation INDEX, which is what the block carries it by —
  // names are what a user reads, not a key: nothing stops two AnimStacks from
  // sharing one, and a name join would then hand one clip the other's frame
  // range. The block is written from this same file, so the indices agree.
  const byIndex = new Map((manifest?.clips || []).map((entry) => [entry.animation, entry]));
  const entries = animations.map((clip, index) => ({ clip, meta: byIndex.get(index) || null }));
  const anyDeclared = entries.some((entry) => entry.meta?.declared);
  // Declared shots first in the PICKER only. The glTF's own `animations` order
  // is left exactly as written, so a consumer keying on animation index still
  // reads the file the way every other reader does.
  clips = anyDeclared
    ? [...entries.filter((e) => e.meta?.declared), ...entries.filter((e) => !e.meta?.declared)]
    : entries;

  // FIRST in the picker when it exists: a deliverable that ships only shots is
  // still a sequence, and "watch the whole thing" is what a reviewer opens.
  sequence = buildSequence(entries, manifest);
  if (sequence) clips = [{ clip: null, meta: null, sequence }, ...clips];

  mixer = new THREE.AnimationMixer(gltf.scene);
  el.clipSelect.replaceChildren(...clips.map((entry, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = clipLabel(entry, anyDeclared);
    return option;
  }));
  el.clipSelect.hidden = clips.length < 2;
  el.anim.hidden = false;

  // The file's own answer to "which one first", falling back to the picker's
  // first entry — which is already a declared shot whenever there is one.
  // Resolved through the manifest entry rather than by comparing the glTF
  // clip's name, so it lands on the same clip the index join above did.
  const named = (manifest?.clips || []).find((entry) => entry.name === manifest.default_clip);
  const wanted = named ? clips.findIndex((entry) => entry.meta === named) : -1;
  selectClip(wanted >= 0 ? wanted : 0);
  // The FILE's clip count, not the picker's row count: a script reading this
  // off the 'load' event is asking what the deliverable carries, and the
  // synthetic whole-timeline entry is the page's reconstruction rather than
  // something the file ships.
  return animations.length;
}

// What is selected, in the terms a recorder needs: seconds for the transport,
// frames and a rate for the FILE it writes. The two must agree — a movie of a
// shot is compared against a viewport playblast of the same frames, so its
// length and its numbering are not the page's to round.
//
// The frame rate is the deliverable's, never the display's: the page renders at
// whatever the device manages, and a recording sampled at that rate would be a
// screen capture rather than a playblast.
function clipInfo() {
  const entry = clips[clipIndex];
  if (!entry) return null;
  const fps = Number(animationManifest?.fps) || 0;
  if (entry.sequence) {
    return {
      name: entry.sequence.name,
      duration: entry.sequence.duration,
      fps: entry.sequence.fps,
      startFrame: entry.sequence.startFrame,
      endFrame: entry.sequence.endFrame,
      sequence: true,
    };
  }
  const duration = entry.clip?.duration || 0;
  const start = typeof entry.meta?.start_frame === 'number' ? entry.meta.start_frame : 0;
  // The clip's OWN length decides the end, not the manifest's end_frame: a
  // whole-timeline clip carries no declared range, and a declared one whose
  // curve is shorter than its range would otherwise ask for frames that do not
  // exist. A duration is the span BETWEEN the outer frames, so the last frame
  // is start + duration*fps and the count that spans them is one more than
  // that -- the same arithmetic the sequence's own startFrame/endFrame satisfy,
  // which is what lets a recorder count frames one way for both.
  const spans = fps ? Math.round(duration * fps) : 0;
  return {
    name: entry.clip?.name || 'clip',
    duration,
    fps,
    startFrame: start,
    endFrame: start + spans,
    sequence: false,
  };
}

function selectClip(index) {
  if (!mixer || !clips[index]) return;
  if (action) action.stop();
  clipIndex = index;
  el.clipSelect.value = String(index);
  if (clips[index].sequence) {
    activeSequence = clips[index].sequence;
    sequenceTime = 0;
    sequenceSegment = null;  // force the first segment to bind
    action = null;
    applySequence(0);
    lastTick = -1;
    updateTransport();
    return;
  }
  activeSequence = null;
  sequenceSegment = null;
  action = mixer.clipAction(clips[index].clip);
  action.reset();
  action.play();
  // Play then pause, rather than not playing: a paused action still poses the
  // model at its current time, so a preview opened paused shows frame one of
  // the clip instead of the model's authored rest pose.
  action.paused = !playing;
  mixer.update(0);
  lastTick = -1; // the readout beside the playhead changed with the clip
  lastShot = null;
  updateTransport();
}

function stepClip(delta) {
  if (clips.length < 2) return;
  selectClip((clipIndex + delta + clips.length) % clips.length);
}

function togglePlay() {
  playing = !playing;
  // The sequence's segment action stays paused whatever the transport says --
  // it is posed by assignment, and un-pausing it would let the mixer advance
  // it alongside the sequence clock.
  if (action && !activeSequence) action.paused = !playing;
  el.playToggle.textContent = playing ? 'Pause' : 'Play';
}

function seek(fraction) {
  if (activeSequence) {
    sequenceTime = THREE.MathUtils.clamp(
      fraction * activeSequence.duration, 0, activeSequence.duration);
    applySequence(sequenceTime);
    updateTransport();
    return;
  }
  if (!action) return;
  const duration = action.getClip().duration;
  action.time = THREE.MathUtils.clamp(fraction * duration, 0, duration);
  mixer.update(0); // apply the new time without advancing it
  updateTransport();
}

function updateTransport() {
  // The sequence reports its OWN clock, not the segment's: the playhead spans
  // the whole timeline, and the segment's local time would send it jumping
  // back to zero at every shot boundary.
  if (!activeSequence && !action) return;
  const duration = activeSequence
    ? activeSequence.duration
    : action.getClip().duration || 0;
  const at = activeSequence ? sequenceTime : action.time;
  const tick = duration ? Math.round((at / duration) * 1000) : 0;
  const shot = shotLabel(at);
  // This runs once per rendered frame — 120 times a second in a headset — and
  // the playhead only moves a VISIBLE amount 1000 times per clip. Writing the
  // same two DOM values on every other frame is pure cost on the device least
  // able to afford it. `lastTick` is reset by selectClip, so a clip swap that
  // lands on the same tick still redraws (the duration beside it changed).
  if (tick === lastTick && shot === lastShot) return;
  lastTick = tick;
  lastShot = shot;
  // Not while the user owns the slider: writing the playhead back into the
  // control being dragged fights the drag.
  if (!scrubbing) el.scrub.value = String(tick);
  // The authoring frame beside the seconds, for the sequence only: it is the
  // number a reviewer reads back to the animator, and the shot ranges in the
  // picker are quoted in it.
  const frame = activeSequence
    ? `  f${Math.round(activeSequence.startFrame + at * activeSequence.fps)}`
    : '';
  el.clipTime.textContent =
    `${shot ? `${shot} · ` : ''}${at.toFixed(2)} / ${duration.toFixed(2)}s${frame}`;
}

// Which shot the sequence playhead is standing in, for the readout. Only the
// sequence has one: on a single clip the picker already names what is playing,
// and repeating it beside the playhead would be noise.
//
// A time inside a GAP resolves to the shot before it — that is the pose on
// screen, held, exactly as the whole-timeline clip played it — so it is labelled
// as a hold rather than named outright. Without that the readout claims a shot
// is playing through frames it does not cover, which is the one reading of this
// label that could send someone looking for a bug in the shot.
function shotLabel(seconds) {
  if (!activeSequence || !sequenceSegment) return null;
  const entry = sequenceSegment.entry;
  const name = entry.meta?.name || entry.clip?.name || 'shot';
  const held = seconds > sequenceSegment.offset + sequenceSegment.duration + 1e-6;
  return held ? `${name} (hold)` : name;
}

// The note the DCC's Shots panel carries for whatever the page is posed at —
// the segment's on the sequence, the selected clip's on a single shot. Unlike
// `shotLabel` it answers on BOTH, because its one reader is a burn-in rather
// than the readout: the picker naming a clip does not put its description in
// the movie, and a description is the half of a shot record a reviewer
// watching the file cannot otherwise see.
//
// Empty is null, not '': `extras.animation_web` omits the key on a shot with
// no note (MeshConvert.apply_glb_animations writes only truthy fields), and a
// caller should not have to tell "no description" from "an empty one".
function shotDescription() {
  const entry = activeSequence && sequenceSegment
    ? sequenceSegment.entry
    : clips[clipIndex];
  return entry?.meta?.description || null;
}

// Loads can outlive the poll interval — a multi-megabyte GLB takes seconds to
// fetch and parse — and setInterval keeps polling meanwhile, so two loads can
// be in flight at once after a quick pair of pushes. Completion order is not
// publish order: without this token the OLDER load can finish last, replace
// the newer model, and label itself live. Each load claims the token at entry;
// a completion that no longer holds it discards its result and stays silent.
let loadGeneration = 0;

async function load(url, version) {
  const generation = ++loadGeneration;
  let gltf;
  // Fetched and parsed as two steps rather than one `loadAsync`, so each is
  // timed on its own and the file's size is known: "the preview is slow to
  // appear" is a download on a share link and a parse on a big GLB, and the
  // two want different fixes.
  const loadTiming = { bytes: 0, jsonBytes: 0 };
  try {
    const fetching = performance.now();
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`.trim());
    const buffer = await response.arrayBuffer();
    const parsing = performance.now();
    loadTiming.fetchMs = parsing - fetching;
    loadTiming.bytes = buffer.byteLength;
    loadTiming.jsonBytes = glbJsonBytes(buffer);
    gltf = await loader.parseAsync(buffer, THREE.LoaderUtils.extractUrlBase(url));
    loadTiming.parseMs = performance.now() - parsing;
  } catch (error) {
    if (generation !== loadGeneration) return null; // superseded — newer load owns the status line
    setStatus(`load failed: ${error.message || error}`, 'error');
    return false;
  }
  const settingUp = performance.now();
  if (generation !== loadGeneration) {
    disposeModel(gltf.scene); // parsed but never shown; free it rather than leak it
    return null;
  }
  // A prompt is ALWAYS about the deliverable on screen — what to record, what
  // to write into it — so a push that replaces the model invalidates whatever
  // it was asking. Dismissed rather than left standing with a stale summary
  // over a different scene; it resolves as a cancel, which is the safe answer
  // to a question whose subject has gone. (A recording already RUNNING is
  // dropped by the same event, in `playblast.js`.)
  closeDialog(false);
  if (current) {
    pivot.remove(current);
    disposeModel(current);
  }
  current = gltf.scene;
  pivot.add(current);

  // A lightmapped material already contains its DIFFUSE lighting, so the viewer's own
  // light is what has to give way: a second rig on top of a bake leaves the baked shadows
  // in place while everything around them lifts, which reads as a washed out model rather
  // than as double lighting and is easy to misdiagnose as a bad bake. Only for the BAKED
  // materials though — see applyLighting and patchBakedShader.
  //
  // Reset before applying, not after: these describe the model now on screen, and a load
  // that failed or was superseded above must not leave the previous model's materials
  // being driven by the toggle.
  lightmappedMaterials = [];
  // What this load finds wrong with the deliverable, gathered as the passes run
  // (see measureModel). Local, not module state: a newer load can start while
  // this one awaits, and must not clear what this one found.
  const issues = [];
  // Before setupAnimation: the mixer binds a clip's tracks when its action is
  // created, so tracks added afterwards would never be played.
  const animated = await wirePointerTracks(gltf);
  // Read before applying: the deliverable's own policy is what applyLighting
  // then spends, so a load that read nothing must fall back BEFORE the lights
  // are set rather than after.
  readRenderingPolicy(gltf);
  lightmapped = applyLightmaps(gltf, issues);
  applyLighting();
  syncLookdev();
  const clipCount = setupAnimation(gltf);

  const box = boxInPivot(current);
  modelBounds = {
    size: box.getSize(new THREE.Vector3()),
    center: box.getCenter(new THREE.Vector3()),
  };

  // What the model is and how much of it is lit by its bake, in objects --
  // invisible from the render, where a mostly-baked room and a fully-baked one
  // look alike until the difference is blamed on the baker. See measureModel
  // for the units, and why the count is no longer a fraction of materials.
  loadTiming.setupMs = performance.now() - settingUp;
  specs = measureModel(gltf, { ...loadTiming, clips: clipCount, animated }, issues);
  materialCount = specs.materials.instances;
  firstFramePending = true;
  showSpecs(specs);
  // Laid out, its start found, its surfaces read and the view opened BEFORE
  // the event: a 'load' subscriber is told the model is in, and asking
  // `viewer.headset.start` then answered from the model it replaced -- nothing
  // on the first push, the disposed model's node on the next -- or from this
  // one before it stood on the floor.
  layout();
  startNode = findStartNode(current, userPosName);
  surfaces.setRoot(current);
  homeView();
  emit('load', { model: current, gltf, lightmapped, materialCount, clips: clipCount, specs });
  setStatus(
    `v${version} · ${formatBytes(loadTiming.bytes)} · updated ${new Date().toLocaleTimeString()}`,
    'live',
  );
  return true;
}

function setStatus(text, cls = '') {
  // A lost context outranks whatever else the page has to report, including a
  // fresh publish and an unreachable server: nothing is being DRAWN, so no
  // other status is the one to act on. The hint line still carries the detail.
  if (contextLost) {
    text = LOST_MESSAGE;
    cls = 'error';
  }
  el.status.textContent = text;
  el.status.className = cls;
}

/* ------------------------------------------------------------------- rig --- */

// Where the headset stands in the scene -- the one thing every headset
// behaviour moves. The viewer moves, never the scene: the tracked space is
// re-anchored through an offset reference space, so the headset, the
// controllers and every camera three.js derives from them move as one while
// the model stays put (and the desktop view, which three.js drives from the
// headset meanwhile, is put back as the session ends -- see desktopView).
// `place` is that anchor -- a scene point is R(yaw) * tracked + (x, y, z) --
// so `y` is the height of the floor under the viewer: 0 on the page's floor, a
// platform's top after a jump onto it.
//
// The rig decides nothing. Where a session begins is the start's to say (the
// start section), and getting around is locomotion's, which is optional:
// switched off, the viewer stays where the session started. Both move it
// through the calls below, and a cut -- a session's first place, a jump, a
// return to the start -- goes through the blink, to black and back, so it is
// never seen.
//
// Poses are plain values in the TRACKED space, as the headset reports them:
// `{position: [x, y, z], orientation: [x, y, z, w]}`.
const BLINK_OUT = 0.08;       // s to black before a jump ...
const BLINK_IN = 0.14;        // ... and back after it

const rig = (() => {
  const UP = new THREE.Vector3(0, 1, 0);
  const FORWARD = new THREE.Vector3(0, 0, -1);
  const place = { x: 0, y: 0, z: 0, yaw: 0 };
  let blink = null;                      // {phase: 'out' | 'in', t, to}
  let fade = 0;
  let changed = false;

  function toScene(position) {
    const c = Math.cos(place.yaw), s = Math.sin(place.yaw);
    const [x, y, z] = position;
    return new THREE.Vector3(c * x + s * z + place.x, y + place.y, -s * x + c * z + place.z);
  }

  function directionToScene(orientation) {
    return FORWARD.clone()
      .applyQuaternion(new THREE.Quaternion().fromArray(orientation))
      .applyAxisAngle(UP, place.yaw);
  }

  // The way a rotation faces, as a turn about +Y from -Z: its view axis
  // flattened -- or, looking straight down (or up), the way the top of its view
  // points. That second case is not only a camera aimed at the floor: a Blender
  // Empty arrives turned -90 degrees about X, its -Z pointing down and its +Y,
  // Blender's forward, pointing the way it faces.
  function headingOf(quaternion) {
    for (const axis of [FORWARD, UP]) {
      const d = axis.clone().applyQuaternion(quaternion);
      if (d.x * d.x + d.z * d.z > 0.01) return Math.atan2(-d.x, -d.z);
    }
    return 0;
  }

  // Turn by `angle` about the vertical through `about` -- the head, so the
  // view pivots where the viewer stands instead of swinging them round.
  function turn(angle, about) {
    const c = Math.cos(angle), s = Math.sin(angle);
    const dx = place.x - about.x, dz = place.z - about.z;
    place.x = about.x + c * dx + s * dz;
    place.z = about.z - s * dx + c * dz;
    place.yaw += angle;
    changed = true;
  }

  // Move across the floor by (dx, dz): a walk.
  function move(dx, dz) {
    place.x += dx;
    place.z += dz;
    changed = true;
  }

  // Stand on a floor `y` high: a walk over a step.
  function setFloor(y) {
    place.y = y;
    changed = true;
  }

  // Put the head -- a scene point, or null for the rig's own origin -- over
  // `point`, and the floor at its height; the heading holds.
  function land(point, head) {
    place.x += point.x - (head ? head.x : place.x);
    place.z += point.z - (head ? head.z : place.z);
    place.y = point.y;
    changed = true;
  }

  // The back half of a blink, from black: the frame being drawn was posed from
  // where the viewer was (three.js poses it before the loop runs), so a cut
  // made now goes out black and the view fades in where it lands.
  function blinkIn() {
    blink = { phase: 'in', t: 0 };
    fade = 1;
  }

  // Stand the head (`pose`) over `point`, facing `heading`, from black.
  function arrive(point, heading, pose) {
    const facing = place.yaw + headingOf(new THREE.Quaternion().fromArray(pose.orientation));
    turn(heading - facing, toScene(pose.position));
    land(point, toScene(pose.position));
    blinkIn();
  }

  // Stand the rig back at `at`, a `place` it had, from black.
  function restore(at) {
    Object.assign(place, { x: at.x, y: at.y, z: at.z, yaw: at.yaw });
    changed = true;
    blinkIn();
  }

  // Jump the head over `point`, the heading kept, through a whole blink: the
  // move waits for black, since a visible cut is what makes a teleport jarring.
  // Refused (false) while a blink is under way.
  function jump(point) {
    if (blink) return false;
    blink = { phase: 'out', t: 0, to: point.clone() };
    return true;
  }

  /**
   * Advance the blink a frame, landing a jump -- over wherever the head
   * (`pose`) is by then -- once the view is black. Returns ['land'] on the
   * frame a jump lands.
   */
  function step(delta, pose) {
    if (!blink) return [];
    const events = [];
    // A hitch (a tab regaining focus, a long collection) must not become a leap.
    blink.t += Math.min(Math.max(delta, 0), 0.1);
    if (blink.phase === 'out') {
      fade = Math.min(blink.t / BLINK_OUT, 1);
      if (blink.t >= BLINK_OUT) {
        land(blink.to, pose ? toScene(pose.position) : null);
        events.push('land');
        blink = { phase: 'in', t: 0 };
      }
    } else {
      fade = Math.max(1 - blink.t / BLINK_IN, 0);
      if (blink.t >= BLINK_IN) {
        blink = null;
        fade = 0;
      }
    }
    return events;
  }

  // The rig as the XRRigidTransform an offset reference space is built from.
  // WebXR places the new space's origin at the transform, so poses in it are
  // the transform's INVERSE applied to tracked ones -- and a scene point is
  // R(yaw) * tracked + (x, y, z), so the transform is that map's inverse:
  // R(-yaw) applied to -(x, y, z), then R(-yaw).
  function offset() {
    const c = Math.cos(place.yaw), s = Math.sin(place.yaw);
    return {
      position: { x: -(c * place.x - s * place.z), y: -place.y, z: -(s * place.x + c * place.z), w: 1 },
      orientation: { x: 0, y: -Math.sin(place.yaw / 2), z: 0, w: Math.cos(place.yaw / 2) },
    };
  }

  function reset() {
    Object.assign(place, { x: 0, y: 0, z: 0, yaw: 0 });
    blink = null;
    fade = 0;
    changed = true;
  }

  return {
    /** Where the tracked space stands in the scene: `{x, y, z, yaw}` (a copy). */
    get place() { return { ...place }; },
    /** 0-1: the blink's black. */
    get fade() { return fade; },
    /** Whether a blink is under way; a jump is refused until it ends. */
    get blinking() { return blink !== null; },
    /** Whether the rig has moved since the loop last re-anchored to it. */
    get changed() { return changed; },
    /** `changed`, cleared: the loop, re-anchoring. */
    takeChange() {
      const was = changed;
      changed = false;
      return was;
    },
    toScene,
    directionToScene,
    headingOf,
    turn,
    move,
    setFloor,
    land,
    arrive,
    restore,
    jump,
    step,
    offset,
    reset,
  };
})();

/* -------------------------------------------------------------- surfaces --- */

// What can be stood on -- the model's visible meshes, each with its scene-space
// box -- and the one question asked of them: what does a segment strike first?
// Shared by the start, which stands a session on the floor under its node, and
// locomotion, which throws its arc at them and follows them underfoot.
const WALKABLE = Math.cos(THREE.MathUtils.degToRad(40));  // the steepest floor

// Triangles to a cell of a mesh's triangle grid, were they spread evenly: the
// grid's resolution (see `gridOf`).
const CELL_TRIANGLES = 8;
const MAX_GRID_CELLS = 1 << 21;

const surfaces = (() => {
  const UP = new THREE.Vector3(0, 1, 0);
  const raycaster = new THREE.Raycaster();
  const normalMatrix = new THREE.Matrix3();
  const instanceMatrix = new THREE.Matrix4();
  let list = [];                           // [{mesh, box, gridded}]
  let root = null;                         // the model they were read from ...
  const rootMatrix = new THREE.Matrix4();  // ... and its world matrix then

  // Every headset frame casts at these -- a walk once, for the floor underfoot;
  // an aimed arc once per segment -- and a raycast tests EVERY triangle of a
  // mesh whose bounds its ray crosses: measured, 10 ms a frame on a
  // 320k-triangle mesh, the whole of a 90 Hz budget, for a question about the
  // metre around the viewer. So each mesh's triangles are bucketed, in the
  // mesh's own space, on a uniform grid over its box -- CELL_TRIANGLES to a
  // cell -- and a segment is tested against the triangles in the cells its own
  // box overlaps: a few dozen, however dense the mesh. Built once per geometry,
  // on first use or as a session starts (`warm`), and kept beside it; the
  // model's moves (a turned pivot) need no rebuild, the segment is taken into
  // the mesh's space instead. What the stock raycast knows and a grid of the
  // stored positions does not -- a skinned or morphed mesh draws positions the
  // buffer does not hold, a multi-material one gives each group its own side,
  // an instanced one is many meshes -- keeps the stock raycast.
  const grids = new WeakMap();  // geometry -> its grid

  function griddable(mesh) {
    const { geometry, material } = mesh;
    return !mesh.isSkinnedMesh && !mesh.isInstancedMesh && !mesh.isBatchedMesh
      && !!material && !Array.isArray(material)
      && !!geometry.attributes.position
      && !(geometry.morphAttributes.position && mesh.morphTargetInfluences);
  }

  function gridOf(geometry) {
    let grid = grids.get(geometry);
    if (grid) return grid;
    const position = geometry.attributes.position;
    const order = geometry.index;
    const first = Math.max(0, geometry.drawRange.start);
    const end = Math.min(order ? order.count : position.count,
      geometry.drawRange.start + geometry.drawRange.count);
    const count = Math.max(0, Math.floor((end - first) / 3));
    const corner = order ? (t, k) => order.getX(first + 3 * t + k) : (t, k) => first + 3 * t + k;
    if (!geometry.boundingBox) geometry.computeBoundingBox();
    const box = geometry.boundingBox.clone();
    const low = box.min.toArray();
    const extent = box.getSize(new THREE.Vector3()).toArray();
    // Cubic cells shared out by the box's proportions. An axis thinner than a
    // cell (a floor's height) gets one, and the edge is sized over the rest --
    // rounded up to a cell of its own first, it would multiply the others.
    const wanted = Math.min(Math.max(1, count / CELL_TRIANGLES), MAX_GRID_CELLS);
    let axes = [0, 1, 2].filter((axis) => extent[axis] > 1e-6);
    let edge = 1;
    for (;;) {
      const measure = axes.reduce((product, axis) => product * extent[axis], 1);
      edge = axes.length ? (measure / wanted) ** (1 / axes.length) : 1;
      const thick = axes.filter((axis) => extent[axis] >= edge);
      if (thick.length === axes.length) break;
      axes = thick;
    }
    let dims = extent.map((e, axis) => (axes.includes(axis) ? Math.max(1, Math.ceil(e / edge)) : 1));
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const span = new Int32Array(6);  // a triangle's cells: x0 y0 z0 x1 y1 z1
    let scale, cells, starts, total;

    const cellAt = (axis, value) =>
      Math.min(dims[axis] - 1, Math.max(0, Math.floor((value - low[axis]) * scale[axis])));
    const spanOf = (t) => {
      a.fromBufferAttribute(position, corner(t, 0));
      b.fromBufferAttribute(position, corner(t, 1));
      c.fromBufferAttribute(position, corner(t, 2));
      for (let axis = 0; axis < 3; axis++) {
        const p = a.getComponent(axis), q = b.getComponent(axis), r = c.getComponent(axis);
        span[axis] = cellAt(axis, Math.min(p, q, r));
        span[axis + 3] = cellAt(axis, Math.max(p, q, r));
      }
    };
    const eachCell = (visit) => {
      for (let z = span[2]; z <= span[5]; z++) {
        for (let y = span[1]; y <= span[4]; y++) {
          for (let x = span[0]; x <= span[3]; x++) visit(x + dims[0] * (y + dims[1] * z));
        }
      }
    };
    // Counted first, coarsened while the long thin triangles of a pathological
    // mesh would file one triangle in thousands of cells.
    for (;;) {
      scale = dims.map((d, axis) => (extent[axis] > 1e-6 ? d / extent[axis] : 0));
      cells = dims[0] * dims[1] * dims[2];
      starts = new Uint32Array(cells + 1);
      total = 0;
      for (let t = 0; t < count; t++) {
        spanOf(t);
        eachCell((cell) => { starts[cell + 1] += 1; total += 1; });
      }
      if (total <= 16 * count + cells || cells === 1) break;
      dims = dims.map((d) => Math.max(1, d >> 1));
    }
    for (let cell = 0; cell < cells; cell++) starts[cell + 1] += starts[cell];
    const refs = new Uint32Array(total);
    const filled = starts.slice(0, cells);
    for (let t = 0; t < count; t++) {
      spanOf(t);
      eachCell((cell) => { refs[filled[cell]++] = t; });
    }
    grid = { count, corner, position, box, low, dims, scale, starts, refs, seen: new Uint32Array(count), stamp: 0 };
    grids.set(geometry, grid);
    return grid;
  }

  const toLocal = new THREE.Matrix4();
  const localRay = new THREE.Ray();
  const localSpan = new THREE.Box3();
  const localTo = new THREE.Vector3();
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  const struck = new THREE.Vector3();
  const struckWorld = new THREE.Vector3();

  // The nearest triangle of `mesh` the scene segment `from` -> `to` (`length`
  // long) strikes, as a stock raycast reports it (`point`, `distance`, `face`
  // and `object`, the sides the material culls culled), or null.
  function strike(mesh, from, to, length) {
    const grid = gridOf(mesh.geometry);
    if (!grid.count) return null;
    toLocal.copy(mesh.matrixWorld).invert();
    localRay.origin.copy(from).applyMatrix4(toLocal);
    localTo.copy(to).applyMatrix4(toLocal);
    localSpan.setFromPoints([localRay.origin, localTo]);
    if (!localSpan.intersectsBox(grid.box)) return null;
    localRay.direction.subVectors(localTo, localRay.origin).normalize();
    const { dims, low, scale, starts, refs, seen, corner, position } = grid;
    const cellAt = (axis, value) =>
      Math.min(dims[axis] - 1, Math.max(0, Math.floor((value - low[axis]) * scale[axis])));
    const lo = localSpan.min.toArray().map((value, axis) => cellAt(axis, value));
    const hi = localSpan.max.toArray().map((value, axis) => cellAt(axis, value));
    const side = mesh.material.side;
    // A triangle filed in several of the cells visited is tested once.
    grid.stamp += 1;
    let best = null;
    for (let z = lo[2]; z <= hi[2]; z++) {
      for (let y = lo[1]; y <= hi[1]; y++) {
        for (let x = lo[0]; x <= hi[0]; x++) {
          const cell = x + dims[0] * (y + dims[1] * z);
          for (let k = starts[cell]; k < starts[cell + 1]; k++) {
            const t = refs[k];
            if (seen[t] === grid.stamp) continue;
            seen[t] = grid.stamp;
            va.fromBufferAttribute(position, corner(t, 0));
            vb.fromBufferAttribute(position, corner(t, 1));
            vc.fromBufferAttribute(position, corner(t, 2));
            const hit = side === THREE.BackSide
              ? localRay.intersectTriangle(vc, vb, va, true, struck)
              : localRay.intersectTriangle(va, vb, vc, side === THREE.FrontSide, struck);
            if (!hit) continue;
            struckWorld.copy(struck).applyMatrix4(mesh.matrixWorld);
            const distance = from.distanceTo(struckWorld);
            if (distance > length || (best && distance >= best.distance)) continue;
            best = {
              distance,
              point: struckWorld.clone(),
              face: { normal: THREE.Triangle.getNormal(va, vb, vc, new THREE.Vector3()) },
              object: mesh,
            };
          }
        }
      }
    }
    return best;
  }

  function read() {
    list = [];
    if (!root) return;
    root.updateWorldMatrix(true, true);
    rootMatrix.copy(root.matrixWorld);
    root.traverseVisible((node) => {
      if (!node.isMesh) return;
      list.push({ mesh: node, box: new THREE.Box3().setFromObject(node), gridded: griddable(node) });
    });
  }

  // Every grid the model's surfaces need, built now rather than on the frame
  // that first casts at them: as a session starts, and as a model lands in one.
  function warm() {
    for (const { mesh, gridded } of list) if (gridded) gridOf(mesh.geometry);
  }

  // Re-read whenever the model has moved as a whole since: a script turning the
  // pivot -- the turntable, before a session -- would otherwise leave every box
  // where its mesh used to be, and the arc would pass straight through a wall.
  // Cheap to redo (a box is the geometry's own, transformed), and asked once a
  // frame rather than per cast: an arc casts dozens of segments.
  function refresh() {
    if (!root) return;
    root.updateWorldMatrix(true, false);
    if (!root.matrixWorld.equals(rootMatrix)) read();
  }

  // The model to read them from; each load hands its own over.
  function setRoot(model) {
    root = model || null;
    read();
    if (renderer.xr.isPresenting) warm();
  }

  // The first surface the segment `from` -> `to` strikes, or null. `valid` when
  // it can be stood on: facing up within WALKABLE, and struck from above.
  function cast(from, to) {
    const direction = new THREE.Vector3().subVectors(to, from);
    const length = direction.length();
    if (!length) return null;
    raycaster.set(from, direction.divideScalar(length));
    raycaster.far = length;
    const span = new THREE.Box3().setFromPoints([from, to]);
    let best = null;
    for (const { mesh, box, gridded } of list) {
      // The segment's box first: a raycast tests each mesh's bounds against the
      // whole INFINITE ray, so every mesh behind the segment would otherwise pay
      // its triangle tests on every segment of an arc, every frame.
      if (!box.intersectsBox(span)) continue;
      const hit = gridded ? strike(mesh, from, to, length) : raycaster.intersectObject(mesh, false)[0];
      if (hit && (!best || hit.distance < best.distance)) best = hit;
    }
    let normal = null;
    if (best) {
      let world = best.object.matrixWorld;
      if (best.instanceId !== undefined) {
        best.object.getMatrixAt(best.instanceId, instanceMatrix);
        world = instanceMatrix.premultiply(world);
      }
      normal = best.face.normal.clone().applyMatrix3(normalMatrix.getNormalMatrix(world)).normalize();
    }
    // The page's own floor, which a model need not carry: a room shipped
    // without one still has somewhere to land, where the grid is drawn.
    if (from.y >= 0 && to.y < 0) {
      const along = from.y / (from.y - to.y);
      if (!best || along * length < best.distance) {
        best = { point: from.clone().lerp(to, along), distance: along * length };
        normal = UP.clone();
      }
    }
    if (!best) return null;
    return {
      point: best.point.clone(),
      normal,
      valid: normal.y >= WALKABLE && raycaster.ray.direction.dot(normal) < 0,
    };
  }

  return { setRoot, refresh, cast, warm };
})();

/* --------------------------------------------------------------- headset --- */

// The session's own reference space. The rig always offsets THIS one, never an
// offset of an offset, so nothing accumulates across a session's moves.
let headsetSpace = null;

const OVERLAY_DISTANCE = 0.1;  // m in front of each eye
const OVERLAY_ORDER = 1e6;     // drawn last: over everything, cards included

// Everything below draws only in a headset; on the desktop it stays hidden, so
// a still or a playblast never carries it.
const headsetLayer = new THREE.Group();
headsetLayer.visible = false;
scene.add(headsetLayer);

// A card of text in the headset, where the page's own chrome is not drawn at
// all: a canvas in that chrome's colours on a plane in the headset layer --
// the controls card below, and any script's (the packaged `inspect` rides
// one). See `viewer.addHeadsetCard` for the contract.
const CARD_FILL = 'rgba(21, 23, 26, 0.88)';
const CARD_UP = new THREE.Vector3(0, 1, 0);

function addHeadsetCard({ name = '', width = 720, height = 400, metres = 0.36, radius = 28, over = false } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(metres, (metres * height) / width),  // the canvas's aspect
    new THREE.MeshBasicMaterial({
      map: texture, transparent: true, depthTest: !over, depthWrite: false, toneMapped: false,
    }),
  );
  mesh.name = name;
  if (over) {
    // Over the model, under the blink, which then fades it too.
    mesh.renderOrder = OVERLAY_ORDER - 1;
    mesh.frustumCulled = false;
  }
  mesh.visible = false;
  headsetLayer.add(mesh);
  const facing = new THREE.Vector3();
  const target = new THREE.Vector3();
  return {
    mesh,
    draw(paint) {
      context.clearRect(0, 0, width, height);
      context.fillStyle = CARD_FILL;
      if (context.roundRect) {
        context.beginPath();
        context.roundRect(0, 0, width, height, radius);
        context.fill();
      } else {
        context.fillRect(0, 0, width, height);
      }
      paint(context, width, height);
      texture.needsUpdate = true;
    },
    place(head, look, { ahead, aside = 0, below = 0, ease = 0 }, delta = 0) {
      facing.copy(look).setY(0);
      if (facing.lengthSq() < 1e-6) facing.set(0, 0, -1);
      facing.normalize().applyAxisAngle(CARD_UP, aside);
      target.copy(head).addScaledVector(facing, ahead);
      target.y = head.y - below;
      if (ease && mesh.visible) mesh.position.lerp(target, 1 - Math.exp(-Math.max(delta, 0) / ease));
      else mesh.position.copy(target);
      mesh.lookAt(head);
    },
  };
}

// The controllers themselves, modelled after the real ones. The models load on
// connect from the WebXR input-profiles CDN; with it unreachable they are just
// not drawn, and everything else here still works.
const controllerModels = new XRControllerModelFactory();
for (const index of [0, 1]) {
  const grip = renderer.xr.getControllerGrip(index);
  grip.add(controllerModels.createControllerModel(grip));
  scene.add(grip);
}

// The rig's blink and locomotion's vignette: one quad drawn in front of EACH
// eye, placed in `onBeforeRender` from the eye camera being drawn -- a child of
// the camera would trail the head by a frame, which in a headset reads as the
// view smearing. Radial for the vignette (dark from 25 degrees off the eye's
// axis to black at 50), flat for the blink. Each writes its own uniform.
const overlay = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.6),  // +-0.3 m at 0.1 m: 71 degrees each way
  new THREE.ShaderMaterial({
    uniforms: { fade: { value: 0 }, vignette: { value: 0 } },
    vertexShader: `
      varying vec2 vPosition;
      void main() {
        vPosition = position.xy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float fade;
      uniform float vignette;
      varying vec2 vPosition;
      void main() {
        float offAxis = length(vPosition) / ${OVERLAY_DISTANCE.toFixed(3)};  // tan of the angle
        float alpha = max(fade, vignette * smoothstep(0.466, 1.192, offAxis));
        if (alpha < 0.002) discard;
        gl_FragColor = vec4(0.0, 0.0, 0.0, alpha);
      }`,
    transparent: true,
    depthTest: false,
    depthWrite: false,
  }),
);
overlay.frustumCulled = false;
overlay.renderOrder = OVERLAY_ORDER;
overlay.visible = false;
const overlayOffset = new THREE.Matrix4().makeTranslation(0, 0, -OVERLAY_DISTANCE);
overlay.onBeforeRender = (_renderer, _scene, eye) => {
  overlay.matrixWorld.multiplyMatrices(eye.matrixWorld, overlayOffset);
};
headsetLayer.add(overlay);

const poseArrays = ({ position: p, orientation: q }) => ({
  position: [p.x, p.y, p.z],
  orientation: [q.x, q.y, q.z, q.w],
});

// The head, the sticks and the right controller's aim ray, all in the
// session's own space: the rig maps them into the scene, so they must not be
// read through the offset space the rig itself builds. Returns what
// `headset.step` takes -- `{head, left, right, aim}`, each pose
// `{position, orientation}` as arrays and each stick `[x, y]`, or null -- and
// `sources`, the controller behind each hand.
function readHeadsetInput(frame) {
  const input = { head: null, left: null, right: null, aim: null, sources: {} };
  const viewerPose = frame.getViewerPose(headsetSpace);
  if (viewerPose) input.head = poseArrays(viewerPose.transform);
  for (const source of frame.session.inputSources) {
    const hand = source.handedness;
    if (hand !== 'left' && hand !== 'right') continue;
    input.sources[hand] = source;
    const axes = source.gamepad?.axes;
    // xr-standard puts the thumbstick on axes 2-3; a touchpad-only controller
    // reports on 0-1.
    if (axes && axes.length >= 2) input[hand] = axes.length >= 4 ? [axes[2], axes[3]] : [axes[0], axes[1]];
    if (hand === 'right') {
      const aim = frame.getPose(source.targetRaySpace, headsetSpace);
      if (aim) input.aim = poseArrays(aim.transform);
    }
  }
  return input;
}

/* ----------------------------------------------------------------- start --- */

// Where views start. The server names a node (`manifest.userPos`, "user_pos"
// unless the DCC side chose another) -- a camera, so the start can be looked
// through in Maya or Blender before it is ever pushed. The desktop view opens
// through it (homeView), and a headset session stands under it, facing where
// it looks (stepStart). Where the viewer goes from there is locomotion's
// business; with locomotion off, they stay.

let startNode = null;  // the current model's start node, or null

// Matched on the name the file carries rather than three.js's sanitised copy,
// which drops the ':' a Maya namespace hangs on; a namespaced one
// ("set:user_pos") answers when no node has the name exactly. Null when the
// model has none.
function findStartNode(root, name) {
  if (!root || !name) return null;
  let exact = null;
  let spaced = null;
  root.traverse((node) => {
    const own = node.userData.name ?? node.name;
    if (exact || typeof own !== 'string') return;
    if (own === name) exact = node;
    else if (!spaced && own.slice(own.lastIndexOf(':') + 1) === name) spaced = node;
  });
  return exact || spaced;
}

const viewRay = new THREE.Raycaster();

// The desktop view a load opens on: through the start camera when the model
// has one, else the whole model, framed. Through it means its position, the
// way it looks, and its HORIZONTAL field of view -- the one Maya (film gate
// fill) and Blender (sensor fit auto) both hold for a landscape frame, and the
// one the file keeps faithfully (the vertical it stores assumes the sensor's
// 3:2, not the render's aspect; the clip planes arrive in the wrong units and
// are not used). The orbit then turns about what the camera looks at. A start
// node that is not a camera places only the headset: a marker on the floor is
// no place to put an eye.
function homeView() {
  const start = startNode?.isPerspectiveCamera ? startNode : null;
  if (!start) {
    frameCamera(DEFAULT_FOV);
    return;
  }
  const across = Math.tan(THREE.MathUtils.degToRad(start.fov) / 2) * start.aspect;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(across / camera.aspect));
  current.updateWorldMatrix(true, true);
  const eye = start.getWorldPosition(new THREE.Vector3());
  const look = new THREE.Vector3(0, 0, -1).applyQuaternion(start.getWorldQuaternion(new THREE.Quaternion()));
  const box = new THREE.Box3().setFromObject(current);
  // A model with nothing drawable -- a push of the start camera alone -- is an
  // EMPTY box, and an empty box lies at Infinity from every point: the far
  // plane came out Infinity and the projection NaN, and in a session three.js
  // hands that plane to `updateRenderState`, which refuses a non-finite
  // depthFar and stops the XR loop. The page's floor grid is all there is to
  // see then, so the planes reach that.
  if (box.isEmpty()) box.copy(GRID_BOX);
  const radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 0.05);
  viewRay.set(eye, look);
  const hit = viewRay.intersectObject(current, true).find((h) => h.object.isMesh && h.object.visible);
  const toCenter = box.getCenter(new THREE.Vector3()).sub(eye).dot(look);
  camera.position.copy(eye);
  controls.target.copy(eye).addScaledVector(look, hit ? hit.distance : Math.max(toCenter, radius / 10, 0.1));
  settleView(Math.max(radius / 2000, 0.005), (box.distanceToPoint(eye) + 2 * radius) * 2 + 1);
}

const START_LIFT = 0.05;  // m above the start node its floor is sought from

// Where a session starts: `{point, heading}`, read from the start node as it
// stands NOW (a script may have turned the model since it loaded), the point
// dropped to the floor under it -- so a camera at eye height stands the viewer
// where its feet would be -- or kept at the node's own height with nothing
// walkable below. Only where and which way: the height of the eyes, the tilt of
// the head and the field of view are the headset's, because the floor has to
// stay where the viewer's feet are. Null without a start node.
function startPlace() {
  if (!startNode) return null;
  surfaces.refresh();
  startNode.updateWorldMatrix(true, false);
  const point = startNode.getWorldPosition(new THREE.Vector3());
  const heading = rig.headingOf(startNode.getWorldQuaternion(new THREE.Quaternion()));
  const floor = surfaces.cast(
    point.clone().setY(point.y + START_LIFT),
    point.clone().setY(Math.min(point.y, 0) - 1),
  );
  if (floor && floor.valid) point.y = floor.point.y;
  return { point, heading };
}

// Whether this session has been placed at its start (true between sessions:
// nothing is due), and the rig as that left it -- the origin, on a model with
// no start -- which is how a recenter, and locomotion switched off, tell a
// viewer still standing there from one who has moved on.
let arrived = true;
let arrivedAt = null;

// Whether the rig still stands where this session was placed.
function atStart() {
  if (!arrivedAt) return false;
  const place = rig.place;
  return Object.keys(arrivedAt).every((key) => place[key] === arrivedAt[key]);
}

// Due back at the start on the next frame with a head -- once there has been
// one to go back to.
function returnToStart() {
  if (arrivedAt) arrived = false;
}

// A session's first frame with a head and a model: to the start, if the model
// has one, under black. It waits for both, so a session begun while the model
// is still downloading lands at the start when it arrives, rather than never.
// Due again later (`returnToStart`), it goes back the same way: under the start
// again, facing its way, or -- with no start -- to where the rig began.
function stepStart(input) {
  if (arrived || !input.head || !current) return [];
  arrived = true;
  const start = startPlace();
  if (start) {
    rig.arrive(start.point, start.heading, input.head);
  } else if (arrivedAt && !atStart()) {
    rig.restore(arrivedAt);
  } else {
    arrivedAt = arrivedAt || rig.place;
    return [];
  }
  arrivedAt = rig.place;
  return ['arrive'];
}

// A recenter (holding the headset's system button) resets the session's space
// under the viewer. One still standing where the start put them -- always, with
// locomotion off -- is put back there, facing its way: the viewpoint holds. One
// who has moved on keeps their place.
function recenter() {
  if (!locomotion.enabled || atStart()) returnToStart();
}

/* ------------------------------------------------------------ locomotion --- */

// Getting around in a headset, on the thumbsticks of the two controllers every
// standalone headset ships with -- the scheme most VR apps default to:
//
//   left stick    walk where you look: eased in and out, a comfort vignette
//                 narrowing the view while moving, and following the floor up a
//                 step or down a ledge
//   right stick   flick sideways to snap-turn 45 degrees about your head, one
//                 turn per flick; push forward to aim a teleport arc, release
//                 to jump there through a short blink, pull back to cancel
//
// Optional, and live: the server's switch (`locomotion` in the manifest, read
// on every poll) turns it off, and then the sticks do nothing and nothing of it
// is drawn -- the viewer stays where the session started, free to look round
// and step about their room but not to go anywhere; one it had carried off
// before the switch is taken back there (see `headset.step`). All it moves is
// the rig.
const MOVE_SPEED = 2.0;       // m/s at full deflection: a brisk walk
const MOVE_EASE = 0.1;        // s: time constant of speeding up and slowing down
const STICK_DEADZONE = 0.15;  // a resting stick drifts; this much reads as zero
const SNAP_TURN = THREE.MathUtils.degToRad(45);
const FLICK_ON = 0.7;         // a turn fires past this sideways ...
const FLICK_OFF = 0.35;       // ... and re-arms once the stick is back inside this
const AIM_ON = 0.6;           // forward past this starts aiming
const AIM_RELEASE = 0.3;      // back inside this jumps
const AIM_CANCEL = 0.5;       // pulled back past this cancels
const ARC_SPEED = 7.5;        // m/s launch: about 6 m of reach on the level
const ARC_GRAVITY = 9.81;
const ARC_STEP = 0.04;        // s of flight per traced segment
const ARC_SEGMENTS = 45;      // 1.8 s of flight, then the throw is lost below
const STEP_UP = 0.45;         // m a walk climbs onto without a teleport
const STEP_DOWN = 1.0;        // m a walk steps down; past it, the floor holds
const FLOOR_EASE = 0.08;      // s: a step up or down, smoothed
const VIGNETTE_MAX = 0.6;
const VIGNETTE_EASE = 0.12;   // s
const ARC_VALID = 0x4fc3f7;
const ARC_INVALID = 0xf2504b;  // the page's error red
const ARC_DOT_SPACING = 0.16;  // m between the arc's dots ...
const ARC_DOT_SPEED = 0.5;     // ... flowing at this m/s toward the landing
const ARC_DOTS = 64;
const HINT_SECONDS = 8;
const HINT_FADE_MS = 400;

const locomotion = (() => {
  let enabled = true;
  const velocity = new THREE.Vector2();  // scene x and z, m/s
  let floorTarget = null;                // the height a walk's floor eases to
  let turnArmed = true;
  let aiming = false;
  let target = null;                     // {point, normal, valid} while aiming
  let arc = [];                          // the aimed arc, scene points, to its end
  let vignette = 0;

  // The arc: dots flowing along it toward the landing -- cyan where a jump would
  // land, red where it would not.
  const arcDots = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.012, 8, 6),
    new THREE.MeshBasicMaterial({ color: ARC_VALID, transparent: true, opacity: 0.9, depthWrite: false }),
    ARC_DOTS,
  );
  arcDots.count = 0;
  arcDots.frustumCulled = false;
  headsetLayer.add(arcDots);
  const arcDot = new THREE.Object3D();

  function drawArc(points, valid, time) {
    arcDots.material.color.setHex(valid ? ARC_VALID : ARC_INVALID);
    let count = 0;
    let next = ((time / 1000) * ARC_DOT_SPEED) % ARC_DOT_SPACING;  // the next dot, along the arc
    let walked = 0;
    for (let i = 1; i < points.length && count < ARC_DOTS; i++) {
      const length = points[i - 1].distanceTo(points[i]);
      while (length && next <= walked + length && count < ARC_DOTS) {
        arcDot.position.lerpVectors(points[i - 1], points[i], (next - walked) / length);
        arcDot.updateMatrix();
        arcDots.setMatrixAt(count++, arcDot.matrix);
        next += ARC_DOT_SPACING;
      }
      walked += length;
    }
    arcDots.count = count;
    arcDots.instanceMatrix.needsUpdate = true;
  }

  // The landing: a ring laid on the surface, and an arrow on the way you will
  // face -- a jump keeps your heading, and the arrow says so before you commit.
  const reticle = new THREE.Group();
  {
    const line = new THREE.MeshBasicMaterial({
      color: ARC_VALID, transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide,
    });
    const fill = new THREE.MeshBasicMaterial({
      color: ARC_VALID, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide,
    });
    const arrow = new THREE.Shape();
    arrow.moveTo(0, 0.34);
    arrow.lineTo(-0.07, 0.26);
    arrow.lineTo(0.07, 0.26);
    arrow.closePath();
    reticle.add(new THREE.Mesh(new THREE.RingGeometry(0.2, 0.235, 48), line));
    reticle.add(new THREE.Mesh(new THREE.CircleGeometry(0.2, 48), fill));
    reticle.add(new THREE.Mesh(new THREE.ShapeGeometry(arrow), line));
  }
  reticle.visible = false;
  headsetLayer.add(reticle);
  const reticleBasis = new THREE.Matrix4();

  function placeReticle(landing, facing, time) {
    const normal = landing.normal;
    const ahead = facing.clone().addScaledVector(normal, -facing.dot(normal));
    if (ahead.lengthSq() < 1e-6) ahead.set(normal.y, -normal.x, 0);  // any tangent
    ahead.normalize();
    const side = new THREE.Vector3().crossVectors(ahead, normal);
    reticle.quaternion.setFromRotationMatrix(reticleBasis.makeBasis(side, ahead, normal));
    reticle.position.copy(landing.point).addScaledVector(normal, 0.01);
    reticle.scale.setScalar(1 + 0.05 * Math.sin(time * 0.006));
  }

  // The controls, said once per session where the viewer first looks. World-
  // locked, a little below eye level: text that follows the head is hard to
  // read. It fades after HINT_SECONDS, or as soon as the controls are in use.
  const hint = addHeadsetCard({ name: 'controls', width: 1024, height: 300, metres: 0.64, radius: 36 });
  hint.draw((g) => {
    g.font = '600 42px system-ui, sans-serif';
    const rows = [
      ['Left stick', 'walk'],
      ['Right stick sideways', 'turn'],
      ['Right stick forward', 'aim, release to teleport'],
    ];
    rows.forEach(([control, action], row) => {
      const y = 90 + row * 74;
      g.fillStyle = '#9aa0a6';
      g.fillText(control, 56, y);
      g.fillStyle = '#e8eaed';
      g.fillText(action, 520, y);
    });
  });
  let hintUntil = 0;  // ms the card holds until; 0 until it is placed this session

  function updateHint(input, events, time) {
    if (!hint.mesh.visible) {
      if (hintUntil || !input.head) return;  // gone for this session, or no head yet
      hint.place(
        rig.toScene(input.head.position),
        rig.directionToScene(input.head.orientation),
        { ahead: 1.2, below: 0.25 },
      );
      hint.mesh.visible = true;
      hintUntil = time + HINT_SECONDS * 1000;
    }
    // The first move says the controls are known: fade then, rather than hold.
    if (events.some((event) => event !== 'arrive') || vignette > 0.02) {
      hintUntil = Math.min(hintUntil, time + HINT_FADE_MS);
    }
    const remaining = hintUntil - time;
    hint.mesh.material.opacity = Math.min(1, remaining / HINT_FADE_MS);
    if (remaining <= 0) hint.mesh.visible = false;
  }

  // A tick in the hand for a turn and a landing: a move the body registers is
  // much of what makes a snap turn feel intended rather than done to you.
  function pulse(source, intensity, milliseconds) {
    try {
      source?.gamepad?.hapticActuators?.[0]?.pulse?.(intensity, milliseconds);
    } catch { /* a controller without rumble */ }
  }

  // The teleport arc: a throw along the aim ray, traced segment by segment
  // until it strikes something or has fallen for ARC_SEGMENTS * ARC_STEP s.
  function trace(origin, direction) {
    const points = [origin.clone()];
    let from = origin;
    for (let step = 1; step <= ARC_SEGMENTS; step++) {
      const t = step * ARC_STEP;
      const to = new THREE.Vector3(
        origin.x + direction.x * ARC_SPEED * t,
        origin.y + direction.y * ARC_SPEED * t - 0.5 * ARC_GRAVITY * t * t,
        origin.z + direction.z * ARC_SPEED * t,
      );
      const hit = surfaces.cast(from, to);
      if (hit) {
        points.push(hit.point);
        return { points, hit };
      }
      points.push(to);
      from = to;
    }
    return { points, hit: null };
  }

  // The floor under (x, z) a walk can follow: a step up to STEP_UP, a drop down
  // to STEP_DOWN. A ledge taller than a step is not a floor -- the downward cast
  // starts below its top -- so the height holds, and a wall is walked through.
  function floorUnder(x, z) {
    const y = rig.place.y;
    const hit = surfaces.cast(
      new THREE.Vector3(x, y + STEP_UP, z),
      new THREE.Vector3(x, y - STEP_DOWN, z),
    );
    return hit && hit.valid ? hit.point.y : null;
  }

  // One frame of the sticks. `events` are the frame's so far: a jump that just
  // landed, or a session just placed at its start -- a frame that moves nothing
  // else. Returns its own: 'aim' as the arc comes up, 'turn' on a snap turn.
  function update(delta, input, events) {
    const own = [];
    // A hitch (a tab regaining focus, a long collection) must not become a leap.
    const dt = Math.min(Math.max(delta, 0), 0.1);
    if (events.includes('land') || events.includes('arrive')) {
      velocity.set(0, 0);
      floorTarget = null;
    }
    if (events.includes('arrive')) return own;
    const head = input.head ? rig.toScene(input.head.position) : null;
    const [rx, ry] = input.right || [0, 0];
    const [lx, ly] = input.left || [0, 0];

    // Right stick: aim, jump or cancel -- or, while not aiming, turn.
    if (aiming) {
      if (ry > AIM_CANCEL || !input.aim) {
        aiming = false;
      } else if (Math.hypot(rx, ry) < AIM_RELEASE) {
        aiming = false;
        if (target && target.valid) rig.jump(target.point);
      }
    } else if (ry < -AIM_ON && Math.abs(rx) < AIM_ON && input.aim && !rig.blinking) {
      aiming = true;
      own.push('aim');
    }
    if (aiming) {
      const thrown = trace(rig.toScene(input.aim.position), rig.directionToScene(input.aim.orientation));
      arc = thrown.points;
      target = thrown.hit;
    } else {
      arc = [];
      target = null;
      if (turnArmed && Math.abs(rx) > FLICK_ON && Math.abs(ry) < FLICK_ON) {
        const { x, y, z } = rig.place;
        rig.turn(-Math.sign(rx) * SNAP_TURN, head || new THREE.Vector3(x, y, z));
        turnArmed = false;
        own.push('turn');
      } else if (Math.abs(rx) < FLICK_OFF) {
        turnArmed = true;
      }
    }

    // Left stick: walk where the head looks, eased in and out. The response
    // curve keeps the first half of the throw for creeping up to something.
    const deflection = Math.min(Math.hypot(lx, ly), 1);
    const amount = deflection > STICK_DEADZONE
      ? ((deflection - STICK_DEADZONE) / (1 - STICK_DEADZONE)) ** 1.5
      : 0;
    let wantX = 0, wantZ = 0;
    if (amount && input.head) {
      const forward = rig.directionToScene(input.head.orientation).setY(0);
      if (forward.lengthSq() > 1e-6) {
        forward.normalize();
        // Right of forward, seen from above, is (-forward.z, forward.x).
        const scale = (amount * MOVE_SPEED) / Math.hypot(lx, ly);
        wantX = (forward.x * -ly - forward.z * lx) * scale;
        wantZ = (forward.z * -ly + forward.x * lx) * scale;
      }
    }
    const ease = 1 - Math.exp(-dt / MOVE_EASE);
    velocity.x += (wantX - velocity.x) * ease;
    velocity.y += (wantZ - velocity.y) * ease;
    if (!amount && velocity.lengthSq() < 1e-4) velocity.set(0, 0);
    if (velocity.x || velocity.y) {
      rig.move(velocity.x * dt, velocity.y * dt);
      if (head) {
        const floor = floorUnder(head.x + velocity.x * dt, head.z + velocity.y * dt);
        if (floor !== null) floorTarget = floor;
      }
    }
    // The floor follows a walk over a step, smoothed so it reads as a step.
    if (floorTarget !== null) {
      const y = rig.place.y;
      const gap = floorTarget - y;
      const next = Math.abs(gap) < 1e-3 ? floorTarget : y + gap * (1 - Math.exp(-dt / FLOOR_EASE));
      rig.setFloor(next);
      if (next === floorTarget) floorTarget = null;
    }

    // The comfort vignette narrows the view with the walking speed: movement
    // the eyes see but the body does not feel is what the periphery objects to.
    const speed = Math.min(velocity.length() / MOVE_SPEED, 1);
    vignette += (speed * VIGNETTE_MAX - vignette) * (1 - Math.exp(-dt / VIGNETTE_EASE));
    if (!speed && vignette < 1e-3) vignette = 0;
    return own;
  }

  // What the frame shows of it, and the ticks in the hand.
  function draw(input, events, time) {
    if (events.includes('turn')) pulse(input.sources?.right, 0.2, 14);
    if (events.includes('land')) pulse(input.sources?.right, 0.35, 26);
    if (aiming) drawArc(arc, !!(target && target.valid), time);
    else arcDots.count = 0;
    reticle.visible = !!(target && target.valid);
    if (reticle.visible) {
      const facing = input.head
        ? rig.directionToScene(input.head.orientation).setY(0)
        : new THREE.Vector3(0, 0, -1);
      if (facing.lengthSq() < 1e-6) facing.set(0, 0, -1);
      placeReticle(target, facing.normalize(), time);
    }
    overlay.material.uniforms.vignette.value = vignette;
    // Said again where the viewer now stands: a card placed while the model was
    // still loading would be left behind at the origin.
    if (events.includes('arrive')) {
      hint.mesh.visible = false;
      hintUntil = 0;
    }
    updateHint(input, events, time);
  }

  // One headset frame of it, while on. `events` are the frame's so far.
  function step(delta, input, events, time) {
    if (!enabled) return [];
    const own = update(delta, input, events);
    draw(input, [...events, ...own], time);
    return own;
  }

  // Idle, with nothing of it drawn: a session's start and end, and switching off.
  function reset() {
    velocity.set(0, 0);
    floorTarget = null;
    turnArmed = true;
    aiming = false;
    target = null;
    arc = [];
    vignette = 0;
    arcDots.count = 0;
    reticle.visible = false;
    hint.mesh.visible = false;
    hintUntil = 0;
    overlay.material.uniforms.vignette.value = 0;
  }

  return {
    /** Whether the sticks move the viewer. The server's switch sets it on every poll. */
    get enabled() { return enabled; },
    set enabled(on) {
      if (enabled && !on) reset();
      enabled = !!on;
    },
    /** The aimed landing, `{point, normal, valid}`, while aiming; else null. */
    get target() { return target; },
    /** The aimed arc's scene points, up to where it ends; empty unless aiming. */
    get arc() { return arc; },
    get aiming() { return aiming; },
    /** 0-1: the walking vignette's strength. */
    get vignette() { return vignette; },
    step,
    reset,
  };
})();

/* ---------------------------------------------------------- headset loop --- */

// A headset frame on plain values -- what the page runs from each XRFrame, and
// the tests on synthetic input. The rig's blink first, then the start (a
// session's first place), then locomotion while it is on: the one place the
// three meet, and none of them knows the others are there.
const headset = {
  /** As a session starts: the rig at the origin, locomotion idle, the start due. */
  begin() {
    rig.reset();
    locomotion.reset();
    arrived = false;
    arrivedAt = null;
  },
  /**
   * One frame. `input` is `{head, left, right, aim}` in the tracked space, each
   * stick `[x, y]` with y negative pushed forward, as XR gamepads report it.
   * Returns the frame's events: 'arrive' as a session is placed at its start,
   * 'aim', 'turn', and 'land' as a jump arrives.
   */
  step(delta, input = {}, time = 0) {
    const events = rig.step(delta, input.head);
    surfaces.refresh();
    // Locomotion off keeps a session where it started -- so a viewer it had
    // carried off before it was switched off, mid-session, is taken back.
    if (!locomotion.enabled && !atStart()) returnToStart();
    events.push(...stepStart(input));
    events.push(...locomotion.step(delta, input, events, time));
    overlay.material.uniforms.fade.value = rig.fade;
    overlay.visible = rig.fade > 0 || overlay.material.uniforms.vignette.value > 0;
    return events;
  },
  /** As a session ends: everything back, and nothing due. */
  end() {
    rig.reset();
    locomotion.reset();
    arrived = true;
    arrivedAt = null;
  },
  /** What a recenter does: see `recenter`. */
  recenter,
  /** An XRFrame read into what `step` takes: see `readHeadsetInput`. */
  read: readHeadsetInput,
  /** Where a session starts, `{point, heading}`, as the model stands now; null without a start node. */
  get start() { return startPlace(); },
};

// The XRFrame side: the poses read, the frame stepped, and the session's space
// re-anchored whenever the rig moved.
function stepHeadset(frame, delta, time) {
  headset.step(delta, headset.read(frame), time);
  if (rig.takeChange()) {
    const { position, orientation } = rig.offset();
    renderer.xr.setReferenceSpace(
      headsetSpace.getOffsetReferenceSpace(new XRRigidTransform(position, orientation)),
    );
  }
}

// Each session starts afresh -- at the model's start node, on its first frame
// with a model in -- and everything drawn for it goes when the session does.
// The desktop view is kept aside for its end (see desktopView), and the
// session draws with a headset's near plane.
renderer.xr.addEventListener('sessionstart', () => {
  desktopView = viewOf();
  holdHeadsetNear();
  headsetSpace = renderer.xr.getReferenceSpace();
  headsetSpace.addEventListener('reset', headset.recenter);
  headset.begin();
  headsetLayer.visible = true;
  surfaces.warm();
});
renderer.xr.addEventListener('sessionend', () => {
  headsetSpace = null;
  headset.end();
  headsetLayer.visible = false;
  if (desktopView) applyView(desktopView);
  desktopView = null;
});

/* -------------------------------------------------------------- scripts --- */

// The extension seam. `PreviewServer` names a set of ES modules in the
// manifest; each is imported once and its default export called with the API
// object below. That is deliberately the ONLY way the page grows behaviour:
// this file stays the stable path, and a new capability (a turntable, a cost
// report, a debug overlay) is a module plus a registry entry rather than
// another branch in here.
//
// A script's failure is contained and, above all, quiet in the status line: an
// optional module that throws must not make a perfectly good preview LOOK
// broken, because the one place this is read is a headset where the console is
// not visible. It is logged, and the model keeps rendering.
const loadedScripts = new Set();
const scriptHooks = { load: [], frame: [], rendered: [], key: [] };

// A panel of rows in the page's chrome, for a script with more to say than a
// status line (see `viewer.addPanel`). Hidden until shown; written as TEXT,
// never markup, since every value a panel shows can come out of the deliverable.
function addPanel(title) {
  const panel = document.createElement('section');
  panel.className = 'panel';
  panel.hidden = true;
  const header = document.createElement('header');
  header.textContent = title;
  const rows = document.createElement('div');
  rows.className = 'rows';
  const footer = document.createElement('footer');
  panel.append(header, rows, footer);
  el.panels.append(panel);
  const cell = (className, text) => {
    const node = document.createElement('div');
    node.className = className;
    node.textContent = text;
    return node;
  };
  return {
    element: panel,
    get shown() { return !panel.hidden; },
    show(on = true) { panel.hidden = !on; },
    setRows(entries) {
      rows.replaceChildren(...entries.flatMap((entry) => {
        if (Array.isArray(entry)) {
          const [key, value, level] = entry;
          return [cell('key', key), cell(`value${level === 'warn' ? ' warn' : ''}`, String(value ?? ''))];
        }
        if (entry.heading) return [cell('heading', entry.heading)];
        return [cell(`line${entry.level === 'warn' ? ' warn' : ''}`, entry.text ?? '')];
      }));
    },
    addButton(label, onClick) {
      const button = document.createElement('button');
      button.className = 'ui';
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', onClick);
      footer.append(button);
      return button;
    },
  };
}

const viewer = {
  THREE,
  scene,
  renderer,
  camera,
  controls,
  pivot,
  setStatus,
  /**
   * Where the headset stands in the scene (see the rig section): `place` is
   * `{x, y, z, yaw}`, `toScene(position)` and `directionToScene(orientation)`
   * map a tracked pose into the scene, and `fade` is the blink's black.
   */
  rig,
  /**
   * The headset's frame on plain values -- what the page runs from each
   * XRFrame, so it runs as well on synthetic input: `begin()` as a session
   * starts, `step(delta, input)` each frame, `end()` as it ends, `recenter()`
   * as the headset's own recenter does, and `read(frame)` the XRFrame read
   * into the input `step` takes. `start` is where a session starts,
   * `{point, heading}`, or null.
   */
  headset,
  /**
   * Getting around (see the locomotion section): `enabled`, which the server's
   * switch sets on every poll, and the aim -- `aiming`, `arc`, `target` -- and
   * the walking `vignette`.
   */
  locomotion,
  /** The model currently on screen, or null between loads. */
  get model() { return current; },
  /** `{size, center}` of the current model, in metres (glTF's unit). */
  get bounds() { return modelBounds; },
  /**
   * What the model on screen is, measured once per load (see measureModel),
   * or null before the first: `file` `{bytes, jsonBytes}`; `load`
   * `{fetchMs, parseMs, setupMs, firstFrameMs}` (the last filled once the
   * first frame after the load has drawn); `objects` (the file's mesh nodes),
   * `meshes` (three.js Meshes -- one per primitive, each its own draw),
   * `triangles`, `vertices`; `size` `{x, y, z}` in metres; `materials`
   * `{file, instances}` (the file's, and the three.js copies made of them);
   * `lightmaps` -- null when nothing is baked -- `{lit, objects, baked,
   * unlit, foreign, maps}`: objects lit by a lightmap, of all objects;
   * objects the file marks as baked (null when it marks none), those of them
   * with no lightmap bound, and objects lit by one they were never baked
   * with, by name; and the distinct lightmap images; `animation` `{clips,
   * materials, tracks}`; and `issues` `[{level, text, names?}]` -- what the
   * load found wrong, as the HUD's warning line reports the first.
   */
  get specs() { return specs; },
  /** The live rendering policy, as read from the deliverable. */
  get policy() { return policy; },
  /**
   * True on a view-only share (the server's guest listener), which refuses
   * every write -- so a script that posts to the server should offer nothing.
   */
  get guest() { return isGuest; },
  /** The AnimationMixer driving the current model's clips, or null. */
  get mixer() { return mixer; },
  /**
   * The clip the transport is on, or null when the model has none:
   * `{name, duration, fps, startFrame, endFrame, sequence}`. `sequence` marks
   * the synthetic whole-timeline entry — every declared shot laid back onto
   * the timeline it was cut from — which is a set of clips rather than one,
   * and is exactly as recordable as a single shot.
   */
  get clip() { return clipInfo(); },
  /** Whether the transport is playing. */
  get playing() { return playing; },
  /** Play or pause the transport; returns the state it ended in. */
  setPlaying(state) {
    if (playing !== !!state) togglePlay();
    return playing;
  },
  /**
   * Pose the model at `seconds` into the current clip, without advancing it.
   * Clamped to the clip. This is what makes a recording a playblast rather
   * than a screen capture: the caller owns the clock.
   */
  poseAt(seconds) {
    const info = clipInfo();
    if (!info) return false;
    seek(info.duration ? seconds / info.duration : 0);
    return true;
  },
  /**
   * The shot covering `seconds` of the whole-timeline clip — the same name the
   * transport readout shows, `'<name> (hold)'` inside a gap — or null when the
   * current clip is a single shot rather than the sequence.
   *
   * Reads the segment the last pose resolved to, so it answers for wherever the
   * model is NOW: call it after `poseAt(seconds)` with the same `seconds`, not
   * before, or it describes the previous frame.
   */
  shotAt(seconds) { return shotLabel(seconds); },
  /**
   * The description the DCC's Shots panel recorded for whatever the model is
   * posed at, or null when the deliverable states none. Reads the last pose,
   * so — like `shotAt` — call it after `poseAt`, not before.
   *
   * Answers on a single clip as well as on the sequence: it is written for a
   * burn-in, where the picker naming the clip on screen is no help.
   */
  descriptionAt() { return shotDescription(); },
  /**
   * Play a clip by name (the names `extras.animation_web` lists, which are the
   * DCC's shot names on a shot-split deliverable). Returns whether it matched.
   */
  playClip(name) {
    // `entry.clip` is null on the synthetic whole-timeline entry, which is a
    // set of shots rather than one clip -- reading `.name` off it threw on
    // every shots-only deliverable. Addressable by its own name too, so a
    // consumer can ask for the sequence the way it asks for a shot.
    const index = clips.findIndex((entry) => (
      entry.clip ? entry.clip.name === name : entry.sequence?.name === name
    ));
    if (index >= 0) selectClip(index);
    return index >= 0;
  },
  /**
   * Subscribe to a page event.
   *  'load'     ({model, gltf, lightmapped, materialCount, clips, specs}) after
   *             each model swap -- `specs` as `viewer.specs`; `lightmapped` and
   *             `materialCount` count three.js material INSTANCES (the lighting
   *             policy's gate, and its old denominator), not the file's
   *  'frame'    ({delta, time}) once per frame, before it is drawn
   *  'rendered' ({delta, time, cpuMs, renderMs}) once per frame, after it is
   *             drawn: the page's CPU time for the frame, and the part of it
   *             inside `renderer.render` (CPU-side; the GPU's is not measured)
   *  'key'      (KeyboardEvent) for keydown, after the page's own shortcuts
   */
  on(event, fn) { (scriptHooks[event] || (scriptHooks[event] = [])).push(fn); },
  /**
   * Add a button to the control bar, styled like the page's own. Scripts get
   * this rather than reaching for document.createElement so a module cannot
   * drift from the page's look — and so the bar stays the one place buttons
   * live when the layout changes.
   */
  addButton(label, onClick) {
    const button = document.createElement('button');
    button.className = 'ui';
    button.textContent = label;
    button.addEventListener('click', onClick);
    document.getElementById('controls').appendChild(button);
    return button;
  },
  /**
   * A panel of rows in the page's chrome, stacked top-right, for a script
   * with more to report than a status line -- the reason `addButton` exists,
   * for output: one look, one place. Hidden until `show()`.
   *
   * Returns `{element, shown, show(on), setRows(rows), addButton(label,
   * onClick)}`. `rows` are `[label, value, level]` pairs, `{heading}` for a
   * section title, or `{text, level}` for a line of its own; `level: 'warn'`
   * tints it. Everything is written as text, never markup.
   */
  addPanel,
  /**
   * A card of text in the headset, for a script with something to say where
   * the page's chrome is not drawn -- the reason `addPanel` exists, for a
   * session: one look, one place. `{name, width, height, metres, radius,
   * over}`: a `width` x `height` canvas on a plane `metres` wide (the canvas's
   * aspect), its corners rounded by `radius` px, drawn `over` the model (never
