<!doctype html>
<!--
  Live WebXR preview page served by pythontk.PreviewServer.

  Polls /manifest.json and swaps the referenced asset in whenever the version
  changes, so a tab left open in a headset keeps up with the DCC without any
  interaction. Served from localhost, which is a secure context, so
  `navigator.xr` is available and the VR button starts a real immersive-vr
  session on any PC-tethered headset. With no headset attached the same page is
  an ordinary orbit-controls preview.

  A caller-supplied serve root is treated as a working copy: an index.html
  already there is never overwritten, so edits made in place survive a restart.
  The default (temp) root is re-synced from this file on every start and every
  publish, so an edit here reaches an already-running session on its next push.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Live Preview</title>
<!--
  Inline, so the browser never issues its automatic /favicon.ico request. The
  serve root holds the deliverable and nothing else, so that request 404s, and
  a red "Failed to load resource" in the console of every preview session is a
  false lead for anyone opening devtools because something IS wrong.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2315171a'/%3E%3Cpath d='M8 2.6l4.6 2.7v5.4L8 13.4 3.4 10.7V5.3z' fill='none' stroke='%237cc3ff' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #15171a; font: 13px/1.5 system-ui, sans-serif; color: #e8eaed; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px;
    background: rgba(20, 22, 26, .82); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 8px; backdrop-filter: blur(8px); pointer-events: none;
    max-width: min(46ch, calc(100vw - 24px));
  }
  #title { font-weight: 600; margin-bottom: 2px; }
  #stats, #hint { color: #9aa0a6; font-size: 12px; }
  #hint { margin-top: 6px; }
  /* What the load found wrong with the deliverable, in the page's warning
     amber: the render cannot show it (a baked object that bound nothing looks
     like an unbaked one), so the HUD has to. */
  #issues { color: #f2b84b; font-size: 12px; margin-top: 4px; }
  #issues[hidden] { display: none; }
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7a7f85; margin-right: 7px; vertical-align: middle;
  }
  #status.live::before { background: #34d058; }
  #status.error::before { background: #f2504b; }
  /* Wraps: the row carries the lookdev panel, and a narrow viewport (a phone
     holding a headset preview) would otherwise push the last control off. */
  #controls {
    position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px;
    flex-wrap: wrap; max-width: calc(100vw - 24px);
  }
  /* Above the button row, and only while the model has clips. Its own row
     because a scrubber needs width the button bar has no room for. */
  #anim {
    position: fixed; bottom: 56px; left: 12px; display: flex; gap: 8px;
    align-items: center; max-width: calc(100vw - 24px);
    /* Wraps for the same reason the button row does, and now needs to: the
       readout carries the current shot's name, so a narrow viewport (a phone
       holding a headset preview) would otherwise squeeze the scrubber to
       nothing to fit it. */
    flex-wrap: wrap;
  }
  #anim[hidden] { display: none; }
  button.ui, select.ui {
    font: inherit; color: #e8eaed; background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  button.ui:hover, select.ui:hover { border-color: rgba(255, 255, 255, .34); }
  select.ui { max-width: 30ch; }
  #scrub { width: 220px; accent-color: #6fb3ff; cursor: pointer; }
  #clipTime {
    color: #9aa0a6; font-size: 12px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Lookdev -- the area for dials that tune how the model READS and write the
     result back into the GLB (see LOOKDEV_ENABLED). A transparent row rather
     than one chrome box: each dial wears its own, so the second and third land
     beside the first without any of them being restyled. */
  #lookdev { display: flex; align-items: center; gap: 8px; }
  #lookdev[hidden] { display: none; }
  /* A dial rather than a toggle, so it wears the button chrome without the
     pointer affordance -- only the slider inside it is grabbable. The chrome is
     restated because `button.ui, select.ui` does not match a span, and without
     it the control renders as bare text over the model. */
  #normals {
    display: flex; align-items: center; gap: 8px; cursor: default;
    color: #9aa0a6; font: inherit;
    background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 4px 8px 4px 14px;
  }
  #normals[hidden] { display: none; }
  #normalScale { width: 110px; accent-color: #6fb3ff; cursor: pointer; }
  #normalValue { font-variant-numeric: tabular-nums; color: #e8eaed; min-width: 3ch; }
  #normalSave { padding: 4px 10px; }
  #normalSave:disabled { opacity: .45; cursor: default; border-color: rgba(255, 255, 255, .16); }
  /* The page's ONE modal, handed to scripts as `viewer.showDialog` for the
     same reason `addButton` exists: a script that asked for options with
     `window.confirm` would wear the browser's chrome over a dark preview, and
     one that built its own box would drift from this page's. Dark backdrop
     rather than a bare panel — it says the page behind it is not taking input,
     which matters because the transport keeps rendering underneath. */
  #dialog {
    /* Above VRButton, which sets z-index 999 inline: a control floating
       over the backdrop is one the modal did not actually take. */
    position: fixed; inset: 0; z-index: 1000; display: flex;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 11, 13, .55); backdrop-filter: blur(3px);
  }
  #dialog[hidden] { display: none; }
  #dialog form {
    display: flex; flex-direction: column; gap: 14px;
    width: min(46ch, 100%);
    padding: 16px 18px; border-radius: 10px;
    background: rgba(20, 22, 26, .96); border: 1px solid rgba(255, 255, 255, .16);
  }
  #dialogTitle { font-weight: 600; }
  #dialogFields { display: flex; flex-direction: column; gap: 9px; }
  /* align-items: flex-start so a label that wraps keeps its box on the first
     line rather than centring it against three lines of text. */
  #dialogFields label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
  #dialogFields input { margin: 3px 0 0; accent-color: #6fb3ff; cursor: pointer; }
  #dialogFields .note { color: #9aa0a6; font-size: 12px; }
  /* A choice row reads as "Label ........ [picker]": centred, because the
     picker is taller than a line of text, and not a pointer -- the label is
     not a toggle the way a checkbox row's is. */
  #dialogFields label.choice { align-items: center; justify-content: space-between; cursor: default; }
  #dialogButtons { display: flex; gap: 8px; justify-content: flex-end; }
  /* Script panels (`viewer.addPanel`): rows of label and value in the HUD's
     chrome, stacked top-right where nothing of the page's own sits. Takes
     pointer events, unlike the HUD, so a value can be selected and copied. */
  #panels {
    position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column;
    gap: 8px; width: min(44ch, calc(100vw - 24px)); max-height: calc(100vh - 120px);
    pointer-events: none;
  }
  /* A column whose ROWS scroll, so the title and the footer's buttons stay in
     view however long the panel grows. */
  .panel {
    pointer-events: auto; display: flex; flex-direction: column; min-height: 0;
    overflow: hidden; padding: 10px 14px; font-size: 12px;
    background: rgba(20, 22, 26, .9); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 8px; backdrop-filter: blur(8px);
  }
  .panel[hidden] { display: none; }
  .panel header { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .panel .rows {
    display: grid; grid-template-columns: max-content 1fr; gap: 1px 12px;
    min-height: 0; overflow: auto;
  }
  .panel .key { color: #9aa0a6; }
  .panel .value { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .panel .heading { grid-column: 1 / -1; margin-top: 7px; font-weight: 600; }
  .panel .line { grid-column: 1 / -1; color: #9aa0a6; }
  .panel .warn { color: #f2b84b; }
  .panel footer { display: flex; gap: 8px; margin-top: 8px; }
  .panel footer:empty { display: none; }
  .panel footer button.ui { padding: 4px 10px; }
  /* VRButton positions itself bottom-center with inline styles; leave it be. */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div id="title">Preview</div>
  <div id="status">connecting…</div>
  <div id="stats"></div>
  <div id="issues" hidden></div>
  <div id="hint"></div>
</div>

<div id="panels"></div>

<div id="anim" hidden>
  <select class="ui" id="clipSelect" title="Which animation clip to play. Shots declared in the DCC are listed first; a clip marked (full range) is the whole timeline the exporter kept alongside them. On a deliverable that ships only shots, FULL SEQUENCE plays them all in order on the timeline they were cut from."></select>
  <button class="ui" id="playToggle" title="Play / pause (space)">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1"
         title="Scrub the current clip. On FULL SEQUENCE the readout beside it names the shot the playhead is standing in, and marks a gap between shots as a hold.">
  <span id="clipTime"></span>
</div>

<div id="controls">
  <button class="ui" id="frameBtn" title="Re-frame the camera on the model">Frame</button>
  <div id="lookdev" hidden>
    <span class="ui" id="normals" hidden
          title="How strongly the normal maps read on the baked materials. A lightmap carries no direction, so on its own it cannot show a normal map; the preview relieves the bake along the key-light direction so the map reads the way it would under a runtime light. 0 is the pure bake. Save writes the value into the GLB itself as normalTexture.scale.">
      Normals
      <input id="normalScale" type="range" min="0" max="4" step="0.05" value="1"
             title="Normal map strength on baked materials">
      <span id="normalValue">1.00</span>
      <button class="ui" id="normalSave" disabled
              title="Write this strength into the GLB as normalTexture.scale, so it ships with the file">Save</button>
    </span>
  </div>
</div>

<div id="dialog" hidden>
  <form id="dialogForm">
    <div id="dialogTitle"></div>
    <div id="dialogFields"></div>
    <div id="dialogButtons">
      <button class="ui" type="button" id="dialogCancel">Cancel</button>
      <button class="ui" type="submit" id="dialogConfirm">OK</button>
    </div>
  </form>
</div>

<script>
  // Boot watchdog — a CLASSIC script on purpose. Everything below rides three
  // module imports from unpkg.com, and when that fetch is blocked (offline
  // box, default-deny outbound firewall — a real deployment here) the module
  // simply never executes: no error event, no status change, just a dark page
  // stuck on "connecting…" with the actual failure invisible. The module's
  // first statement flips the flag; if it hasn't within 8s, say what is
  // actually wrong. A slow CDN that boots later overwrites this on next poll.
  setTimeout(() => {
    if (window.__viewerBooted) return;
    const status = document.getElementById('status');
    status.textContent = 'three.js failed to load — needs unpkg.com.';
    status.className = 'error';
  }, 8000);
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__viewerBooted = true; // imports resolved — stand the boot watchdog down

const POLL_MS = 1000;
const LOAD_RETRIES = 3;

const el = {
  title: document.getElementById('title'),
  status: document.getElementById('status'),
  stats: document.getElementById('stats'),
  issues: document.getElementById('issues'),
  hint: document.getElementById('hint'),
  panels: document.getElementById('panels'),
  frameBtn: document.getElementById('frameBtn'),
  anim: document.getElementById('anim'),
  clipSelect: document.getElementById('clipSelect'),
  playToggle: document.getElementById('playToggle'),
  scrub: document.getElementById('scrub'),
  clipTime: document.getElementById('clipTime'),
  lookdev: document.getElementById('lookdev'),
  normals: document.getElementById('normals'),
  normalScale: document.getElementById('normalScale'),
  normalValue: document.getElementById('normalValue'),
  normalSave: document.getElementById('normalSave'),
  dialog: document.getElementById('dialog'),
  dialogForm: document.getElementById('dialogForm'),
  dialogTitle: document.getElementById('dialogTitle'),
  dialogFields: document.getElementById('dialogFields'),
  dialogCancel: document.getElementById('dialogCancel'),
  dialogConfirm: document.getElementById('dialogConfirm'),
};

/* ---------------------------------------------------------------- scene --- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// A lost GPU context takes every texture and buffer with it, and NOTHING on
// this page noticed: measured against a forced loss, the canvas went blank
// while the overlay still showed a green dot, "v4 · updated 3:04:24 PM",
// "1500 meshes · 96,928 tris" and "Headset detected" — the page reporting
// perfect health with nothing being drawn. That reads as "the textures went
// missing" and is unguessable from the outside. The causes here are all
// silent: a display-driver reset, GPU memory pressure, and a headset link
// dropping (which renegotiates the adapter under an immersive session).
// three.js registers its own handlers and re-uploads everything if a restore
// arrives — measured, the compressed textures come back — but the browser is
// under no obligation to send one, so a page can sit blank indefinitely.
// Hence: say which it is, and say the one thing that fixes the stuck case.
// Sticky, and it outranks every other status: the canvas stays blank until
// the context comes back, so the NEXT push repainting the overlay green (see
// `setStatus`) would reinstate the exact lie this exists to stop -- and
// pushing again is the first thing anyone does when a preview looks wrong.
let contextLost = false;
const LOST_MESSAGE = 'graphics context lost — reload';

renderer.domElement.addEventListener('webglcontextlost', () => {
  contextLost = true;
  setStatus(LOST_MESSAGE, 'error');
  el.hint.textContent = 'The GPU dropped this page. Nothing is drawing — reload.';
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
  contextLost = false; // Cleared FIRST, or the guard below swallows this.
  setStatus('context restored', 'live');
  // Hand the hint back to whoever owns it, rather than leaving a stale
  // recovery message sitting where the XR state belongs.
  if (navigator.xr) refreshXrSupport();
  else el.hint.textContent = '';
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const pmrem = new THREE.PMREMGenerator(renderer);
// Assigned for the life of the session, on the SCENE: the main light for
// everything that is not baked, and the reflections for everything that is.
// What a baked material takes from it is decided in its shader, not by a
// per-material intensity (see patchBakedShader).
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// The RoomEnvironment IBL above is the main light. Piling a bright hemisphere
// and key light on top of it (as this once did, at 1.6 and 2.2) drives every
// surface to clipping, and a blown-out surface cannot show emissive at all:
// the emissive term is *added* to the lit result, so once the diffuse is
// already past white it contributes nothing visible. Measured before the fix:
// a material with emissiveFactor [1,0,0] rendered (247,242,243) — a red bias
// of five 8-bit levels, indistinguishable from white. One modest key light for
// form definition is enough alongside the environment.
const DEFAULT_KEY_INTENSITY = 0.9;
// The environment level, for the whole model, and the exposure the look was
// approved through. Declared as named constants for the same reason as the
// one above: they are the FALLBACKS the published policy is read against (see
// readRenderingPolicy), and a fallback that only exists inline is one a test
// cannot compare with what the deliverable actually ships.
const DEFAULT_ENV_INTENSITY = 1;
const DEFAULT_TONE_EXPOSURE = 1;
// How strongly a BAKED material reflects that environment (its specular term;
// the diffuse is its bake -- see patchBakedShader). The export chooses it, as
// `lightmappedMaterials.envMapIntensity`; this is the recipe's own default.
const DEFAULT_BAKED_ENV_INTENSITY = 0.25;

// The rig this page renders with. The values above are what it FALLS BACK to;
// the live ones come from the deliverable itself, which publishes the whole
// recipe as `handoff.rendering` inside its own scene sidecar. That direction
// matters: the asset carries no lights, so the policy is part of the hand-off,
// and while the viewer defined its own numbers the published recipe could only
// be kept honest by a test pinning the two spellings together. Now the file is
// the source and this page is one of its readers.
const POLICY_FALLBACK = Object.freeze({
  keyIntensity: DEFAULT_KEY_INTENSITY,
  environmentIntensity: DEFAULT_ENV_INTENSITY,
  toneMappingExposure: DEFAULT_TONE_EXPOSURE,
  bakedEnvIntensity: DEFAULT_BAKED_ENV_INTENSITY,
});
let policy = { ...POLICY_FALLBACK };

// One `extras` block, wherever it rides. Three holders are real: the first
// scene's extras (a native DCC export writes there), the glTF ROOT's (where
// every MeshConvert applier writes), and `scene.userData` (GLTFLoader's parsed
// copy of the scene's). A value can also be a JSON string rather than an
// object, depending on the producer. This page reads three such blocks
// (`scene_sidecar`, `lightmap_web`, `animation_web`) and hand-rolling the probe
// per block is how one of them ends up missing a holder and going silently
// inert on a deliverable the others handle.
function readExtras(gltf, key) {
  for (const holder of [
    gltf.parser?.json?.scenes?.[0]?.extras,
    gltf.parser?.json?.extras,
    gltf.scene?.userData,
  ]) {
    const raw = holder && holder[key];
    if (!raw) continue;
    if (typeof raw !== 'string') return raw;
    try { return JSON.parse(raw); } catch { /* keep looking */ }
  }
  return null;
}

// Reads `extras.scene_sidecar.handoff.rendering`, written by
// MeshConvert.apply_scene_sidecar. Every field is taken only if it is a finite
// NUMBER: the published policy is documentation as much as data, so some of its
// entries are deliberately prose (`lightMapIntensity` says "per material, from
// extras.lightmap_web"), and a viewer that assigned a string to an intensity
// would render black with nothing in the file looking wrong. An older GLB, or
// one from another producer, simply keeps the fallbacks.
function readRenderingPolicy(gltf) {
  const published = readExtras(gltf, 'scene_sidecar')?.handoff?.rendering;
  const num = (value, fallback) =>
    (typeof value === 'number' && isFinite(value) ? value : fallback);
  // Falling back through POLICY_FALLBACK rather than through the constants
  // again: one table names what this page does without a published policy, and
  // it is the same table the initial value is taken from.
  policy = {
    keyIntensity: num(published?.keyLight?.intensity, POLICY_FALLBACK.keyIntensity),
    environmentIntensity: num(
      published?.environment?.intensity, POLICY_FALLBACK.environmentIntensity),
    toneMappingExposure: num(
      published?.renderer?.toneMappingExposure, POLICY_FALLBACK.toneMappingExposure),
    bakedEnvIntensity: num(
      published?.lightmappedMaterials?.envMapIntensity, POLICY_FALLBACK.bakedEnvIntensity),
  };
  renderer.toneMappingExposure = policy.toneMappingExposure;
}

const keyLight = new THREE.DirectionalLight(0xffffff, DEFAULT_KEY_INTENSITY);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);

const GRID_SIZE = 20;  // m across, centred on the origin
const grid = new THREE.GridHelper(GRID_SIZE, 40, 0x3a3f45, 0x25292e);
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);
// What a view frames when the model has nothing drawable in it (see homeView).
const GRID_BOX = new THREE.Box3(
  new THREE.Vector3(-GRID_SIZE / 2, 0, -GRID_SIZE / 2),
  new THREE.Vector3(GRID_SIZE / 2, 0, GRID_SIZE / 2),
);

// Degrees, vertical: the desktop view's own, whenever no start camera sets one.
const DEFAULT_FOV = 55;
const camera = new THREE.PerspectiveCamera(DEFAULT_FOV, innerWidth / innerHeight, 0.01, 500);
camera.position.set(2.2, 1.8, 2.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

// The nearest a headset session draws, at most. The desktop view sizes its near
// plane to the model -- 0.23 m for a 150 m ground framed whole, for the depth
// precision a view from 230 m away wants -- and three.js hands `camera.near` to
// the session as its depthNear. In a session the viewer stands IN the model at
// human scale, and that plane cut away the blink, the arrival fade and the
// comfort vignette (one quad, OVERLAY_DISTANCE in front of each eye) and a
// controller brought within a hand of the face.
const HEADSET_NEAR = 0.02;

// The desktop view -- where the orbit camera stands and looks, its lens, its
// clip planes and what it orbits -- kept aside while a headset presents, and
// put back as the session ends. three.js drives the page's camera from the
// headset meanwhile (WebXRManager.updateUserCamera writes each XR frame's head
// pose, field of view and projection into it) and restores none of it, so a
// session otherwise left the desktop view where the headset last was, at the
// headset's field of view. Null outside a session.
let desktopView = null;

function viewOf() {
  return {
    position: camera.position.clone(),
    quaternion: camera.quaternion.clone(),
    fov: camera.fov,
    zoom: camera.zoom,
    near: camera.near,
    far: camera.far,
    target: controls.target.clone(),
  };
}

function applyView(view) {
  camera.position.copy(view.position);
  camera.quaternion.copy(view.quaternion);
  camera.fov = view.fov;
  camera.zoom = view.zoom;
  camera.near = view.near;
  camera.far = view.far;
  controls.target.copy(view.target);
  camera.updateProjectionMatrix();
  controls.update();
}

// The near plane a session draws with: the desktop's, down to HEADSET_NEAR.
function holdHeadsetNear() {
  if (camera.near <= HEADSET_NEAR) return;
  camera.near = HEADSET_NEAR;
  camera.updateProjectionMatrix();
}

// The clip planes a framing chose (frameCamera, homeView), and the view as it
// then stands. Mid-session -- a push landing, the Frame button -- the framing is
// the view the session hands back at its end, and the camera keeps the
// headset's near plane meanwhile.
function settleView(near, far) {
  camera.near = near;
  camera.far = far;
  camera.updateProjectionMatrix();
  controls.update();
  if (!desktopView) return;
  desktopView = viewOf();
  holdHeadsetNear();
}

// Everything loaded hangs off this pivot, so swapping models and re-scaling
// never touches the lights, grid or camera rig.
const pivot = new THREE.Group();
scene.add(pivot);

/* ------------------------------------------------------------------- xr --- */

// Support is re-checked on `devicechange`, not only at load. A headset powered
// on, plugged in or woken AFTER the page opened is the normal case -- the page
// is left open for the next push, and the headset is not -- and a load-time-only
// check answers "no device" forever, curable only by a reload. Finding the tab
// to reload it is exactly what nobody can do while wearing one.
let vrButton = null;
let enterTimer = null;
const HINT_READY = 'Headset detected — press Enter VR.';
const HINT_STARTING = 'Starting session…';

// Set from the manifest, because this is the one thing the SERVER can see and
// the page cannot: whether an OpenXR runtime is installed at all. Without the
// distinction "no immersive device" reads as "connect a headset" to someone
// whose headset IS connected — the cable is in, the desktop app is running,
// and the only missing piece is a Link session, which nothing on screen names.
// Null until the first poll answers, so the wording stays generic until known.
let xrRuntimeInstalled = null;

function noDeviceHint() {
  if (!xrRuntimeInstalled) {
    return 'No headset — connect one, this page will notice.';
  }
  return 'No headset presenting — start Link or SteamVR.';
}

function refreshXrSupport() {
  return navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
    if (supported && !vrButton) {
      vrButton = VRButton.createButton(renderer);
      // CAPTURE phase, so this runs BEFORE the button's own handler: a failure
      // message from the previous attempt has to be cleared on the way in, or a
      // press that now succeeds leaves the page still reporting the old
      // failure. Bubble phase would run after the throw and wipe the fresh
      // message instead of the stale one.
      vrButton.addEventListener('click', () => {
        // Clears a failure message from the previous attempt, and starts the
        // watchdog below.
        el.hint.textContent = HINT_STARTING;
        clearTimeout(enterTimer);
        // A refused session rejects and is reported; a headset that is asleep
        // or not presenting leaves `requestSession` PENDING instead, so nothing
        // rejects, nothing starts, and the button sits there saying ENTER VR --
        // the same dead-button symptom, with no error anywhere to explain it.
        // Same treatment as the CDN watchdog: say so rather than hang silently.
        enterTimer = setTimeout(() => {
          if (renderer.xr.isPresenting) return;
          // Only overwrite our own "starting" text: a rejection that already
          // reported a REASON is more useful than this generic timeout.
          if (el.hint.textContent === HINT_STARTING) {
            el.hint.textContent = 'Headset did not answer — is Link running?';
          }
        }, 12000);
      }, true);
      // Born inert under an open prompt, like everything else behind it.
      vrButton.inert = !el.dialog.hidden;
      document.body.appendChild(vrButton);
    } else if (!supported && vrButton && !renderer.xr.isPresenting) {
      // A button whose device has gone is a button that throws when pressed.
      // NEVER while presenting, though: that same button is the only way out
      // of the session, so removing it would strand whoever is wearing it.
      vrButton.remove();
      vrButton = null;
    }
    // Not while the context is lost: this fires UNPROMPTED on `devicechange`,
    // and "Headset detected — press Enter VR" under a red "context lost"
    // status invites the one action that cannot work. The button itself is
    // still kept current, so a restore needs no second device event.
    if (contextLost) return;
    el.hint.textContent = supported ? HINT_READY : noDeviceHint();
  }).catch((error) => {
    // Say which case it is in rather than rejecting into the console, where a
    // headset user cannot see it. Same reasoning as the CDN watchdog above.
    el.hint.textContent = 'WebXR device check failed: ' + error;
  });
}

// A refused `requestSession` rejects INSIDE VRButton's own click handler, where
// nothing catches it, so the button just sits there saying ENTER VR -- the
// failure reads as a dead button rather than as a refusal with a reason. The
// commonest cause is an immersive session still held by another tab, another
// browser or a crashed one, which is exclusive per device, invisible from this
// page, and unguessable from inside a headset.
// Both events, because which one fires is not ours to choose: Chromium raises
// InvalidStateError from `requestSession` SYNCHRONOUSLY, so it surfaces as an
// uncaught error rather than a rejected promise, while other refusals reject.
// Listening to only one of them is how the first attempt at this failed.
function reportXrFailure(text) {
  if (!/XRSession|requestSession|immersive/i.test(text)) return false;
  el.hint.textContent = 'Enter VR failed — ' + text;
  return true;
}
addEventListener('unhandledrejection', (event) => {
  const error = event.reason;
  if (reportXrFailure(String((error && error.message) || error || ''))) {
    event.preventDefault();
  }
});
addEventListener('error', (event) => {
  const error = event.error;
  reportXrFailure(String((error && error.message) || event.message || ''));
});

if (navigator.xr) {
  refreshXrSupport();
  // Fired by the UA whenever the set of available XR devices changes. Guarded
  // because everything below this block -- the model load, the poll loop -- is
  // in the same module: a throw here would cost the whole page, turning "no VR
  // button" into "nothing works", and no browser is worth that trade.
  if (typeof navigator.xr.addEventListener === 'function') {
    navigator.xr.addEventListener('devicechange', refreshXrSupport);
  }
} else {
  // Reachable when the page is opened over a plain-HTTP LAN address rather
  // than localhost: WebXR is gated on a secure context, and the failure is
  // otherwise silent (the button simply never appears).
  el.hint.textContent = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'WebXR unavailable here — try Edge or Chrome.'
    : 'WebXR needs localhost or HTTPS.';
}

/* ---------------------------------------------------------------- model --- */

const loader = new GLTFLoader();
// KTX2/Basis support (KHR_texture_basisu) — what a KTX2 Texture File Type
// row emits (glb_options), and REQUIRED by those GLBs (they carry no
// fallback image). One transcoder serves both Basis codecs (ETC1S and UASTC);
// detectSupport picks the GPU target per device — ASTC on a standalone
// headset, BC7/DXT on desktop — which is the whole point: the texture stays
// block-compressed in GPU memory instead of decoding to RGBA. The wasm rides
// the same unpkg CDN as every import above, a dependency the boot watchdog
// already owns. Inert for WebP/PNG deliverables.
const ktx2Loader = new KTX2Loader()
  .setTranscoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/basis/')
  .detectSupport(renderer);
loader.setKTX2Loader(ktx2Loader);
let current = null;
let modelBounds = null;

// `node.material` is a single material, an ARRAY of them (a multi-material mesh), or
// absent (any non-mesh in the graph). Every walk below has to handle all three, so the
// normalization lives here once — three hand-rolled copies is exactly how one of them ends
// up quietly missing the array case and skipping half a mesh's materials.
function materialsOf(node) {
  if (Array.isArray(node.material)) return node.material;
  return node.material ? [node.material] : [];
}

function disposeModel(root) {
  // GLTFLoader allocates GPU resources that garbage collection cannot reclaim;
  // without this an edit-and-republish loop leaks a full copy of the model's
  // buffers and textures every single push.
  root.traverse((node) => {
    if (node.geometry) node.geometry.dispose();
    for (const material of materialsOf(node)) {
      for (const value of Object.values(material)) {
        // Everything here belongs to the MODEL and dies with it. The session's
        // environment lives on the scene, never on a material -- while baked
        // materials briefly carried it as their own `envMap`, this loop needed
        // a guard or the second push rendered unlit.
        if (value && value.isTexture) value.dispose();
      }
      material.dispose();
    }
  });
}

function layout() {
  if (!current || !modelBounds) return;
  const { size, center } = modelBounds;
  // At its true size, centred on the pivot in X and Z and stood on the floor in
  // Y. The pivot stays at the origin and carries nothing of its own, which is
  // what makes rotating it a spin rather than an orbit: `viewer.pivot` is handed
  // to every viewer script (the packaged `turntable` is exactly that rotation),
  // so the group they are given has to turn about the model.
  current.position.set(-center.x, -(center.y - size.y / 2), -center.z);
}

// *model*'s box in the PIVOT's frame -- the frame layout() places it in --
// rather than the world's. A script may have turned the pivot (the turntable
// keeps its angle across pushes, on purpose), and the world box of a turned
// model is neither its size nor, applied as the pivot-local offset above, its
// centre: measured, a push under a quarter turn stood an off-origin slab at
// [3.0, 0.5, -17.0], and the HUD quoted the size of the turned box. Measured
// detached, so the world matrices it is read through are the model's own.
function boxInPivot(model) {
  pivot.remove(model);
  const box = new THREE.Box3().setFromObject(model);
  pivot.add(model);
  return box;
}

// The whole model, framed from the front, right and above, on the lens `fov`
// (degrees, vertical): by default the desktop view's -- mid-session the camera
// holds the headset's (see desktopView), and the framing is the one the
// session hands back. A model with nothing drawable leaves the view alone.
function frameCamera(fov = desktopView ? desktopView.fov : camera.fov) {
  if (!current) return;
  const box = new THREE.Box3().setFromObject(current);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.05);
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(fov / 2));

  camera.fov = fov;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0.7, 0.5, 1).normalize().multiplyScalar(distance * 1.3));
  settleView(Math.max(distance / 1000, 0.01), distance * 100);
}

/* ------------------------------------------------------------- lightmaps --- */

// glTF 2.0 has no lightmap slot, so a baked lightmap reaches us disguised as a real
// texture slot on TEXCOORD_1 (see blendertk's LightmapWebExport). The scene extras carry
// a `lightmap_web` manifest naming which materials are wearing the disguise; this puts
// them back. Three details decide whether it looks right or subtly wrong:
//
//   * colorSpace — GLTFLoader treats occlusion as DATA and loads it linear, but the map
//     was written sRGB-encoded to survive 8-bit. Left linear it renders far too dark.
//   * channel — the map is packed against UV2, not UV0.
//   * intensity — the encoder divided by a percentile to fit a huge HDR range into a PNG;
//     multiplying it back is what restores the original exposure.
//
// Also clears the slot it arrived in, so the same texture is not applied twice under two
// different interpretations. Returns how many materials it bound, which is what decides
// the scene's lighting policy (see applyLighting).
//
// Which real slot each carrier arrives in — mirrors blendertk's LightmapWebExport.CARRIERS.
// A Map rather than an object literal because the lookup decides whether to REBIND a
// material: property access on an object literal walks the prototype chain, so a manifest
// naming 'constructor' as its carrier would hand back a truthy function and slip past the
// refusal below. Map.get answers only for keys actually in the table.
const CARRIER_SLOTS = new Map([['occlusion', 'aoMap'], ['emissive', 'emissiveMap']]);

// What a BAKED material takes from the page's own lighting.
//
// A lightmap is irradiance: it already holds the surface's diffuse lighting,
// every light in the scene and the sky included. three.js adds it through
// BRDF_Lambert and then ALSO adds the environment's irradiance, so a baked
// surface was lit twice. Measured on a production room (2026-09-21): a
// quarter of the environment on top of the bake doubled every shadow and
// lifted every surface, which reads as a washed-out bake and gets reported
// as a baker regression. The same environment is the only thing in the
// render that can show a reflection, a roughness map or a normal map on a
// baked surface -- a lightmap carries no direction and no specular, and with
// the environment off entirely (as this once did) a room measured 51 of 57
// materials baked, 54 normal maps bound, no surface detail visible anywhere.
// So it is not withdrawn, it is confined to the SPECULAR term: the role a
// reflection probe plays for a lightmapped surface in a runtime. The diffuse
// comes from the bake alone. That is one line dropped from the chunk below,
// the one that adds the environment's irradiance -- a shader rule rather
// than a material setting, because `envMapIntensity` scales both terms.
//
// And at the LEVEL the export chose (`lightmappedMaterials.envMapIntensity`,
// read by readRenderingPolicy): the environment is a bright studio, not the
// room the bake lit, so at full strength its reflections lifted the darkest
// baked surfaces from 0.06 to 0.22 of display (measured, a production room).
// With the irradiance line gone, everything the environment gives a baked
// material rides `radiance` / `clearcoatRadiance` (`iblIrradiance` stays 0,
// so the multiscatter and sheen terms that read it add nothing), and one
// uniform scaling those two at the end of the chunk is the whole level --
// shared by every baked material, so a new level needs no recompile.
//
// Relief. A lightmap never consults the normal, so a normal map on a baked
// surface reached the picture only through the environment's specular
// (measured: normalScale 1 -> 4 moved ~1% of pixels by ~0.4/255, reported as
// "no normal effect at all"). The fix modulates the bake by the map: the
// baked light is taken to arrive along the page's own key-light direction,
// and the lightmap texel is scaled by how the PERTURBED normal faces that
// direction relative to how the flat one does, half-Lambert wrapped.
//
// From the surface's OWN side of its plane, though: where it faces away from
// the key, the direction is mirrored across that plane first. A bake's light
// reached a surface from its front whichever side of it the key sits on, and
// taken as it stood, the key lit every surface facing away from it from
// behind -- the flat response the ratio divides by fell toward zero, so a
// FLAT map rendered a face turned straight away from the key black (and one
// 20 degrees off that at 134 where the bake puts 169), and one bump moved a
// ceiling 40 levels where it moved the floor 6 (measured 2026-09-23, reported
// as normals rendering wrong). Mirrored, the flat response never falls below
// 0.5, so the ratio stays within [0, 2] with no clamp, is exactly 1 wherever
// the map is flat -- normalScale 0 renders the pure bake -- and a surface
// wears a bump exactly as its mirror image across the key's horizon does. A
// surface already facing the key renders as it always did.
//
// Not a second bake and not physically derived: it is the single-direction
// reduction of the directional-lightmap trick, chosen because it is one
// uniform and a few lines of GLSL, and because it makes `normalTexture.scale`
// -- the value the file carries -- do in this preview what it does in a
// runtime that lights. Only installed when the material has a normal map:
// there is nothing to relieve by otherwise, and the pure bake must stay the
// pure bake.
//
// Both edits land in three.js 0.169's `lights_fragment_maps` chunk, at
// `iblIrradiance += getIBLIrradiance( geometryNormal );` and at
// `irradiance += lightMapIrradiance;`; `normal` is the perturbed normal there
// and `nonPerturbedNormal` the geometry's own. The key light is a world
// direction and the shader works in view space, so it is turned per fragment
// with the `viewMatrix` three.js already provides.
//
// The hook receives the source with its `#include <...>` directives still
// UNEXPANDED (the renderer resolves them afterwards), so neither line can be
// matched in what the hook is handed: the directive is replaced with the
// chunk itself, edited. A replace aimed at a line directly is a silent no-op
// -- measured, the "patched" render moved the same ~1% of pixels as the
// unpatched one -- which is why the live suite asserts on the pixels.
const IBL_DIFFUSE_GLSL = 'iblIrradiance += getIBLIrradiance( geometryNormal );';
const LIGHTMAP_GLSL = 'irradiance += lightMapIrradiance;';
// Checked once, at boot, against the chunk this three.js ships: a line it no
// longer carries makes its replace below a silent no-op -- every baked surface
// washes out again, or the Normal Scale dial goes inert -- so a miss is an
// ERROR (the live suite fails on console errors), not a warning nobody in a
// headset reads.
for (const [edit, line] of [['environment diffuse', IBL_DIFFUSE_GLSL], ['normal relief', LIGHTMAP_GLSL]]) {
  if (!THREE.ShaderChunk.lights_fragment_maps.includes(line)) {
    console.error(`three.js changed lights_fragment_maps: the baked shader's ${edit} edit no longer applies`);
  }
}
const bakeLightDir = { value: new THREE.Vector3() };
const RELIEF_GLSL = [
  '{',
  '  vec3 bakeL = normalize( ( viewMatrix * vec4( bakeLightDir, 0.0 ) ).xyz );',
  // Onto the surface's own side of its plane (see above) -- a reflection, so
  // still unit length.
  '  bakeL -= 2.0 * min( dot( nonPerturbedNormal, bakeL ), 0.0 ) * nonPerturbedNormal;',
  // `flat` is a reserved word in GLSL (an interpolation qualifier).
  '  float bumpLit = dot( normal, bakeL ) * 0.5 + 0.5;',
  '  float baseLit = dot( nonPerturbedNormal, bakeL ) * 0.5 + 0.5;',
  '  irradiance += lightMapIrradiance * ( bumpLit / baseLit );',
  '}',
].join('\n');

// The baked-reflection level: ONE uniform object shared by every baked
// material's program, so applyLighting sets it once for all of them.
const bakedEnvUniform = { value: DEFAULT_BAKED_ENV_INTENSITY };
const BAKED_ENV_GLSL = [
  '#if defined( RE_IndirectSpecular )',
  '  radiance *= bakedEnvIntensity;',
  '  clearcoatRadiance *= bakedEnvIntensity;',
  '#endif',
].join('\n');

function patchBakedShader(material) {
  const relieve = Boolean(material.normalMap);
  if (relieve) bakeLightDir.value.copy(keyLight.position).normalize();
  material.onBeforeCompile = (shader) => {
    let chunk = THREE.ShaderChunk.lights_fragment_maps.replace(IBL_DIFFUSE_GLSL, '');
    if (relieve) chunk = chunk.replace(LIGHTMAP_GLSL, RELIEF_GLSL);
    if (!shader.fragmentShader.includes('#include <lights_fragment_maps>')) {
      console.error('three.js changed its fragment shader: the baked shader edits no longer apply');
    }
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <lights_fragment_maps>', `${chunk}\n${BAKED_ENV_GLSL}`);
    shader.uniforms.bakedEnvIntensity = bakedEnvUniform;
    let declared = 'uniform float bakedEnvIntensity;';
    if (relieve) {
      shader.uniforms.bakeLightDir = bakeLightDir;
      declared += '\nuniform vec3 bakeLightDir;';
    }
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\n${declared}`);
  };
  // A distinct program from an unpatched material's with the same maps, or
  // the renderer would hand one of them the other's shader.
  material.customProgramCacheKey = () => (relieve ? 'baked-relief' : 'baked');
}

// `issues` collects what the pass had to skip, for the load's report (see
// measureModel): each skip leaves a material rendering unlit, which on screen is
// indistinguishable from a material that was never baked.
function applyLightmaps(gltf, issues = []) {
  const manifest = readExtras(gltf, 'lightmap_web');
  if (!manifest || !manifest.materials) return 0;

  // An unknown carrier is REFUSED rather than defaulted. The previous form special-cased
  // 'fused' (a bake level both DCC tools have since removed, so nothing can emit it) and
  // sent everything else to aoMap, so the only branch it had was dead while any future or
  // misspelled carrier would be rebound under the interpretation it is least likely to
  // want. Not binding leaves the map in the slot it arrived in, where it still reads as
  // plausible occlusion -- and is SAID, since that is all anyone would see.
  const carrier = manifest.carrier || 'occlusion';
  const slot = CARRIER_SLOTS.get(carrier);
  if (!slot) {
    issues.push({
      level: 'error',
      text: `no lightmap bound: the file carries them as '${carrier}', which this page does not read`,
    });
    return 0;
  }

  const uv = manifest.uv ?? 1;
  let bound = 0;
  const answered = new Set();  // manifest names some loaded material wears
  const emptied = new Set();   // ... whose map was not in the carrier slot

  gltf.scene.traverse((node) => {
    for (const material of materialsOf(node)) {
      // Own keys only: the manifest is parsed JSON, and a material named
      // 'constructor' would otherwise find Object's and bind whatever sits in
      // its occlusion slot as light -- the reason CARRIER_SLOTS is a Map.
      if (!Object.hasOwn(manifest.materials, material.name)) continue;
      const entry = manifest.materials[material.name];
      answered.add(material.name);
      if (!entry || material.userData.lightmapBound) continue;
      const texture = material[slot];
      if (!texture) {
        emptied.add(material.name);
        continue;
      }

      texture.colorSpace = manifest.encoding === 'srgb' ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      texture.channel = uv;
      // Floors/walls fill the frame at grazing angles, where plain trilinear
      // collapses the atlas to its coarsest mips and rect gutters average into
      // the content as dark tile borders. Anisotropic taps keep fine-mip
      // detail along the view direction; 8 is plenty and headset-safe.
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      texture.needsUpdate = true;

      material.lightMap = texture;
      material.lightMapIntensity = entry.intensity ?? 1;
      material[slot] = null;
      if (carrier === 'emissive') material.emissive = new THREE.Color(0x000000);
      patchBakedShader(material);
      material.userData.lightmapBound = true;
      material.needsUpdate = true;
      lightmappedMaterials.push(material);
      bound += 1;
    }
  });
  const unworn = Object.keys(manifest.materials).filter((name) => !answered.has(name));
  if (unworn.length) {
    issues.push({
      level: 'warning',
      text: `${plural(unworn.length, 'lightmapped material')} the file names ${unworn.length === 1 ? 'is' : 'are'} not in the model`,
      names: unworn,
    });
  }
  if (emptied.size) {
    issues.push({
      level: 'warning',
      text: `${plural(emptied.size, 'lightmapped material')} arrived without ${emptied.size === 1 ? 'its' : 'their'} map`,
      names: [...emptied],
    });
  }
  return bound;
}

// The whole lighting policy, in one place, so the load path and a later
// re-read cannot drift into disagreeing about it. Nothing here is per
// material: the environment plays at one level for the whole model, and what
// a BAKED material takes from it is decided in its shader (patchBakedShader)
// -- the specular term only, since its diffuse is in its bake, at the level
// the export published. An earlier form dimmed the environment per baked
// material, diffuse and specular together: any diffuse at all on top of the
// bake washed the room out, which is why the level now reaches the specular
// alone. `lightmappedMaterials` is rebuilt per load and holds only
// materials this model owns, so it dies with the model; the lookdev dials
// read it.
let lightmapped = 0;
let lightmappedMaterials = [];
let materialCount = 0;

function applyLighting() {
  scene.environmentIntensity = policy.environmentIntensity;
  // What a baked material reflects of it: the export's level (see
  // patchBakedShader), on top of the one environment level above.
  bakedEnvUniform.value = policy.bakedEnvIntensity;
  // The key light cannot go per material without render layers, so it stays
  // scene-wide and goes off the moment ANYTHING is baked. Gating it on the
  // model being FULLY baked (as this briefly did) is what blows out a baked
  // room: a scene-wide term cannot be spared the geometry it contradicts, so
  // a 0.9 directional light lands on surfaces whose lighting is already in
  // their lightmap, and a room is routinely partly baked (measured: 51 of 57
  // materials) so the gate never opens. It reads as a baker regression --
  // re-baking with the Maya lights turned down changes nothing, because the
  // extra light is added here, downstream of the EXR.
  //
  // The un-baked props that gate was added for are not left dark: they keep
  // the FULL environment (they were on 0.25 when the key light mattered, which
  // is what made them look unlit), and the environment is normal- and
  // view-dependent -- getIBLIrradiance and getIBLRadiance take the normal --
  // so their normal maps and specular stay legible without it. What they give
  // up is a directional diffuse gradient, which is precisely the term that
  // must not reach the baked geometry standing beside them.
  //
  // Render layers would let the key light skip only the baked meshes, but
  // layers 1 and 2 are already spoken for: three.js 0.169.0 -- the version
  // pinned in the importmap above -- does `cameraL.layers.enable(1)` and
  // `cameraR.layers.enable(2)` in WebXRManager, so geometry parked on layer 1
  // renders to the LEFT EYE ONLY (read from that source, not assumed). A higher
  // layer dodges the collision, but the mask still has to survive into the XR
  // sub-cameras and the failure shows up in a headset rather than at the desk.
  // Layers are also per OBJECT while a bake is per MATERIAL, so a mesh with
  // mixed materials would need a conservative rule regardless.
  keyLight.intensity = lightmapped ? 0 : policy.keyIntensity;
}

/* ----------------------------------------------------------------- specs --- */

// What the deliverable on screen IS, measured once per load -- the HUD's lines,
// the 'load' event's `specs`, and `viewer.specs` for a script that reports more
// (the packaged `inspect`). One pass, one set of units, so the HUD, the console
// and a script cannot disagree about what "objects" or "lightmapped" means.
//
// The units are the author's, not three.js's, because every three.js count here
// is inflated by the pipeline rather than by the scene:
//
//   * OBJECTS are the file's mesh nodes -- what the DCC exported. three.js makes
//     one Mesh per glTF PRIMITIVE, so a machine body with glass and metal is two
//     "meshes", and the count tracks materials per object, not objects.
//   * MATERIALS are the file's, by glTF index. GLTFLoader clones a material per
//     vertex-colour / tangent variant, and the lightmap pass clones one per baked
//     object (`<name>~lm<N>`), so the count grows with the bake, not the scene.
//   * LIGHTMAPPED is said of objects. The HUD once read "51/57 lightmapped
//     materials": a fraction of those inflated instances, against a denominator
//     that included every material nobody meant to bake, and blind to an object
//     wearing a baked material it was never baked with. How much of the MODEL is
//     lit by its bake is the fact the lighting policy turns on (applyLighting),
//     and it is counted in objects -- the unit the bake is made in, and the one
//     the DCC panel's push report (`PreviewBridge.lightmap_summary`) uses.
//
// Where the file says which objects were BAKED -- each carries its bake's
// `lightmapInfo` marker in its node extras -- intent and outcome are compared,
// and every disagreement is an issue: a baked object with no lightmap bound
// renders unlit, an object with one it was never baked with renders someone
// else's lighting, and both look like a plausible, merely-wrong room.
let specs = null;
// The first frame after a load compiles its programs and uploads its textures;
// the loop times it into `specs.load.firstFrameMs` (see the render loop).
let firstFramePending = false;

function plural(count, word) {
  return `${count.toLocaleString()} ${word}${count === 1 ? '' : 's'}`;
}

// A size as the page quotes one -- tenths below 10 of a unit. Scripts get it as
// `viewer.formatBytes`, so a panel (the packaged `inspect`) and the status line
// quote one file one way: two spellings disagreed once ("7 KB" / "6.6 KB").
function formatBytes(bytes) {
  if (bytes < 1024) return `${Math.round(bytes)} B`;
  const [value, unit] = bytes < 1024 * 1024 ? [bytes / 1024, 'KB'] : [bytes / (1024 * 1024), 'MB'];
  return `${value.toFixed(value < 10 ? 1 : 0)} ${unit}`;
}

// The JSON chunk's length from a GLB's header (0 for anything else): what the
// file spends describing itself rather than carrying data.
function glbJsonBytes(buffer) {
  if (buffer.byteLength < 20) return 0;
  const view = new DataView(buffer);
  return view.getUint32(0, true) === 0x46546c67 ? view.getUint32(12, true) : 0;
}

// The object a Mesh belongs to: the glTF node it came from. GLTFLoader makes a
// single-primitive node's Mesh the node itself and groups a multi-primitive
// node's Meshes under a Group standing for it, and records which is which in
// the parser's associations (`nodes`); a file the parser did not annotate falls
// back to the Mesh.
function objectOf(mesh, associations) {
  if (associations?.get(mesh)?.nodes !== undefined) return mesh;
  const parent = mesh.parent;
  if (parent && associations?.get(parent)?.nodes !== undefined) return parent;
  return mesh;
}

// The name the file gives *object* (three.js sanitises its own copy: a Maya
// namespace's ':' is dropped), for the lists an issue names.
function nameOf(object) {
  return object.userData?.name || object.name || '(unnamed)';
}

// Whether the file marks *object* as baked: the bake's per-object marker, in
// either shape it rides (FBX2glTF nests user properties under `fromFBX`; a
// native glTF export writes them at the top of the node's extras), read the way
// MeshConvert._reconcile_node_markers reads them. A cleared marker is empty.
function carriesBakeMarker(object) {
  const data = object.userData || {};
  const raw = data.fromFBX?.userProperties?.lightmapInfo ?? data.lightmapInfo;
  const value = raw && typeof raw === 'object' && 'value' in raw ? raw.value : raw;
  return typeof value === 'string' ? value.trim().length > 0 : Boolean(value);
}

// Measure *gltf* as loaded. `load` carries what only the load path knows: the
// file's bytes, its phases' timings, the clip count and the animated materials.
function measureModel(gltf, load, issues) {
  const associations = gltf.parser?.associations;
  const objects = new Map();  // object -> {name, baked, lit}
  const materials = new Set();
  const instances = new Set();
  const lightmaps = new Set();
  const noBakeUv = new Set();
  let bakeChannel = 1;
  let meshes = 0;
  let triangles = 0;
  let vertices = 0;
  gltf.scene.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    meshes += 1;
    const { geometry } = node;
    const copies = node.isInstancedMesh ? node.count : 1;
    const position = geometry.attributes.position;
    const drawn = geometry.index ? geometry.index.count : position ? position.count : 0;
    triangles += Math.floor(drawn / 3) * copies;
    vertices += (position ? position.count : 0) * copies;
    const owner = objectOf(node, associations);
    let entry = objects.get(owner);
    if (!entry) {
      entry = { name: nameOf(owner), baked: carriesBakeMarker(owner), lit: false };
      objects.set(owner, entry);
    }
    // The primitive too: a marker on mesh DATA (a native glTF export's mesh
    // extras) lands on each primitive's Mesh rather than on the node's Group.
    if (node !== owner && carriesBakeMarker(node)) entry.baked = true;
    for (const material of materialsOf(node)) {
      instances.add(material);
      materials.add(associations?.get(material)?.materials ?? material);
      if (!material.lightMap) continue;
      entry.lit = true;
      lightmaps.add(material.lightMap.source ?? material.lightMap);
      // three.js samples a lightMap on the UV set its channel names -- `uv`
      // for 0, `uvN` past it -- and applyLightmaps sets that channel from the
      // manifest (`uv`, the second set unless it says otherwise). Without that
      // attribute every fragment reads one texel -- flat, plausible, wrong.
      bakeChannel = material.lightMap.channel;
      if (!geometry.attributes[bakeChannel ? `uv${bakeChannel}` : 'uv']) noBakeUv.add(entry.name);
    }
  });

  const all = [...objects.values()];
  const lit = all.filter((object) => object.lit);
  const baked = all.filter((object) => object.baked);
  const coverage = lit.length || baked.length
    ? {
      lit: lit.length,
      objects: all.length,
      // null where the file marks nothing: intent unknown, so unclaimed.
      baked: baked.length || null,
      unlit: baked.filter((object) => !object.lit).map((object) => object.name),
      foreign: baked.length ? lit.filter((object) => !object.baked).map((object) => object.name) : [],
      maps: lightmaps.size,
    }
    : null;
  if (coverage?.unlit.length) {
    issues.push({
      level: 'warning',
      text: `${plural(coverage.unlit.length, 'baked object')} ${coverage.unlit.length === 1 ? 'renders' : 'render'} unlit — no lightmap bound`,
      names: coverage.unlit,
    });
  }
  if (coverage?.foreign.length) {
    issues.push({
      level: 'warning',
      text: `${plural(coverage.foreign.length, 'object')} ${coverage.foreign.length === 1 ? 'wears a lightmap it was' : 'wear a lightmap they were'} never baked with`,
      names: coverage.foreign,
    });
  }
  if (noBakeUv.size) {
    const set = bakeChannel === 1 ? 'second UV set' : `UV set ${bakeChannel} (TEXCOORD_${bakeChannel})`;
    issues.push({
      level: 'warning',
      text: `${plural(noBakeUv.size, 'lightmapped object')} ${noBakeUv.size === 1 ? 'has' : 'have'} no ${set}, so the bake reads one texel`,
      names: [...noBakeUv],
    });
  }

  const { size } = modelBounds;
  return {
    file: { bytes: load.bytes, jsonBytes: load.jsonBytes },
    load: {
      fetchMs: load.fetchMs,
      parseMs: load.parseMs,
      setupMs: load.setupMs,
      firstFrameMs: null,
    },
    objects: objects.size,
    meshes,
    triangles,
    vertices,
    size: { x: size.x, y: size.y, z: size.z },
    materials: { file: materials.size, instances: instances.size },
    lightmaps: coverage,
    animation: { clips: load.clips, materials: load.animated.materials, tracks: load.animated.tracks },
    issues,
  };
}

// Size in metres: glTF's unit, and the one a headset presents 1:1 -- which is
// the whole reason the page shows the model at its true size.
function formatSize({ x, y, z }) {
  const largest = Math.max(x, y, z);
  const places = largest < 10 ? 2 : largest < 100 ? 1 : 0;
  return `${[x, y, z].map((n) => n.toFixed(places)).join(' × ')} m`;
}

// The HUD's lines, short enough for its 46ch: what the model is, then how it is
// lit and animated. Objects, not meshes; lightmapped as a count of objects, not
// a fraction of material instances (see the section comment above).
function specLines(measured) {
  const lines = [
    [
      plural(measured.objects, 'object'),
      plural(measured.triangles, 'tri'),
      formatSize(measured.size),
    ].join(' · '),
  ];
  const detail = [];
  const coverage = measured.lightmaps;
  if (coverage?.lit) {
    // "n of m", never "n/m": a bare fraction reads as a score against a total
    // it does not name, which is how "51/57 lightmapped materials" misled.
    if (coverage.lit < coverage.objects) {
      detail.push(`${coverage.lit} of ${plural(coverage.objects, 'object')} lightmapped`);
    } else {
      detail.push(coverage.objects === 1 ? 'lightmapped' : `all ${coverage.objects} objects lightmapped`);
    }
  }
  const { clips, materials } = measured.animation;
  if (clips) detail.push(plural(clips, 'clip'));
  // Invisible from the render when it fails: a fade that is not being driven
  // looks like an object that simply pops, which is how the fades went
  // unnoticed for as long as they did.
  if (materials) detail.push(plural(materials, 'animated material'));
  if (detail.length) lines.push(detail.join(' · '));
  return lines;
}

function issueText(issue, cap = 3) {
  const names = issue.names || [];
  if (!names.length) return issue.text;
  const listed = names.slice(0, cap).join(', ');
  return `${issue.text}: ${listed}${names.length > cap ? `, +${names.length - cap} more` : ''}`;
}

function showSpecs(measured) {
  el.stats.replaceChildren(...specLines(measured).map((text) => {
    const line = document.createElement('div');
    line.textContent = text;
    return line;
  }));
  const { issues } = measured;
  el.issues.hidden = !issues.length;
  el.issues.textContent = issues.length
    ? `⚠ ${issueText(issues[0])}${issues.length > 1 ? ` (+${issues.length - 1} more in the console)` : ''}`
    : '';
  // Every one, whole, where a bug report is copied from; the HUD holds one line.
  for (const issue of issues) {
    (issue.level === 'error' ? console.error : console.warn)(`preview: ${issueText(issue, Infinity)}`);
  }
}

/* --------------------------------------------------------------- lookdev --- */

// Lookdev is the area for dials that tune how the model READS in the preview
// and then write the result back into the GLB, rather than into this page --
// the normals dial below is its first and, for now, only occupant.
//
// Held back behind one flag instead of deleted. The dial works and its file
// side ships (`normalTexture.scale`, written by MeshConvert.set_glb_normal_scale
// through POST /settings), but a lone slider does not earn a permanent seat in
// a control bar that has to survive a phone-sized viewport, and lookdev worth
// exposing is a SET -- exposure, environment rotation, tone mapping -- tuned
// together. So the area stays wired and untested-by-eye rather than rotting:
// flip this to true and it returns exactly as it was.
//
// Adding the next dial: markup inside #lookdev, its own sync called from
// syncLookdev, and its element in that function's `controls` list so the panel
// keeps following its contents. Nothing else here counts the dials.
const LOOKDEV_ENABLED = false;

// Each dial hides itself when the model gives it nothing to do (the normals
// dial on a model with no baked normal map), and the panel follows them: an
// empty chrome row over the model is worse than no row.
function syncLookdev() {
  syncNormalScale();
  const controls = [el.normals];
  el.lookdev.hidden = !LOOKDEV_ENABLED || controls.every((control) => control.hidden);
}

// How strongly the normal maps read on the BAKED materials, and only those.
//
// A lightmap contributes irradiance with no direction in it -- three.js adds
// `lightMapTexel * intensity` to the diffuse term and never consults the
// normal -- so on a baked surface the normal map survives only through the
// environment's specular term (its diffuse is withheld from a baked surface,
// see patchBakedShader). Correct, and flat-looking on a matte surface: the
// detail is there and barely lit. This is the dial that brings it back without
// touching the bake or re-lighting the room, which is why it is hidden
// entirely when nothing is baked.
//
// Its home is the FILE, not this page: `normalTexture.scale` is core glTF, so
// GLTFLoader has already read the model's own value into `material.normalScale`
// and the save button writes the new one back the same way. Hence a sync FROM
// the model on every load rather than a value the page remembers -- open a GLB
// saved at 1.8 and the slider says 1.8, in this viewer and in any other.
// Keyed on a baked material that actually HAS a normal map, not merely on the
// model being baked: `normalScale` exists on every MeshStandardMaterial, so
// reading the first baked material would show 1.00 for a file saved at 1.8
// whenever that first material happens to carry no normal map -- and offering
// the dial at all on a bake with no normal maps anywhere is a control that
// cannot change the render.
function normalCarriers() {
  return lightmappedMaterials.filter((material) => material.normalMap);
}

function syncNormalScale() {
  const carriers = normalCarriers();
  const value = carriers.length ? carriers[0].normalScale.x : 1;
  el.normals.hidden = !carriers.length;
  el.normalScale.value = String(value);
  el.normalValue.textContent = value.toFixed(2);
  el.normalSave.disabled = true;
  el.normalSave.textContent = 'Save';
}

// The dial sets the MAGNITUDE and keeps each material's own sign on y.
// GLTFLoader negates `normalScale.y` on a material whose mesh carries no
// TANGENT -- every GLB this pipeline shipped before the DCC hand-offs pinned
// tangents, and any other producer's that omits them -- because the
// derivative frame it falls back to runs green the other way, so
// `set(value, value)` turned green over on every such normal map at the first
// touch (measured: the loader's (1, -1) became (1.5, 1.5)). `1 / y` rather
// than `y < 0`: the sign has to survive the dial passing through 0, and
// -0 < 0 is false.
function applyNormalScale(value) {
  for (const material of normalCarriers()) {
    material.normalScale.set(value, Math.sign(1 / material.normalScale.y) * value);
  }
  el.normalValue.textContent = value.toFixed(2);
  el.normalSave.disabled = false;
  el.normalSave.textContent = 'Save';
}

// Hands the value to the server, which writes it into the GLB with
// MeshConvert.set_glb_normal_scale. No reload follows: the page is already
// showing the value, and the write deliberately leaves the manifest version
// alone so saving does not bounce the model out from under the user.
async function saveNormalScale() {
  el.normalSave.disabled = true;
  el.normalSave.textContent = 'Saving…';
  try {
    const response = await fetch('settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ normal_scale: Number(el.normalScale.value) }),
    });
    if (!response.ok) throw new Error(response.statusText);
    const result = await response.json();
    el.normalSave.textContent = `Saved · ${result.materials?.normal_scale ?? 0}`;
  } catch (error) {
    // Left ENABLED on failure: the value is still only in the page, so the
    // one useful thing the user can do is try again.
    el.normalSave.textContent = 'Save failed';
    el.normalSave.disabled = false;
    console.warn('Normal scale not saved:', error);
  }
}

/* ------------------------------------------------------------- animation --- */

// A shot-split deliverable ships one clip per shot AND, on the Maya route, the
// whole-timeline take its FBX exporter keeps alongside them — so `animations[0]`
// is routinely the entire timeline rather than the first shot, and every clip's
// own keyframe times are rebased to zero, which loses where each shot sat.
// `extras.animation_web` (MeshConvert.apply_glb_animations) is the file's own
// answer: it marks the clips a shot declared, carries their authoring frame
// ranges, and names the one to open on. Without the block this still plays —
// the clips are listed in file order under their own names — it just cannot say
// which of them are shots.
let mixer = null;
// The deliverable's `animation_web` block, kept past setupAnimation: a script
// recording a clip needs the AUTHORING frame rate and frame numbers, and those
// live in the manifest rather than on the three.js clip (which knows only
// seconds). Null on a file that ships no manifest.
let animationManifest = null;
let clips = [];        // [{clip, meta}] in PICKER order — declared shots first
let action = null;
let clipIndex = -1;
// Autoplay, deliberately: in an immersive session the DOM overlay is not
// rendered at all, so a headset user has no transport to press. A preview that
// arrives paused would look like a preview with no animation in it.
let playing = true;
let scrubbing = false;
let lastTick = -1;   // last playhead position written to the DOM (0-1000)
// Last shot label written beside the playhead, so a segment change redraws the
// readout even when the playhead has not moved a visible amount — scrubbing
// slowly across a shot boundary is exactly when the label matters most, and it
// is the one case where the tick can repeat while the answer changes.
let lastShot = null;
// The synthetic whole-timeline entry, built from the shots when the file ships
// no continuous clip of its own (Animation Clips: "Shots Only"). Null while a
// real clip is selected — `activeSequence` is what the transport branches on,
// so a file that HAS a whole-timeline clip keeps the plain single-action path.
let sequence = null;
let activeSequence = null;
let sequenceTime = 0;      // playhead in seconds along the authoring span
let sequenceSegment = null;

// The frame range is what makes two clips that both start at t=0 tellable
// apart. "(full range)" is only said when something else IS a shot — with no
// shots at all, every clip is the full range and the label would be noise.
//
// "empty" is said whenever the deliverable says so: a declared shot whose range
// holds still bakes no curve, so it arrives named and carrying nothing. Picking
// it plays 0.00s, which reads as broken animation unless the label admits the
// clip itself is empty.
function clipLabel(entry, anyDeclared) {
  if (entry.sequence) {
    const s = entry.sequence;
    return `${s.name}  (${s.startFrame}–${s.endFrame}, ${s.segments.length} shots)`;
  }
  const meta = entry.meta;
  const empty = meta?.empty ? ', empty' : '';
  if (meta?.declared && typeof meta.start_frame === 'number') {
    return `${entry.clip.name}  (${meta.start_frame}–${meta.end_frame}${empty})`;
  }
  if (anyDeclared && !meta?.declared) return `${entry.clip.name}  (full range)`;
  return meta?.empty ? `${entry.clip.name}  (empty)` : entry.clip.name;
}

// --- authored alpha ramps (KHR_animation_pointer) ---------------------------
// glTF animates translation, rotation, scale and morph weights -- and nothing
// else. A material fade rides in `animations` only through KHR_animation_pointer,
// which lets a channel target any property by JSON pointer; the deliverable
// writes each authored ramp that way (MeshConvert.apply_glb_fades), on a
// material cloned per faded subtree so nothing else sampling it fades too.
// three.js does not implement the extension (checked against 0.180, well past
// the 0.169 pinned above): GLTFLoader SKIPS a channel with no `target.node`, so
// the clips arrive playable but silently minus their fades.
//
// This is the shim, and it is deliberately small: it translates the file's own
// pointer channels into native keyframe tracks on the loaded clips, and from
// then on the mixer plays a fade exactly the way it plays a translation -- same
// playhead, same scrub, same pause, no per-frame code and no frame arithmetic.
// The GLB is the single statement of the fade; the day three.js ships support,
// this function deletes and nothing else changes.
// The material properties a pointer can reach, and how each lane reaches the
// three.js material. One row per channel the exporter's table writes
// (pythontk `glb_fades.CHANNELS`): alpha is the fourth lane of the base colour
// factor and lands on `material.opacity`; a highlight is the whole VEC3
// emissive factor and lands on `material.emissive` as a colour track. Adding a
// channel there is adding a row here; the wiring below is shared.
const POINTER_BINDINGS = [
  {
    pointer: /^\/materials\/(\d+)\/pbrMetallicRoughness\/baseColorFactor$/,
    blended: true,
    track(mesh, material, times, output, count) {
      // The whole VEC4 is animated (glTF has no pointer to one component); the
      // alpha is its fourth lane. RGB is the material's own and is left to it.
      const alphas = new Float32Array(count);
      for (let k = 0; k < count; k += 1) alphas[k] = output.getW(k);
      return new THREE.NumberKeyframeTrack(`${mesh.uuid}.material.opacity`, times, alphas);
    },
  },
  {
    pointer: /^\/materials\/(\d+)\/emissiveFactor$/,
    blended: false,
    track(mesh, material, times, output, count) {
      // glTF factors are linear, as is the material's working colour space.
      const rgb = new Float32Array(count * 3);
      for (let k = 0; k < count; k += 1) {
        rgb[k * 3] = output.getX(k);
        rgb[k * 3 + 1] = output.getY(k);
        rgb[k * 3 + 2] = output.getZ(k);
      }
      return new THREE.ColorKeyframeTrack(`${mesh.uuid}.material.emissive`, times, rgb);
    },
  },
];

// A blended surface writes depth only while it is OPAQUE.
//
// glTF says nothing about depth, so GLTFLoader derives it: `alphaMode: BLEND`
// becomes `transparent = true, depthWrite = false`. That is right for a window
// and wrong for a solid object that merely happens to fade, and alphaMode is a
// property of the MATERIAL, not of the clip -- so an object that fades in
// during one shot renders with depth writes off in all twelve. With no depth
// written, a closed mesh draws its far faces over its near ones in index
// order, which reads exactly like inverted normals (measured on the production
// assembly: 15 materials, every one of them depthWrite false at full alpha).
//
// Restoring it wholesale would be the opposite bug -- an object at alpha 0.2
// would punch a hole in whatever is drawn behind it -- so the state follows
// the alpha the mixer is currently driving. This is DERIVED state, not a
// second copy of the fade: it reads whatever opacity the mixer set, so
// scrubbing, pausing and clip switches are all covered without any of them
// being named here. `onBeforeRender` runs before the draw's GL state is set,
// so the change lands on the same frame; `this` is the mesh, and it is one
// shared function rather than a closure per mesh.
function depthFromOpacity() {
  this.material.depthWrite = this.material.opacity >= 0.999;
}

// The rule is per MATERIAL but has to be installed on every MESH wearing one.
// The track binding needs a single representative mesh per material instance
// (two would drive the same property twice a frame), and a faded subtree can
// hold several meshes sharing its cloned material -- so installing only on the
// representative leaves the rule stale the moment that one is frustum-culled
// and another is not.
function installDepthRule(scene, materials) {
  if (!materials.size) return;
  scene.traverse((node) => {
    if (node.isMesh && !Array.isArray(node.material) && materials.has(node.material)) {
      node.onBeforeRender = depthFromOpacity;
    }
  });
}

// Returns `{tracks, materials}`: the tracks wired (one per clip, channel and
// material instance) and the distinct glTF materials they animate -- the HUD's
// count, since a fade in twelve shots is one faded material, not twelve.
async function wirePointerTracks(gltf) {
  const parser = gltf.parser;
  const defs = parser.json.animations || [];
  if (!defs.length) return { tracks: 0, materials: 0 };

  // glTF material index -> the three.js materials the loader built from it.
  // Through the loader's own association map, which it carries onto the
  // variants it clones (vertex colours, flat shading), rather than by name:
  // the cloned fade material keeps its source's NAME on purpose, so the
  // lightmap pass -- which binds by name -- still recognises it.
  const byIndex = new Map();
  gltf.scene.traverse((node) => {
    // A multi-material mesh has no `.material.opacity` to bind; the loader
    // never builds one from a GLB (each primitive becomes its own Mesh), so
    // this is a foreign-file guard rather than a path the pipeline takes.
    if (!node.isMesh || Array.isArray(node.material)) return;
    for (const material of materialsOf(node)) {
      const index = parser.associations.get(material)?.materials;
      if (index === undefined) continue;
      if (!byIndex.has(index)) byIndex.set(index, new Map());
      // One binding per distinct material INSTANCE: two meshes sharing an
      // instance would otherwise drive the same property twice a frame.
      if (!byIndex.get(index).has(material)) byIndex.get(index).set(material, node);
    }
  });

  let wired = 0;
  const blended = new Set();
  const animated = new Set();  // glTF material indices a track now drives
  for (let i = 0; i < defs.length; i += 1) {
    const clip = gltf.animations[i];
    if (!clip) continue;
    for (const channel of defs[i].channels || []) {
      const target = channel.target || {};
      if (target.path !== 'pointer') continue;
      const pointer = target.extensions?.KHR_animation_pointer?.pointer || '';
      let binding = null;
      let match = null;
      for (const candidate of POINTER_BINDINGS) {
        match = candidate.pointer.exec(pointer);
        if (match) { binding = candidate; break; }
      }
      if (!binding) continue;
      const owners = byIndex.get(Number(match[1]));
      if (!owners) continue;
      animated.add(Number(match[1]));
      const sampler = defs[i].samplers[channel.sampler];
      const [input, output] = await Promise.all([
        parser.getDependency('accessor', sampler.input),
        parser.getDependency('accessor', sampler.output),
      ]);
      const times = Array.from(input.array);
      for (const [material, mesh] of owners) {
        // Bound by uuid rather than name: glTF names are not unique (the
        // production assembly ships two `prop533`), and a name binding would
        // drive the first match and leave the rest at full alpha.
        clip.tracks.push(binding.track(mesh, material, times, output, input.count));
        if (binding.blended) {
          // alphaMode BLEND already set transparent + depthWrite off at load;
          // stated here too so a file whose clone lost it still fades.
          material.transparent = true;
          blended.add(material);
        }
        wired += 1;
      }
    }
    clip.resetDuration();
  }
  installDepthRule(gltf.scene, blended);
  return { tracks: wired, materials: animated.size };
}

// Shots laid back onto the timeline they were cut from. The clips carry their
// own frame range, so the sequence is reconstructible without the stack they
// came from -- which is the whole point: shipping both halves costs the file
// the same performance twice (66.5 MB on the production assembly), and the
// half a shot-switching player never reads is the continuous one.
//
