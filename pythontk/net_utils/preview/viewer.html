<!doctype html>
<!--
  Live WebXR preview page served by pythontk.PreviewServer.

  Polls /manifest.json and swaps the referenced asset in whenever the version
  changes, so a tab left open in a headset keeps up with the DCC without any
  interaction. Served from localhost, which is a secure context, so
  `navigator.xr` is available and the VR button starts a real immersive-vr
  session on any PC-tethered headset. With no headset attached the same page is
  an ordinary orbit-controls preview.

  A caller-supplied serve root is treated as a working copy: an index.html
  already there is never overwritten, so edits made in place survive a restart.
  The default (temp) root is re-synced from this file on every start and every
  publish, so an edit here reaches an already-running session on its next push.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Live Preview</title>
<!--
  Inline, so the browser never issues its automatic /favicon.ico request. The
  serve root holds the deliverable and nothing else, so that request 404s, and
  a red "Failed to load resource" in the console of every preview session is a
  false lead for anyone opening devtools because something IS wrong.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2315171a'/%3E%3Cpath d='M8 2.6l4.6 2.7v5.4L8 13.4 3.4 10.7V5.3z' fill='none' stroke='%237cc3ff' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  For a reader that cannot run this page -- a tool, or someone's agent
  comparing this scene with their own: scene.json describes the published
  scene as data (its glTF JSON, and the lighting recipe this page renders it
  with). Never fetched by the page itself.
-->
<link rel="alternate" type="application/json" href="scene.json" title="This scene as data">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #15171a; font: 13px/1.5 system-ui, sans-serif; color: #e8eaed; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px;
    background: rgba(20, 22, 26, .82); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 8px; backdrop-filter: blur(8px); pointer-events: none;
    max-width: min(46ch, calc(100vw - 24px));
  }
  #title { font-weight: 600; margin-bottom: 2px; }
  #stats, #hint { color: #9aa0a6; font-size: 12px; }
  #hint { margin-top: 6px; }
  /* What the load found wrong with the deliverable, in the page's warning
     amber: the render cannot show it (a baked object that bound nothing looks
     like an unbaked one), so the HUD has to. */
  #issues { color: #f2b84b; font-size: 12px; margin-top: 4px; }
  #issues[hidden] { display: none; }
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7a7f85; margin-right: 7px; vertical-align: middle;
  }
  #status.live::before { background: #34d058; }
  #status.error::before { background: #f2504b; }
  /* Wraps: the row carries the lookdev panel, and a narrow viewport (a phone
     holding a headset preview) would otherwise push the last control off. */
  #controls {
    position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px;
    flex-wrap: wrap; max-width: calc(100vw - 24px);
  }
  /* Above the button row, and only while the model has clips. Its own row
     because a scrubber needs width the button bar has no room for. */
  #anim {
    position: fixed; bottom: 56px; left: 12px; display: flex; gap: 8px;
    align-items: center; max-width: calc(100vw - 24px);
    /* Wraps for the same reason the button row does, and now needs to: the
       readout carries the current shot's name, so a narrow viewport (a phone
       holding a headset preview) would otherwise squeeze the scrubber to
       nothing to fit it. */
    flex-wrap: wrap;
  }
  #anim[hidden] { display: none; }
  button.ui, select.ui {
    font: inherit; color: #e8eaed; background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  button.ui:hover, select.ui:hover { border-color: rgba(255, 255, 255, .34); }
  select.ui { max-width: 30ch; }
  #scrub { width: 220px; accent-color: #6fb3ff; cursor: pointer; }
  #clipTime {
    color: #9aa0a6; font-size: 12px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Lookdev -- the area for dials that tune how the model READS and write the
     result back into the GLB (see LOOKDEV_ENABLED). A transparent row rather
     than one chrome box: each dial wears its own, so the second and third land
     beside the first without any of them being restyled. */
  #lookdev { display: flex; align-items: center; gap: 8px; }
  #lookdev[hidden] { display: none; }
  /* A dial rather than a toggle, so it wears the button chrome without the
     pointer affordance -- only the slider inside it is grabbable. The chrome is
     restated because `button.ui, select.ui` does not match a span, and without
     it the control renders as bare text over the model. */
  #normals {
    display: flex; align-items: center; gap: 8px; cursor: default;
    color: #9aa0a6; font: inherit;
    background: rgba(20, 22, 26, .82);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px;
    padding: 4px 8px 4px 14px;
  }
  #normals[hidden] { display: none; }
  #normalScale { width: 110px; accent-color: #6fb3ff; cursor: pointer; }
  #normalValue { font-variant-numeric: tabular-nums; color: #e8eaed; min-width: 3ch; }
  #normalSave { padding: 4px 10px; }
  #normalSave:disabled { opacity: .45; cursor: default; border-color: rgba(255, 255, 255, .16); }
  /* The page's ONE modal, handed to scripts as `viewer.showDialog` for the
     same reason `addButton` exists: a script that asked for options with
     `window.confirm` would wear the browser's chrome over a dark preview, and
     one that built its own box would drift from this page's. Dark backdrop
     rather than a bare panel — it says the page behind it is not taking input,
     which matters because the transport keeps rendering underneath. */
  #dialog {
    /* Above VRButton, which sets z-index 999 inline: a control floating
       over the backdrop is one the modal did not actually take. */
    position: fixed; inset: 0; z-index: 1000; display: flex;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 11, 13, .55); backdrop-filter: blur(3px);
  }
  #dialog[hidden] { display: none; }
  #dialog form {
    display: flex; flex-direction: column; gap: 14px;
    width: min(46ch, 100%);
    padding: 16px 18px; border-radius: 10px;
    background: rgba(20, 22, 26, .96); border: 1px solid rgba(255, 255, 255, .16);
  }
  #dialogTitle { font-weight: 600; }
  #dialogFields { display: flex; flex-direction: column; gap: 9px; }
  /* align-items: flex-start so a label that wraps keeps its box on the first
     line rather than centring it against three lines of text. */
  #dialogFields label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
  #dialogFields input { margin: 3px 0 0; accent-color: #6fb3ff; cursor: pointer; }
  #dialogFields .note { color: #9aa0a6; font-size: 12px; }
  /* A choice row reads as "Label ........ [picker]": centred, because the
     picker is taller than a line of text, and not a pointer -- the label is
     not a toggle the way a checkbox row's is. */
  #dialogFields label.choice { align-items: center; justify-content: space-between; cursor: default; }
  #dialogButtons { display: flex; gap: 8px; justify-content: flex-end; }
  /* Windows (`viewer.window`) and script panels (`viewer.addPanel`): rows of
     label and value in the HUD's chrome, stacked top-right where nothing of
     the page's own sits. Takes pointer events, unlike the HUD, so a value can
     be selected and copied. */
  #panels {
    position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column;
    gap: 8px; width: min(44ch, calc(100vw - 24px)); max-height: calc(100vh - 120px);
    pointer-events: none;
  }
  /* A column whose ROWS scroll, so the title and the footer's buttons stay in
     view however long the panel grows. */
  .panel {
    pointer-events: auto; display: flex; flex-direction: column; min-height: 0;
    overflow: hidden; padding: 10px 14px; font-size: 12px;
    background: rgba(20, 22, 26, .9); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 8px; backdrop-filter: blur(8px);
  }
  .panel[hidden] { display: none; }
  .panel header { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .panel .rows {
    display: grid; grid-template-columns: max-content 1fr; gap: 1px 12px;
    min-height: 0; overflow: auto;
  }
  .panel .key { color: #9aa0a6; }
  .panel .value { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .panel .heading { grid-column: 1 / -1; margin-top: 7px; font-weight: 600; }
  .panel .line { grid-column: 1 / -1; color: #9aa0a6; }
  .panel .warn { color: #f2b84b; }
  .panel footer { display: flex; gap: 8px; margin-top: 8px; }
  .panel footer:empty { display: none; }
  .panel footer button.ui { padding: 4px 10px; }
  /* A panel's sliders (`addSlider`): their own grid under the rows, so a
     script refreshing its rows never takes a slider out from under a drag. */
  .panel .controls { margin-top: 6px; }
  .panel .controls:empty { display: none; }
  .panel .slider { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .panel .slider input { flex: 1; min-width: 0; accent-color: #6fb3ff; cursor: pointer; }
  .panel .slider output { font-variant-numeric: tabular-nums; min-width: 7ch; text-align: right; }
  /* A switch (`addToggle`): its box and label across the controls' grid. */
  .panel .toggle {
    grid-column: 1 / -1; display: flex; gap: 8px; align-items: center;
    cursor: pointer; padding: 2px 0;
  }
  .panel .toggle[hidden] { display: none; }
  .panel .toggle input { margin: 0; accent-color: #6fb3ff; cursor: pointer; }
  /* The category windows (windows.js): one per bar button, its parts as
     sections under one header. The SECTIONS scroll, so the header and its
     close stay in view however long a window grows. */
  #categories { display: contents; }
  button.ui.category.open { border-color: rgba(111, 179, 255, .6); }
  button.ui.category.busy { color: #7cc3ff; }
  .panel.window header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel.window .close {
    font: inherit; font-size: 15px; line-height: 1; color: #9aa0a6; background: none;
    border: 0; padding: 0 2px; cursor: pointer;
  }
  .panel.window .close:hover { color: #e8eaed; }
  /* The glyph is drawn here, not written: the header's text is the category. */
  .panel.window .close::before { content: "×"; }
  .panel.window .sections {
    display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto;
  }
  .panel.window .section[hidden] { display: none; }
  .panel.window .section > .heading { font-weight: 600; margin-bottom: 2px; }
  .panel.window .section .rows { overflow: visible; }
  /* VRButton positions itself bottom-center with inline styles; leave it be. */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div id="title">Preview</div>
  <div id="status">connecting…</div>
  <div id="stats"></div>
  <div id="issues" hidden></div>
  <div id="hint"></div>
</div>

<div id="panels"></div>

<div id="anim" hidden>
  <select class="ui" id="clipSelect" title="Which animation clip to play. Shots declared in the DCC are listed first; a clip marked (full range) is the whole timeline the exporter kept alongside them. On a deliverable that ships only shots, FULL SEQUENCE plays them all in order on the timeline they were cut from."></select>
  <button class="ui" id="playToggle" title="Play / pause (space)">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1"
         title="Scrub the current clip. On FULL SEQUENCE the readout beside it names the shot the playhead is standing in, and marks a gap between shots as a hold.">
  <span id="clipTime"></span>
</div>

<div id="controls">
  <button class="ui" id="frameBtn" title="Re-frame the camera on the model">Frame</button>
  <!-- One button per category window: View, Environment, Inspect, Export,
       Rig (kernel/windows.js). Each appears once something files under it. -->
  <div id="categories"></div>
  <div id="lookdev" hidden>
    <span class="ui" id="normals" hidden
          title="How strongly the normal maps read on the baked materials. A lightmap carries no direction, so on its own it cannot show a normal map; the preview relieves the bake along the key-light direction so the map reads the way it would under a runtime light. 0 is the pure bake. Save writes the value into the GLB itself as normalTexture.scale.">
      Normals
      <input id="normalScale" type="range" min="0" max="4" step="0.05" value="1"
             title="Normal map strength on baked materials">
      <span id="normalValue">1.00</span>
      <button class="ui" id="normalSave" disabled
              title="Write this strength into the GLB as normalTexture.scale, so it ships with the file">Save</button>
    </span>
  </div>
</div>

<div id="dialog" hidden>
  <form id="dialogForm">
    <div id="dialogTitle"></div>
    <div id="dialogFields"></div>
    <div id="dialogButtons">
      <button class="ui" type="button" id="dialogCancel">Cancel</button>
      <button class="ui" type="submit" id="dialogConfirm">OK</button>
    </div>
  </form>
</div>

<script>
  // Boot watchdog — a CLASSIC script on purpose. The viewer rides module
  // imports from unpkg.com (three.js), and when that fetch is blocked (offline
  // box, default-deny outbound firewall — a real deployment here) the module
  // graph simply never executes: no error event, no status change, just a dark
  // page stuck on "connecting…" with the actual failure invisible. The kernel's
  // composition root flips the flag once every import has resolved; if it
  // hasn't within 8s, say what is actually wrong. A slow CDN that boots later
  // overwrites this on next poll.
  setTimeout(() => {
    if (window.__viewerBooted) return;
    const status = document.getElementById('status');
    status.textContent = 'three.js failed to load — needs unpkg.com.';
    status.className = 'error';
  }, 8000);
</script>

<!--
  The page is markup; the viewer is the kernel/ modules this one imports
  (kernel/main.js, the composition root). The server serves both from its
  root, and the features it activates (features/) from the same tree.
-->
<script type="module" src="kernel/main.js"></script>
</body>
</html>
