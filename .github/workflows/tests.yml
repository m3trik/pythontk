name: Tests

# Pythontk is supported on Windows AND Linux (its DCCs -- Maya, Blender -- ship
# for both), so the suite runs on both. Platform-specific tests gate themselves
# (win32 branches patch ctypes.windll in; X11/procfs tests skip without Linux).

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # libopengl0: pymeshlab's IO plug-ins fail to load without it (every
        # mesh op then fails "Unknown format"). libgl1: OpenCascade's wheel
        # links libGL.so.1 and libX11.so.6 (its bundled TKOpenGl), so OCP does
        # not import without it. xvfb: a private X server for the Tk sidecar
        # and the X11 client tests -- never a real desktop.
        uses: m3trik/m3trik/.github/actions/apt-install@main
        with:
          packages: libopengl0 libgl1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy Pillow
          # pymeshlab backs the optional MeshOps engine. Installed in CI on
          # purpose: dep-gated suites silently run their skip branches only,
          # so without it the real mesh-op paths would never execute anywhere.
          pip install pymeshlab
          # OpenCascade backs CadImport, for the same reason: without it every
          # conversion test skips (test_cad_import's CI guard fails then). The
          # cad extra, so its bound lives in pyproject.toml alone.
          pip install -e ".[cad]"

      - name: Install the Khronos glTF Validator (a tools folder of the job's own)
        # The open-format rule's proof (CODE_STANDARD section 15): the record
        # and GLB tests run the reference validator. Installed into the
        # runner's temp, never a user's ~/.pythontk/tools, and named for the
        # later steps through PYTHONTK_TOOLS_DIR (AppInstaller's target). A
        # failed install fails here; a test that still finds none fails too
        # (conftest.gltf_validator, under CI), so the proof never skips.
        shell: bash
        run: |
          echo "PYTHONTK_TOOLS_DIR=${RUNNER_TEMP}/pythontk-tools" >> "$GITHUB_ENV"
          PYTHONTK_TOOLS_DIR="${RUNNER_TEMP}/pythontk-tools" python -c "import sys; from pythontk import GltfValidator; exe = GltfValidator.resolve(auto_install=True, prompt=False); print(exe); sys.exit(0 if exe else 'the glTF Validator could not be installed')"

      - name: Run tests with coverage (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest --tb=short -v --cov=pythontk --cov-report=xml --cov-report=term tests/

      - name: Run tests with coverage (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pytest --tb=short -v --cov=pythontk --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        # A report, never a gate. `fail_ci_if_error` judges only the uploader's
        # result, and the action dies before the uploader runs when codecov's
        # endpoints refuse TLS (2026-10-04: an expired certificate failed both
        # legs of a green suite, and the required `test` with them), so the
        # step itself must not fail the leg.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test:
    # The one check branch protection requires, under its long-standing name.
    # A matrix job reports one check per leg -- `suite (windows-latest)`,
    # `suite (ubuntu-latest)` -- never a bare `test`, so a required `test` on
    # the matrix itself would never attach and every release PR would sit
    # BLOCKED. This job is green only when every leg is, so both platforms gate
    # the PR, and publish.yml (which calls this workflow) gates on them too.
    # `always()`, not `!cancelled()`: a cancelled run would SKIP this job, and
    # branch protection counts a skipped required check as passed.
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every platform leg passed
        run: |
          echo "suite result: ${{ needs.suite.result }}"
          test "${{ needs.suite.result }}" = "success"

  lint:
    # ``ruff check`` only -- NOT ``ruff format --check``. The lint rule set is
    # small and the tree is clean against it, so this gates real defects
    # (undefined names, unused imports) from day one. Formatting is a
    # separate question: 114 files predate the current ruff and would fail
    # a format gate today, which would make this job red on arrival and
    # therefore ignored. Pinned, because an unpinned ruff turns an upstream
    # rule addition into a red PR nobody changed.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.15.17

      - name: ruff check
        run: ruff check .

  api-retirements:
    # A retirement past its window fails: a ptk.Deprecation alias or retired
    # keyword whose remove_in this package's __version__ has reached and whose
    # calendar window has closed (m3trik/scripts/check_api_surface.py). Its own
    # job because the script lives in the m3trik repo and reads with pythontk's
    # ApiSurface, so the repos are checked out as siblings. Source only: no
    # install, no DCC, no git history. Nothing generated is committed: the
    # API is searched live (api.search).
    name: API retirements on time
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: pythontk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Retirements on time
        run: python m3trik/scripts/check_api_surface.py pythontk --check

  js-types:
    # The WebXR preview's runtime (net_utils/preview kernel/ + features/) is
    # plain ES modules typed with JSDoc and served as written, so `tsc
    # --checkJs` is the one check that its modules, the published `viewer` API
    # and the generated record typedefs still agree. m3trik's own CI runs the
    # same gate, but only on m3trik's pushes: a pythontk-only JS change would
    # otherwise reach PyPI unchecked. Same sibling layout as api-retirements.
    # `TSC` pins TypeScript's major; exit 2 (no compiler) fails the step.
    name: JavaScript types (tsc --checkJs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: pythontk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript type check
        env:
          TSC: npx --yes -p typescript@5 tsc
        run: python m3trik/scripts/check_js_types.py

  layer-rules:
    # check_layers.py (m3trik): this package's declared layer order and
    # dependencies, and the product rule -- no library imports tentacle, so
    # each stays usable without it (CODE_STANDARD section 3). AST-only: no
    # install, no DCC.
    name: Layer rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: pythontk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Layer order, dependencies and the product rule
        run: python m3trik/scripts/check_layers.py --check pythontk
