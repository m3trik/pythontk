name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pythontk/**'
      - 'pyproject.toml'
  
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Skip Upload)'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*["\x27]\K[^"\x27]+' pythontk/__init__.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Exact-membership check: publish only if THIS version is absent
          # from PyPI. (Comparing against the latest release only re-entered
          # the publish path — and re-fired the registry dispatch —
          # whenever main held an older-but-published version. A transient
          # network failure falls through to publish=true, which is safe:
          # twine --skip-existing dedupes the upload.)
          if curl --fail --silent --output /dev/null "https://pypi.org/pypi/pythontk/$VERSION/json"; then
            echo "v$VERSION already on PyPI"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          # Start from a clean tree. setuptools reuses a stale build/lib and
          # *.egg-info from an earlier run, so a file deleted since then can
          # still be copied into the wheel -- reproduced as a poisoned wheel
          # that passed every other check.
          rm -rf dist build *.egg-info
          python -m build --wheel
          python -m twine check dist/*
      
      - name: Verify Install
        if: steps.version.outputs.publish == 'true'
        # Install WITH dependencies: proves the wheel's pins resolve on PyPI
        # exactly as users will install them. Retries absorb index-propagation
        # lag when an upstream package published minutes earlier in the same
        # release cascade (~3.5 min cover; the old 3x30s was measured too
        # short on 2026-08-13 — the simple index lagged past it and the
        # chain aborted on "No matching distribution found").
        run: |
          installed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if pip install dist/*.whl; then installed=true; break; fi
            if [ "$attempt" -lt 8 ]; then
              echo "Install attempt $attempt failed; retrying in 30s (index propagation lag?)"
              sleep 30
            fi
          done
          if [ "$installed" != true ]; then
            echo "::error::Wheel install (with dependencies) failed"
            exit 1
          fi
          # Installing only proves the pins RESOLVE. Import the installed
          # wheel too, from a directory with no pythontk source in it -- run
          # from the checkout, the repo would shadow the install and the
          # check would pass on source that was never packaged. Four runtime
          # data files resolve relative to __file__ and two of them degrade
          # silently when missing, so the import also asserts they shipped.
          cd "$RUNNER_TEMP"
          python -c "
          import pythontk, os
          print('imported pythontk', pythontk.__version__, 'from', pythontk.__file__)
          root = os.path.dirname(pythontk.__file__)
          shipped = {
              os.path.relpath(os.path.join(d, f), root).replace(os.sep, '/')
              for d, _, fs in os.walk(root) for f in fs
              if not f.endswith(('.py', '.pyc'))
          }
          missing = {
              'core_utils/engines/shots/manifest/mapping/default.json',
              'core_utils/execution_monitor/task_indicator.gif',
              'geo_utils/shadow_horizon.glsl',
              'net_utils/preview/viewer.html',
          } - shipped
          assert not missing, f'wheel is missing runtime data files: {sorted(missing)}'
          print(f'{len(shipped)} non-.py data file(s) present in the wheel')
          "

      - name: Publish
        if: steps.version.outputs.publish == 'true' && inputs.dry_run != true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/* --skip-existing
      
      - name: Trigger API registry refresh
        if: steps.version.outputs.publish == 'true' && inputs.dry_run != true
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.REPO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/m3trik/m3trik/dispatches \
            -d '{"event_type":"refresh_api_registry","client_payload":{"package":"pythontk"}}'
      
      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.publish }}" == "true" ]; then
            echo "Published pythontk v${{ steps.version.outputs.version }}"
          else
            echo "v${{ steps.version.outputs.version }} already on PyPI"
          fi
