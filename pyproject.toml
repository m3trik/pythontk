[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontk"
dynamic = ["version", "readme"]
description = "Foundation layer of a DCC-tooling ecosystem: composable primitives for files, strings, iteration, math, geometry, images, video, audio, and networking, plus shared class mixins and package infrastructure."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Dependencies
#
# numpy carries a FLOOR and deliberately no ceiling.
#
# The floor is the oldest release any supported host ships (measured 2026-08-06:
# Maya 2025 = 1.24.4 on py3.11, Blender 5.1 = 2.3.4 on py3.13), so it can never
# force an upgrade *inside* a DCC -- which is the one thing a bound here must
# not do, since the host's interpreter is not ours to re-resolve.
#
# A ceiling cannot be expressed at all. Environment markers see the interpreter,
# never the host application, and the two hosts want OPPOSITE bounds: `numpy<2`
# would force a DOWNGRADE inside Blender. Where a host ships no numpy of its own
# -- a `--target` install into an empty directory -- pip resolves 2.x, and
# extensions compiled against 1.x then refuse to load ("module compiled using
# NumPy 1.x cannot be run in NumPy 2.x"). That case is handled at install time
# with `--no-deps`, documented under Install in docs/README.md; it is not
# something this file can decide for every host at once.
dependencies = ["numpy>=1.24", "Pillow>=9.1"]

# PyMeshLab backs only MeshOps (mesh measure/repair/remesh/decimate/bake).
# It is a heavy binary wheel, so it stays opt-in: everything else works
# without it, and MeshOps degrades to MeshOps.available() == False.
# Floor 2023.12: the AbsoluteValue -> PureValue rename this wrapper relies on.
# Install with the extra when you want it:  pip install pythontk[mesh]
[project.optional-dependencies]
mesh = ["pymeshlab>=2023.12"]

[project.urls]
Homepage = "https://github.com/m3trik/pythontk"
Repository = "https://github.com/m3trik/pythontk"

[tool.setuptools.dynamic]
version = {attr = "pythontk.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pythontk*"]

[tool.setuptools.package-data]
# Keep byte-identical to the recursive-include line in MANIFEST.in -- see the
# note there. Gated by test_packaging_metadata.TestDataFileParity.
"*" = ["*.gif", "*.glsl", "*.html", "*.js", "*.json", "*.md", "*.png", "*.txt", "*.ui"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
